<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стеклянная кабина — полёт над горами</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Лёгкий самолёт над процедурными горами: вид из кабины, пилотажный дисплей с синтетическим рельефом, карта с предупреждением о земле, автопилот.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#17191C;
    --bezel:#26292D;
    --text:#E8ECEF;
    --dim:#A9B1B8;
    --cyan:#35E0F0;
    --magenta:#F04BD8;
    --green:#4BE36A;
    --amber:#FFB321;
    --red:#FF4040;
    --disp:"Jura", "Manrope", system-ui, sans-serif;
    --ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0C0D0F;color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:0}
  #hud{z-index:1;touch-action:none}
  .softkeys{position:fixed;z-index:2;display:flex;gap:6px}
  .sk{min-width:58px;height:34px;padding:0 8px;border-radius:5px;border:1px solid #3A3F45;cursor:pointer;
    background:linear-gradient(180deg,#34383D,#23262A);color:#DDE3E8;font:600 12px/1 var(--disp);letter-spacing:.06em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.5);transition:transform .08s,background .2s,color .2s}
  .sk:active{transform:translateY(1px)}
  .sk[aria-pressed=true]{color:#0C0D0F;background:linear-gradient(180deg,#9EF2FA,#35E0F0)}
  .sk:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .help{position:fixed;z-index:2;right:18px;top:14px;max-width:330px;font:500 13px/1.5 var(--ui);color:#F2F5F7;
    background:rgba(12,14,16,.72);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;transition:opacity .8s}
  .help b{font-weight:700;color:#fff}
  .help kbd{font:700 12px/1 var(--disp);border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:1px 4px}
  .help.faded{opacity:0;pointer-events:none}
  .brand{position:fixed;z-index:2;left:20px;top:14px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.45)}
  .brand h1{font:700 26px/1 var(--disp);letter-spacing:.06em;color:#fff;text-transform:uppercase}
  .brand p{font:500 14px/1.4 var(--ui);color:#E6EBEF;margin-top:5px;max-width:380px}
  .thr{display:none;position:fixed;z-index:2;right:10px;width:44px;border-radius:22px;background:rgba(12,14,16,.7);border:1px solid rgba(255,255,255,.15);touch-action:none}
  .thr .knob{position:absolute;left:4px;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#F2F5F7,#9AA3AB)}
  .thr span{position:absolute;left:0;right:0;top:-20px;text-align:center;font:700 12px/1 var(--disp);color:#fff}
  @media (max-width:760px){
    .help{display:none}
    .brand h1{font-size:19px}
    .brand p{display:none}
    .thr{display:block}
    .sk{min-width:48px;height:36px;font-size:12px}
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="hud" aria-label="Кабина: пилотажный дисплей и карта"></canvas>
<div class="brand">
  <h1>Стеклянная кабина</h1>
  <p>«Стриж» идёт над горами по&nbsp;маршруту. Возьмите управление — автопилот отключится.</p>
</div>
<div class="help" id="help">
  <b>На себя</b> — <kbd>↓</kbd> или <kbd>S</kbd>, <b>от себя</b> — <kbd>↑</kbd> или <kbd>W</kbd> · <b>крен</b> — <kbd>←</kbd><kbd>→</kbd> или <kbd>A</kbd><kbd>D</kbd><br>
  <b>Газ</b> — <kbd>+</kbd> <kbd>−</kbd> · <b>закрылки</b> — <kbd>F</kbd> · <b>автопилот</b> — <kbd>P</kbd><br>
  Можно тянуть мышью по лобовому стеклу — как штурвал.
</div>
<div class="softkeys" id="skPFD"></div>
<div class="softkeys" id="skMFD"></div>
<div class="thr" id="thr"><span id="thrTxt">72%</span><div class="knob" id="thrKnob"></div></div>

<script>
'use strict';
/* =====================================================================
   Стеклянная кабина. WebGL: вид из кабины и синтетический рельеф PFD.
   Canvas 2D: рамка панели, символика PFD, карта с относительным
   рельефом и профилем, приборы двигателя. Упрощённая модель полёта
   «материальная точка + углы», автопилот по маршруту.
   ===================================================================== */
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const wrapPi = (a) => { if (!Number.isFinite(a)) return 0; const t = (a + Math.PI) % (2 * Math.PI); return (t < 0 ? t + 2 * Math.PI : t) - Math.PI; };
const SHOT = !!window.__SHOT__;

// ---------------------------------------------------------------------
// Рельеф: периодический шум (мир повторяется без швов)
// ---------------------------------------------------------------------
const TS = 192, CELL = 213.33, WORLD = TS * CELL; // ≈ 40,96 км
const WATER = 260;
function hash2(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noiseP(x, y, P) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const w = (a, b) => hash2(((a % P) + P) % P, ((b % P) + P) % P);
  return lerp(lerp(w(xi, yi), w(xi + 1, yi), u), lerp(w(xi, yi + 1), w(xi + 1, yi + 1), u), v);
}
const H = new Float32Array(TS * TS);
(function genTerrain() {
  for (let j = 0; j < TS; j++) for (let i = 0; i < TS; i++) {
    let base = 0, amp = 0.5, s = 48;
    for (let o = 0; o < 5; o++) { base += amp * noiseP(i / s, j / s, TS / s); amp *= 0.5; s /= 2; }
    let ridge = 0; amp = 0.6; s = 32;
    for (let o = 0; o < 4; o++) { const n = noiseP(i / s + 17, j / s + 5, TS / s); ridge += amp * Math.pow(1 - Math.abs(2 * n - 1), 2); amp *= 0.5; s /= 2; }
    const mask = Math.pow(noiseP(i / 64 + 3, j / 64 + 9, TS / 64), 1.3);
    H[j * TS + i] = 120 + Math.pow(base, 1.7) * 1250 + ridge * mask * 2000;
  }
})();
const hAt = (i, j) => H[(((j % TS) + TS) % TS) * TS + (((i % TS) + TS) % TS)];
function heightAt(x, z) {
  const gx = x / CELL, gz = z / CELL, i = Math.floor(gx), j = Math.floor(gz), fx = gx - i, fz = gz - j;
  return lerp(lerp(hAt(i, j), hAt(i + 1, j), fx), lerp(hAt(i, j + 1), hAt(i + 1, j + 1), fx), fz);
}
// аэродромы: ищем пологие низины в трёх частях мира и выравниваем площадку
const AIRFIELDS = [];
(function placeAirfields() {
  const names = ['Кедровый', 'Озёрное', 'Сосновка'];
  const zones = [[0.1, 0.1, 0.45, 0.45], [0.55, 0.2, 0.9, 0.55], [0.2, 0.6, 0.6, 0.92]];
  zones.forEach(([x0, z0, x1, z1], k) => {
    let best = null;
    for (let j = Math.floor(z0 * TS); j < z1 * TS; j += 2) for (let i = Math.floor(x0 * TS); i < x1 * TS; i += 2) {
      const h = hAt(i, j);
      if (h < WATER + 40) continue;
      let rough = 0; for (let d = -3; d <= 3; d++) rough += Math.abs(hAt(i + d, j) - h) + Math.abs(hAt(i, j + d) - h);
      const sc = h * 0.6 + rough * 2.2;
      if (!best || sc < best.sc) best = { sc, i, j, h };
    }
    const hdg = [30, 110, 160][k] * DEG;
    const af = { name: names[k], x: best.i * CELL, z: best.j * CELL, elev: best.h + 4, hdg, len: 1300, wid: 36 };
    for (let dj = -7; dj <= 7; dj++) for (let di = -7; di <= 7; di++) {
      const d = Math.hypot(di, dj) / 7; if (d > 1) continue;
      const ii = (((best.i + di) % TS) + TS) % TS, jj = (((best.j + dj) % TS) + TS) % TS;
      const w = Math.pow(1 - d, 0.6);
      H[jj * TS + ii] = lerp(H[jj * TS + ii], af.elev - 4, w);
    }
    AIRFIELDS.push(af);
  });
})();
const ROUTE = [1, 2, 0];

// ---------------------------------------------------------------------
// Самолёт: состояние и модель полёта
// ---------------------------------------------------------------------
const AC = { m: 1100, S: 16.2 };
const plane = { x: 0, z: 0, h: 1950, V: 58, gam: 0, psi: 0, th: 2.4 * DEG, phi: 0, thr: 0.74, flaps: 0, alpha: 0, vs: 0, crashed: 0 };
const ap = { on: true, alt: 1950, wp: 0, disc: 0 };
const input = { pitch: 0, roll: 0, drag: null };
function resetPlane() {
  const a = AIRFIELDS[ROUTE[0]], b = AIRFIELDS[ROUTE[1]];
  let dx = b.x - a.x, dz = b.z - a.z;
  if (Math.abs(dx) > WORLD / 2) dx -= Math.sign(dx) * WORLD;
  if (Math.abs(dz) > WORLD / 2) dz -= Math.sign(dz) * WORLD;
  plane.x = a.x + dx * 0.18; plane.z = a.z + dz * 0.18;
  plane.h = 1950; plane.V = 57; plane.gam = 0; plane.th = 2.2 * DEG; plane.phi = 0; plane.thr = 0.74; plane.flaps = 0;
  plane.psi = Math.atan2(dx, -dz);
  ap.on = true; ap.alt = 1950; ap.wp = 1; plane.crashed = 0;
}
const rho = (h) => 1.225 * Math.exp(-h / 8500);
function stepPlane(dt) {
  const p = plane;
  if (p.crashed > 0) { p.crashed -= dt; if (p.crashed <= 0) resetPlane(); return; }
  // автопилот: курс на ППМ + удержание высоты
  if (ap.on) {
    const wp = AIRFIELDS[ROUTE[ap.wp]];
    const d = relVec(wp.x, wp.z);
    const brg = Math.atan2(d.x, -d.z);
    if (Math.hypot(d.x, d.z) < 1500) ap.wp = (ap.wp + 1) % ROUTE.length;
    const err = wrapPi(brg - p.psi);
    const phiC = clamp(err * 1.4, -25 * DEG, 25 * DEG);
    p.phi += clamp(phiC - p.phi, -12 * DEG * dt, 12 * DEG * dt);
    const vsC = clamp((ap.alt - p.h) * 0.12, -4, 4);
    const thC = clamp(p.th + (vsC - p.vs) * 0.9 * DEG * dt * 4, -8 * DEG, 12 * DEG);
    p.th = thC;
  } else {
    p.th += input.pitch * 11 * DEG * dt;
    p.phi += input.roll * 42 * DEG * dt;
    p.phi -= p.phi * 0.03 * dt; // слабая спиральная устойчивость
  }
  p.th = clamp(p.th, -35 * DEG, 35 * DEG);
  p.phi = clamp(wrapPi(p.phi), -70 * DEG, 70 * DEG);
  const r = rho(p.h), q = 0.5 * r * p.V * p.V;
  p.alpha = p.th - p.gam;
  const fl = p.flaps / 30;
  const aStall = (15 + 2 * fl) * DEG;
  let CL = 0.28 + 0.35 * fl + 5.0 * p.alpha;
  if (p.alpha > aStall) CL = Math.max(0.3, (0.28 + 0.35 * fl + 5.0 * aStall) - (p.alpha - aStall) * 6);
  const CD = 0.031 + 0.03 * fl + 0.047 * CL * CL;
  const L = q * AC.S * CL, D = q * AC.S * CD;
  const T = p.thr * 2900 * Math.max(0, 1 - p.V / 88);
  const g = 9.81, m = AC.m;
  const dV = (T * Math.cos(p.alpha) - D) / m - g * Math.sin(p.gam);
  const dG = (L * Math.cos(p.phi) + T * Math.sin(p.alpha) - m * g * Math.cos(p.gam)) / (m * Math.max(p.V, 15));
  const dPsi = (L * Math.sin(p.phi)) / (m * Math.max(p.V, 15) * Math.cos(p.gam));
  p.V = Math.max(12, p.V + dV * dt);
  p.gam = clamp(p.gam + dG * dt, -80 * DEG, 80 * DEG);
  p.psi = wrapPi(p.psi + dPsi * dt);
  const hv = p.V * Math.cos(p.gam);
  p.x = ((p.x + hv * Math.sin(p.psi) * dt) % WORLD + WORLD) % WORLD;
  p.z = ((p.z - hv * Math.cos(p.psi) * dt) % WORLD + WORLD) % WORLD;
  p.vs = p.V * Math.sin(p.gam);
  p.h += p.vs * dt;
  if (p.h < heightAt(p.x, p.z) + 3) { p.crashed = 2.5; flash('СТОЛКНОВЕНИЕ С ЗЕМЛЁЙ', 2.4); }
}
function relVec(x, z) { let dx = x - plane.x, dz = z - plane.z; if (dx > WORLD / 2) dx -= WORLD; if (dx < -WORLD / 2) dx += WORLD; if (dz > WORLD / 2) dz -= WORLD; if (dz < -WORLD / 2) dz += WORLD; return { x: dx, z: dz }; }
const ias = () => plane.V * Math.sqrt(rho(plane.h) / 1.225) * 3.6; // км/ч

// ---------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2', { antialias: true });
const hudc = document.getElementById('hud');
const hx = hudc.getContext('2d');
if (!gl) { document.querySelector('.brand p').textContent = 'Нужен браузер с поддержкой WebGL2.'; throw new Error('WebGL2 недоступен'); }

const COMMON = `
precision highp float;
precision highp int;
uniform vec3 uSun; uniform vec3 uCam; uniform int uStyle; uniform float uWater;
uniform vec4 uRw[3]; uniform vec2 uRwDir[3];
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.-2.*f); return mix(mix(h21(i), h21(i+vec2(1,0)), u.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a * vn(p); p *= 2.07; a *= .5; } return s; }
vec3 skyCol(vec3 d){
  float y = d.y;
  if (uStyle == 1){ return mix(vec3(0.18,0.42,0.86), vec3(0.02,0.18,0.55), clamp(y*2.5, 0., 1.)); }
  vec3 zen = vec3(0.09, 0.24, 0.56), hor = vec3(0.80, 0.74, 0.70);
  vec3 c = mix(hor, zen, pow(clamp(y, 0., 1.), 0.5));
  float s = max(dot(d, uSun), 0.);
  c += vec3(1.0, 0.70, 0.40) * (pow(s, 5.) * 0.55 + pow(s, 48.) * 0.8);
  c += vec3(1.0, 0.95, 0.85) * smoothstep(0.9993, 0.9997, s) * 4.0;
  c = mix(c, vec3(0.62, 0.66, 0.70), smoothstep(0.0, -0.25, y));
  return c;
}
`;
const VS_TER = `#version 300 es
${COMMON}
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNor;
uniform mat4 uVP; uniform vec2 uOff;
out vec3 vW; out vec3 vN;
void main(){ vec3 w = aPos + vec3(uOff.x, 0., uOff.y); vW = w; vN = aNor; gl_Position = uVP * vec4(w, 1.); }`;
const FS_TER = `#version 300 es
${COMMON}
in vec3 vW; in vec3 vN; out vec4 o;
float runway(vec2 p){
  float m = 0.;
  for (int k = 0; k < 3; k++){
    vec2 d = p - uRw[k].xy; vec2 ax = uRwDir[k];
    float along = dot(d, ax), across = dot(d, vec2(-ax.y, ax.x));
    if (abs(along) < uRw[k].z * .5 && abs(across) < uRw[k].w * .5){
      float cl = step(abs(across), 0.5) * step(0.5, fract(along / 30.));
      float edge = step(uRw[k].w * .5 - 1.2, abs(across));
      float thr = step(uRw[k].z * .5 - 30., abs(along)) * step(0.5, fract(across / 3.));
      m = 1. + max(max(cl, edge), thr);
    }
  }
  return m;
}
void main(){
  vec3 n = normalize(vN);
  float h = vW.y, slope = 1. - n.y;
  float d = length(vW - uCam);
  float det = fbm(vW.xz * 0.0021);
  vec3 c;
  if (uStyle == 1){
    // синтетический вид: цвет по абсолютной высоте и сетка через километр
    c = mix(vec3(0.16,0.42,0.12), vec3(0.62,0.55,0.20), smoothstep(400., 1100., h));
    c = mix(c, vec3(0.50,0.34,0.20), smoothstep(1100., 1700., h));
    c = mix(c, vec3(0.92), smoothstep(1800., 2100., h));
    if (h < uWater + 1.) c = vec3(0.10, 0.30, 0.70);
    float diff = max(dot(n, normalize(vec3(0.3, 0.8, 0.4))), 0.);
    c *= 0.55 + 0.6 * diff;
    vec2 gpos = vW.xz / 1000.;
    vec2 gg = abs(fract(gpos) - .5);
    float line = 1. - smoothstep(0., fwidth(gpos.x) * 1.4 + 0.004, min(.5 - gg.x, .5 - gg.y));
    c = mix(c, vec3(0.95), line * 0.35 * clamp(1. - d / 18000., 0., 1.));
    float rw = runway(vW.xz); if (rw > 0.5) c = rw > 1.5 ? vec3(1.) : vec3(0.35);
    c = mix(c, vec3(0.55, 0.72, 0.95), smoothstep(8000., 30000., d));
    o = vec4(c, 1.);
    return;
  }
  vec3 grass = vec3(0.20, 0.30, 0.11), forest = vec3(0.075, 0.15, 0.07), rock = vec3(0.33, 0.30, 0.27), snow = vec3(0.93, 0.94, 0.97);
  c = mix(grass, forest, smoothstep(0.38, 0.62, det + (h - 700.) / 4000.));
  c = mix(c, vec3(0.42, 0.40, 0.25), smoothstep(0.55, 0.8, fbm(vW.xz * 0.0006)) * (1. - smoothstep(900., 1300., h)) * 0.6);
  c = mix(c, rock, smoothstep(0.22, 0.42, slope + (h - 1300.) / 2200.));
  c = mix(c, snow, smoothstep(1700., 1900., h + det * 260.) * (1. - smoothstep(0.35, 0.62, slope)));
  float rw = runway(vW.xz);
  if (rw > 0.5) c = rw > 1.5 ? vec3(0.85) : vec3(0.2, 0.2, 0.21);
  bool water = h < uWater + 1.;
  if (water) { c = vec3(0.05, 0.12, 0.18); n = vec3(0., 1., 0.); }
  float diff = max(dot(n, uSun), 0.);
  vec3 lit = c * (vec3(1.0, 0.82, 0.62) * diff * 2.0 + vec3(0.26, 0.34, 0.50) * (0.5 + 0.5 * n.y));
  if (water){
    vec3 v = normalize(uCam - vW);
    vec3 r = reflect(-v, vec3(0., 1., 0.));
    float fres = 0.04 + 0.96 * pow(1. - max(v.y, 0.), 5.);
    lit = mix(lit, skyCol(r), fres) + vec3(1.0, 0.8, 0.55) * pow(max(dot(r, uSun), 0.), 180.) * 3.;
  }
  // воздушная перспектива
  vec3 vd = normalize(vW - uCam);
  float fog = 1. - exp(-d * 0.000032);
  vec3 haze = mix(vec3(0.56, 0.64, 0.76), vec3(1.0, 0.78, 0.55), pow(max(dot(vd, uSun), 0.), 3.) * 0.9);
  lit = mix(lit, haze, fog);
  lit = lit / (1. + lit * 0.15);
  o = vec4(pow(lit, vec3(1. / 2.2)), 1.);
}`;
const VS_SKY = `#version 300 es
const vec2 P[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));
out vec2 vP; void main(){ vP = P[gl_VertexID]; gl_Position = vec4(P[gl_VertexID], .9999, 1.); }`;
const FS_SKY = `#version 300 es
${COMMON}
uniform mat4 uInv; in vec2 vP; out vec4 o;
void main(){
  vec4 a = uInv * vec4(vP, -1., 1.), b = uInv * vec4(vP, 1., 1.);
  vec3 d = normalize(b.xyz / b.w - a.xyz / a.w);
  vec3 c = skyCol(d);
  if (uStyle == 0){
    // лёгкие перистые облака высоко
    if (d.y > 0.02){
      vec2 uv = d.xz / d.y * 0.6;
      float cl = smoothstep(0.47, 0.82, fbm(uv * 1.3 + vec2(0.0, 3.0)));
      vec3 cc = mix(vec3(0.86, 0.87, 0.92), vec3(1.0, 0.86, 0.68), pow(max(dot(d, uSun), 0.), 3.));
      c = mix(c, cc, cl * 0.75 * smoothstep(0.02, 0.18, d.y));
    }
    c = c / (1. + c * 0.15);
    c = pow(c, vec3(1. / 2.2));
  }

    g.strokeStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(mx, py + 0.5); g.lineTo(mx + pw, py + 0.5); g.stroke();
    const span = mapState.range * 1.2, n = 90;
    const top = plane.h + 600, bot = Math.max(0, plane.h - 2200);
    const yOf = (h) => py + ph - 6 - (h - bot) / (top - bot) * (ph - 24);
    g.beginPath(); g.moveTo(mx, py + ph);
    for (let k = 0; k <= n; k++) {
      const d = span * k / n, x = plane.x + Math.sin(plane.psi) * d, z = plane.z - Math.cos(plane.psi) * d;
      g.lineTo(mx + pw * k / n, yOf(Math.max(WATER, heightAt(x, z))));
    }
    g.lineTo(mx + pw, py + ph); g.closePath();
    const pgr = g.createLinearGradient(0, py, 0, py + ph); pgr.addColorStop(0, '#8A6A3A'); pgr.addColorStop(1, '#2C3A20');
    g.fillStyle = pgr; g.fill();
    g.strokeStyle = C.cyan; g.lineWidth = 2; g.beginPath(); g.moveTo(mx, yOf(plane.h)); g.lineTo(mx + pw, yOf(plane.h + plane.vs / Math.max(plane.V, 1) * span)); g.stroke();
    g.fillStyle = '#F4F7F9'; g.font = FONT(600, 13); g.textAlign = 'left'; g.fillText('ПРОФИЛЬ ПО КУРСУ', mx + 10, py + 14);
    g.textAlign = 'right'; g.fillText(`${(span / 1000).toFixed(0)} км`, mx + pw - 8, py + 14);
  }
  // приборы двигателя
  if (eisW) {
    const ex = r.x, ew = eisW;
    g.fillStyle = '#0B0E12'; g.fillRect(ex, r.y, ew, r.h);
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(ex + ew - 0.5, r.y); g.lineTo(ex + ew - 0.5, r.y + r.h); g.stroke();
    const rpm = Math.round(1400 + plane.thr * 1250 + (plane.V - 50) * 8);
    const gx = ex + ew / 2, gy = r.y + 72, gr = ew * 0.36;
    g.lineWidth = 7;
    const arc = (a0, a1, col) => { g.strokeStyle = col; g.beginPath(); g.arc(gx, gy, gr, Math.PI * (0.75 + a0 * 1.5), Math.PI * (0.75 + a1 * 1.5)); g.stroke(); };
    arc(0, 0.72, '#3A4047'); arc(0.72, 0.93, C.green); arc(0.93, 1, C.red);
    const t = clamp(rpm / 2900, 0, 1), ang = Math.PI * (0.75 + t * 1.5);
    g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + Math.cos(ang) * (gr + 2), gy + Math.sin(ang) * (gr + 2)); g.stroke();
    g.fillStyle = '#fff'; g.font = FONT(700, 16); g.textAlign = 'center'; g.fillText(rpm, gx, gy + gr * 0.55);
    g.fillStyle = C.dim; g.font = FONT(600, 13); g.fillText('ОБ/МИН', gx, r.y + 24);
    const bars = [['ГАЗ', plane.thr, C.cyan, `${Math.round(plane.thr * 100)}%`], ['ТОПЛ', 0.62, C.green, '112 л'], ['Т МАСЛ', 0.55, C.green, '86°'], ['Д МАСЛ', 0.6, C.green, '4,6']];
    let by = gy + gr + 30;
    for (const [k, v, col, txt] of bars) {
      g.fillStyle = C.dim; g.font = FONT(600, 13); g.textAlign = 'left'; g.fillText(k, ex + 10, by);
      g.fillStyle = '#fff'; g.textAlign = 'right'; g.fillText(txt, ex + ew - 10, by);
      g.fillStyle = '#2A3036'; g.fillRect(ex + 10, by + 10, ew - 20, 7);
      g.fillStyle = col; g.fillRect(ex + 10, by + 10, (ew - 20) * v, 7);
      by += 44;
    }
    g.fillStyle = C.dim; g.font = FONT(600, 13); g.textAlign = 'left'; g.fillText(`ЗАКР ${plane.flaps}°`, ex + 10, by + 4);
  }
  g.restore();
}
function drawOverlay(g, now) {
  if (msg && msg.t > 0) {
    const y = L.ws.h * 0.5;
    g.font = FONT(700, L.mobile ? 18 : 24); g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(msg.text).width + 40;
    g.fillStyle = 'rgba(0,0,0,.6)'; rr(g, W / 2 - w / 2, y - 24, w, 48, 8); g.fill();
    g.fillStyle = msg.col; g.fillText(msg.text, W / 2, y + 1);
  }
}

// ---------------------------------------------------------------------
// Главный цикл
// ---------------------------------------------------------------------
resetPlane();
layout();
refreshSoftkeys();
// на старте самолёт уже в полёте несколько секунд
for (let k = 0; k < 120; k++) stepPlane(1 / 30);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  readControls();
  const sub = 4;
  for (let k = 0; k < sub; k++) stepPlane(dt / sub);
  if (ap.disc > 0) ap.disc -= dt;
  if (msg) msg.t -= dt;
  updateAudio();
  // WebGL: вид из кабины и синтетический рельеф PFD
  gl.enable(gl.SCISSOR_TEST);
  const ws = L.ws, pf = L.pfd;
  gl.clearColor(0.05, 0.06, 0.07, 1);
  gl.viewport(0, 0, glc.width, glc.height); gl.scissor(0, 0, glc.width, glc.height); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  renderView(0, Math.round((Hh - ws.h) * DPR), Math.round(ws.w * DPR), Math.round(ws.h * DPR), 0, (L.mobile ? 50 : 34) * DEG, 0);
  const pcy = 0.43; // центр авиагоризонта выше середины дисплея
  renderView(Math.round(pf.x * DPR), Math.round((Hh - pf.y - pf.h) * DPR), Math.round(pf.w * DPR), Math.round(pf.h * DPR), 1, 30 * DEG, 1 - 2 * pcy);
  gl.disable(gl.SCISSOR_TEST);
  // 2D: панель и символика
  hx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hx.clearRect(0, 0, W, Hh);
  drawPanel(hx);
  drawPFD(hx, L.pfd);
  drawMFD(hx, L.mfd, now);
  drawOverlay(hx, now);
}
const go = () => requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
</script>
