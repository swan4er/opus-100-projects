<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Снежный шар</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Стеклянный шар с зимней деревней внутри: встряхните — и снег закружится в воде.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0d1224;--cream:#f7efe1;--ink:#231a14;--ink2:#6d6053;--warm:#ffcf8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.day{background:#e7e9ee}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.shaking{cursor:grabbing}
.title{position:fixed;left:40px;top:32px;pointer-events:none;transition:color .8s}
.title h1{text-shadow:0 2px 14px rgba(8,10,20,.7);margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:54px;line-height:.95;letter-spacing:-.01em}
.title p{margin:12px 0 0;font-size:14px;line-height:1.5;color:rgba(247,239,225,.82);max-width:300px;text-shadow:0 1px 8px rgba(8,10,20,.9)}
body.day .title{color:var(--ink)}
body.day .title p{color:var(--ink2)}
.bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.pill{height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--cream);color:var(--ink);font:600 14px 'Manrope',sans-serif;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.6) inset;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s}
.pill:hover{transform:translateY(-2px)}
.pill:active{transform:translateY(1px)}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill.on{background:#ffd79a}
.pill:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
body.day .pill{box-shadow:0 8px 20px rgba(40,30,20,.16),0 1px 0 rgba(255,255,255,.7) inset}
.hint{position:fixed;right:36px;bottom:40px;font-size:13px;color:rgba(247,239,225,.7);text-align:right;line-height:1.6;pointer-events:none;transition:opacity .6s}
body.day .hint{color:var(--ink2)}
.hint b{color:var(--warm);font-weight:600}
body.day .hint b{color:#9a5a17}
#load{position:fixed;inset:0;display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:rgba(247,239,225,.8);transition:opacity .8s;pointer-events:none}
#load.gone{opacity:0}
@media (max-width:760px){
  .title{left:20px;top:20px}
  .title h1{font-size:38px}
  .title p{font-size:13px;max-width:240px}
  .bar{bottom:18px;gap:8px;width:calc(100% - 24px);justify-content:center}
  .pill{height:44px;padding:0 14px;font-size:13px}
  .pill span{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
</style>

</head>

  <h1>Снежный шар</h1>

</div>

  <button class="pill" id="bDay" aria-label="День или ночь"><svg viewBox="0 0 24 24" id="dayIco"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span id="dayLbl">Ночь</span></button>

</div>
<div class="hint" id="hint">Потяните шар — <b>встряхнуть</b><br>Тяните фон — <b>повернуть</b></div>
<div id="load">Шар наполняется водой…</div>
<script>
  // если three.js не загрузился (нет сети) — честно говорим об этом

</script>

const lampPost = new THREE.Group(); lampPost.position.set(0.02, GROUND_Y + drift(0.02, -0.02), -0.02);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.008, 0.2, 8), new THREE.MeshStandardMaterial({ color: '#1c1c1c', metalness: 0.6, roughness: 0.4 })); post.position.y = 0.1; lampPost.add(post);
const bulbMat = new THREE.MeshStandardMaterial({ color: '#fff3d6', emissive: '#ffcf85', emissiveIntensity: 3 });

// стекло

snowGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); snowGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1)); snowGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));

/* ============ свет ============ */
const hemi = new THREE.HemisphereLight('#9fb4ff', '#2a1810', 0.35); scene.add(hemi);

/* ============ день и ночь ============ */

$('bDay').addEventListener('click', () => {

});

/* ============ встряхивание ============ */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const offset = new THREE.Vector3(), velo = new THREE.Vector3(), target = new THREE.Vector3(), acc = new THREE.Vector3(), tilt = new THREE.Vector2();
let shaking = null, energy = 1.1, autoShake = 0;
function hitGlobe(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObjects([glass, base], false).length > 0; }
canvas.addEventListener('pointerdown', e => {
  if (!hitGlobe(e)) return; e.stopImmediatePropagation(); controls.enabled = false; canvas.setPointerCapture(e.pointerId); canvas.classList.add('shaking');
  shaking = { id: e.pointerId, x: e.clientX, y: e.clientY }; controls.autoRotate = false; startAudio(); $('hint').style.opacity = 0;
}, { capture: true });

$('bShake').addEventListener('click', () => { autoShake = 0.9; startAudio(); controls.autoRotate = false; });

/* ============ музыкальная шкатулка (свой вальс) ============ */
let AC = null, master = null, musicOn = false, musicTimer = null, nextT = 0, step = 0;

function tine(n, t, vel) {

// «Снегирёвский вальс»: 16 тактов, 3/4
const MEL = [[76, 79, 84], [83, 0, 79], [81, 84, 88], [86, 0, 83], [84, 81, 77], [76, 0, 72], [74, 77, 83], [84, 0, 0], [88, 86, 84], [83, 81, 79], [77, 81, 86], [84, 0, 81], [79, 84, 88], [89, 88, 86], [84, 79, 83], [84, 0, 0]];
const BASS = [[60, 64, 67], [55, 59, 62], [57, 60, 64], [55, 59, 62], [53, 57, 60], [60, 64, 67], [55, 59, 65], [60, 64, 67], [57, 60, 64], [52, 55, 59], [53, 57, 62], [57, 60, 64], [60, 64, 67], [53, 57, 60], [55, 59, 62], [60, 64, 67]];

$('bMusic').addEventListener('click', () => {
  startAudio(); if (!AC) return; musicOn = !musicOn; $('bMusic').classList.toggle('on', musicOn); $('bMusic').setAttribute('aria-pressed', musicOn ? 'true' : 'false');
  if (musicOn) { nextT = AC.currentTime + 0.1; step = 0; musicTimer = setInterval(schedule, 100); } else clearInterval(musicTimer);

let sloshT = 0;

/* ============ физика снега ============ */
const tmp = new THREE.Vector3();
function stepSnow(dt, time) {
  // пружина шара: рука тянет, вода плескается
  if (autoShake > 0) { autoShake -= dt; const k = autoShake / 0.9; target.set(Math.sin(time * 26) * 0.32 * k, Math.cos(time * 19) * 0.18 * k, 0); if (autoShake <= 0) target.set(0, 0, 0); }

    }

    const tx = Math.sin(y * 4.1 + time * 0.9) + 0.6 * Math.sin(z * 5.3 - time * 0.7), ty = Math.sin(z * 3.7 + time * 1.1) + 0.5 * Math.sin(x * 4.9 + time * 0.6), tz = Math.sin(x * 4.3 - time * 0.8) + 0.6 * Math.sin(y * 5.1 + time);

    pos[j] = nx; pos[j + 1] = ny; pos[j + 2] = nz;
    // полностью растаявшие снежинки возвращаются в запас на дне
  }

  // дым
  for (let i = 0; i < SMOKE; i++) {
    sLife[i] += dt * 0.18; if (sLife[i] > 1) sLife[i] -= 1; const c = chimneys[i % chimneys.length], L = sLife[i];
    sPos[3 * i] = c.x + Math.sin(L * 9 + i) * 0.02 + L * 0.06; sPos[3 * i + 1] = c.y + L * 0.32; sPos[3 * i + 2] = c.z + Math.cos(L * 7 + i) * 0.02;
    const r2 = sPos[3 * i] ** 2 + sPos[3 * i + 1] ** 2 + sPos[3 * i + 2] ** 2; sA[i] = r2 > 0.85 ? 0 : Math.sin(Math.PI * L) * (1 - dayMix * 0.5); sS[i] = 3 + L * 9;
  }
  smokeGeo.attributes.position.needsUpdate = true; smokeGeo.attributes.aAlpha.needsUpdate = true; smokeGeo.attributes.aSize.needsUpdate = true;
}

/* ============ размер и цикл ============ */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 44 : 32; camera.updateProjectionMatrix();
  const px = h * renderer.getPixelRatio() * 0.015; snowUniforms.uPx.value = px; smokeUniforms.uPx.value = px;
  const dir = camera.position.clone().sub(controls.target).setLength(w < 700 ? 6.8 : 5.6); camera.position.copy(controls.target).add(dir);
}
addEventListener('resize', resize); resize();
applyDay(0);
// стартовый снегопад: шар только что встряхнули
for (let k = 0; k < 40; k++) stepSnow(1 / 30, k / 30);
let last = performance.now(), time = 40 / 30;
// режим съёмки (headless без видеокарты): рендерим первые секунды и замираем, касание будит на 3 с
const SHOT = !!window.__SHOT__; let awakeUntil = performance.now() + 3500, looping = true;
function wake() { awakeUntil = performance.now() + 3000; if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(frame); } }
if (SHOT) { canvas.addEventListener('pointerdown', wake, { capture: true }); addEventListener('keydown', wake); document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', wake)); }
function frame(now) {
  if (SHOT && now > awakeUntil) { looping = false; return; }
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(1 / 20, (now - last) / 1000); last = now; time += dt;
  if (Math.abs(dayMix - dayTarget) > 0.001) { dayMix += (dayTarget - dayMix) * Math.min(1, dt * 3); applyDay(dayMix); }
  windowLights.forEach((l, i) => { l.intensity = lightBase[i] * (0.9 + 0.1 * Math.sin(time * (5 + i * 1.7) + i * 3) * Math.sin(time * 2.3 + i)); }); lampLight.intensity = lampBase;
  stepSnow(reduceMotion ? dt * 0.5 : dt, time);
  controls.update(); composer.render(dt);
}
window.__globeReady = true;
$('load').classList.add('gone');
requestAnimationFrame(frame);
