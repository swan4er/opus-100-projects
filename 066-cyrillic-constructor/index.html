<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кириллица-конструктор</title>
<meta name="description" content="Параметрический шрифт для всего русского алфавита: буквы строятся пером по скелетам штрихов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2eee4;--paper2:#e8e2d4;--ink:#141311;--ink2:#5c574d;--line:#cfc7b6;--acc:#c3321c;--acc-soft:#f3d3c8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:22px 32px 40px}

/* шапка */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.title{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
#titleCv{width:100%;max-width:820px;height:64px;display:block}
.sub{font-size:14px;color:var(--ink2);max-width:640px;line-height:1.45}
.sub b{color:var(--ink);font-weight:600}
.head .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{height:42px;padding:0 18px;border:2px solid var(--ink);border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--ink);border-color:var(--ink)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

/* пресеты */
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.preset{height:38px;padding:0 16px;border-radius:999px;background:var(--paper2);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.preset:hover{background:var(--line)}
.preset.on{background:var(--ink);color:var(--paper)}
.presets .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);align-self:center;margin-right:6px}

/* основная сетка */
.main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;margin-top:22px}
.ctrl{display:flex;flex-direction:column;gap:18px}
.sl{display:flex;flex-direction:column;gap:7px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:500}
.sl output{font-family:'Martian Mono',monospace;font-size:12px;color:var(--ink2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);background:var(--acc);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:999px;font-size:14px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:10px;align-items:center;font-size:14px}
.chk{width:22px;height:22px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center}
.chk svg{width:14px;height:14px;stroke:var(--paper);stroke-width:3;fill:none;visibility:hidden}
.chk.on{background:var(--ink)}
.chk.on svg{visibility:visible}
.note{font-size:13px;line-height:1.5;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}

/* витрина */
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
.giant{position:relative;background:#fbf9f3;border:2px solid var(--ink);border-radius:18px;aspect-ratio:1/1.02;overflow:hidden}
#giantCv{position:absolute;inset:0;width:100%;height:100%}
.giant .cap{position:absolute;left:18px;top:14px;font-family:'Martian Mono',monospace;font-size:12px;color:var(--ink2);line-height:1.7;pointer-events:none}
.giant .cap b{color:var(--acc);font-weight:500}
.giant .play{position:absolute;right:14px;top:12px;height:34px;padding:0 14px;border-radius:999px;background:var(--paper2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.giant .play.on{background:var(--acc);color:#fff}
.alpha{display:flex;flex-direction:column;gap:12px}
.alpha h2,.text h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between}
#gridCv{width:100%;display:block;cursor:pointer;border-top:2px solid var(--ink)}
.text{margin-top:30px;display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--ink);padding-top:18px}
.text input{width:100%;height:48px;border:0;border-bottom:2px solid var(--ink);background:transparent;font:500 18px 'Onest',sans-serif;color:var(--ink);padding:0 2px;text-transform:uppercase}
.text input:focus{outline:none;border-bottom-color:var(--acc)}
#textCv{width:100%;display:block}

@media (max-width:1100px){
  .main{grid-template-columns:1fr}
  .ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 24px}
  .ctrl .note{grid-column:1/-1}
}
@media (max-width:760px){
  .wrap{padding:16px 16px 32px}
  .head{flex-direction:column;align-items:stretch}
  #titleCv{height:44px}
  .head .acts{justify-content:flex-start}
  .stage{grid-template-columns:1fr}
  .ctrl{grid-template-columns:1fr;order:2}
  .main>section{order:1}
  .main{display:flex;flex-direction:column}
  .presets .lbl{width:100%}
}
@media (prefers-reduced-motion:reduce){.btn,.preset{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="title">
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Кириллица-конструктор</h1>
      <canvas id="titleCv" aria-hidden="true"></canvas>
      <p class="sub">Параметрический шрифт для всего русского алфавита. Каждая буква — <b>скелет штрихов</b>, по которому ведётся <b>перо</b>: поверните его, сплющите или сделайте плоским, и все 33 буквы перестроятся разом.</p>
    </div>
    <div class="acts">
      <button class="btn" id="bRand"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3"/><circle cx="5.5" cy="5.5" r=".6"/><circle cx="10.5" cy="10.5" r=".6"/><circle cx="8" cy="8" r=".6"/></svg>Случайный</button>
      <button class="btn pri" id="bSvg"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13h10"/></svg>Скачать SVG</button>
    </div>
  </header>
  <div class="presets" id="presets"><span class="lbl">Стили</span></div>
  <div class="main">
    <aside class="ctrl" id="ctrl" aria-label="Параметры шрифта"></aside>
    <section>
      <div class="stage">
        <div class="giant">
          <canvas id="giantCv" aria-label="Выбранная буква крупно"></canvas>
          <div class="cap" id="giantCap"></div>
          <button class="play on" id="bPlay" aria-pressed="true">Анимация</button>
        </div>
        <div class="alpha">
          <h2><span>Алфавит и цифры</span><span id="gridHint">щёлкните букву</span></h2>
          <canvas id="gridCv" aria-label="Все буквы шрифта"></canvas>
        </div>
      </div>
      <div class="text">
        <h2><span>Набор</span><span id="textInfo"></span></h2>
        <input id="textIn" value="Съешь же ещё этих мягких французских булок, да выпей чаю" maxlength="140" aria-label="Текст для набора" spellcheck="false">
        <canvas id="textCv" aria-label="Набранный текст"></canvas>
      </div>
    </section>
  </div>
</div>
<script src="type.js"></script>
</body>
</html>
