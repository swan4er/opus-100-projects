<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таро машин</title>
<meta name="description" content="22 старших аркана, переосмысленных для эпохи машин: генеративные иллюстрации в стиле модерн и толкования.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Alice&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="spread">
<canvas id="dust" aria-hidden="true"></canvas>
<svg class="halo-bg" viewBox="0 0 800 800" aria-hidden="true">
  <circle cx="400" cy="400" r="380" fill="none" stroke="#D9B46A" stroke-width="1" opacity=".16"/>
  <circle cx="400" cy="400" r="360" fill="none" stroke="#D9B46A" stroke-width=".6" stroke-dasharray="2 10" opacity=".22"/>
  <circle cx="400" cy="400" r="300" fill="none" stroke="#D9B46A" stroke-width=".6" opacity=".1"/>
</svg>

<header class="top">
  <div class="ornament" aria-hidden="true">
    <svg viewBox="0 0 240 20"><path d="M0 10 H92 M148 10 H240" stroke="#D9B46A" stroke-width=".8"/><path d="M120 2 L128 10 L120 18 L112 10 Z" fill="none" stroke="#D9B46A" stroke-width="1"/><circle cx="120" cy="10" r="2" fill="#D9B46A"/><path d="M92 10 C 100 3, 106 3, 110 10 M148 10 C 140 3, 134 3, 130 10" fill="none" stroke="#D9B46A" stroke-width=".8"/></svg>
  </div>
  <h1>Таро машин</h1>
  <p class="sub">Двадцать два старших аркана для эпохи, когда думают и&nbsp;люди, и&nbsp;машины</p>
  <nav class="tabs" role="tablist" aria-label="Режим">
    <button role="tab" data-view="spread" aria-selected="true">Три карты</button>
    <button role="tab" data-view="day" aria-selected="false">Карта дня</button>
    <button role="tab" data-view="deck" aria-selected="false">Колода</button>
  </nav>
</header>

<main>
  <section class="view view-spread" id="view-spread" aria-label="Расклад на три карты">
    <div class="spread" id="spread"></div>
    <div class="actions"><button class="gold-btn" id="btn-draw">Перетасовать и&nbsp;вытянуть</button></div>
  </section>

  <section class="view view-day" id="view-day" aria-label="Карта дня" hidden>
    <div class="day" id="day"></div>
  </section>

  <section class="view view-deck" id="view-deck" aria-label="Колода" hidden>
    <p class="deck-note">Нажмите на карту, чтобы прочитать её целиком.</p>
    <div class="deck" id="deck"></div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal-card" id="m-card"></div>
  <div class="modal-text">
    <p class="m-num" id="m-num"></p>
    <h2 id="m-title"></h2>
    <p class="m-orig" id="m-orig"></p>
    <p class="m-keys" id="m-keys"></p>
    <h3>Прямое положение</h3>
    <p id="m-up"></p>
    <h3>Перевёрнутая</h3>
    <p id="m-rev"></p>
    <h3>Что на карте</h3>
    <p id="m-motif"></p>
    <div class="m-nav">
      <button class="ghost-btn" id="m-prev" aria-label="Предыдущая карта">←</button>
      <button class="ghost-btn" id="m-next" aria-label="Следующая карта">→</button>
      <button class="ghost-btn" id="m-close">Закрыть</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
