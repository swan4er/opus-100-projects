<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обсерватория простых чисел — атлас в четырёх таблицах</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Спирали Улама и Сакса, гауссовы простые и горизонт промежутков между простыми числами — до 33 миллионов, в духе печатных таблиц XIX века.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #cdbd9c;
    --paper: #f2e9d6;
    --paper-2: #e9ddc3;
    --ink: #1d1914;
    --ink-2: #3f372d;
    --ink-3: #5d5344;
    --red: #a1241b;
    --serif: "Old Standard TT", "Times New Roman", Georgia, serif;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--desk); color: var(--ink); font-family: var(--serif); }
  body { overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ——— разворот ——— */
  .spread {
    position: fixed; inset: 16px;
    display: grid; grid-template-columns: minmax(340px, 400px) 1fr;
    background: var(--paper);
    box-shadow: 0 1px 2px rgba(60, 40, 10, .25), 0 20px 50px rgba(60, 40, 10, .22);
  }
  .spread::after { /* корешок */
    content: ""; position: absolute; top: 0; bottom: 0; left: clamp(340px, 28%, 400px); width: 44px; margin-left: -22px; pointer-events: none;
    background: linear-gradient(to right, rgba(90, 64, 30, 0), rgba(90, 64, 30, .13) 45%, rgba(90, 64, 30, .2) 50%, rgba(90, 64, 30, .1) 56%, rgba(90, 64, 30, 0));
  }
  .page { position: relative; min-width: 0; min-height: 0; }

  /* ——— левая страница ——— */
  .text { padding: 40px 42px 28px 44px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: thin; }
  .eyebrow { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  h1 { font-weight: 400; font-size: 36px; line-height: 1.08; margin: 10px 0 8px; letter-spacing: -.005em; }
  .sub { font-style: italic; font-size: 17px; color: var(--ink-2); margin: 0; }
  .double { height: 5px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); margin: 22px 0 18px; }

  .plates { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .plates button {
    width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: baseline; gap: 8px;
    background: none; border: 0; padding: 7px 4px; font: inherit; font-size: 18px; color: var(--ink-2); cursor: pointer; text-align: left;
    border-radius: 2px; transition: background .2s var(--ease), color .2s;
  }
  .plates button .rn { font-size: 15px; color: var(--ink-3); letter-spacing: .06em; }
  .plates button .dots { border-bottom: 1px dotted rgba(29, 25, 20, .35); transform: translateY(-5px); min-width: 20px; }
  .plates button:hover { background: rgba(120, 90, 40, .08); color: var(--ink); }
  .plates button[aria-current="true"] { color: var(--ink); }
  .plates button[aria-current="true"] .rn { color: var(--red); }
  .plates button[aria-current="true"] .name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .plates .name { white-space: nowrap; }

  .about { margin-top: 18px; }
  .about h2 { font-size: 21px; font-weight: 700; margin: 0 0 8px; line-height: 1.2; }
  .about p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; color: var(--ink-2); hyphens: auto; }
  .about .red { color: var(--red); }

  .params { margin-top: 10px; display: grid; gap: 4px; }
  .check {
    display: flex; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; font-size: 16px; color: var(--ink-2);
    background: none; border: 0; padding: 0 2px; font-family: inherit; text-align: left;
  }
  .check .box { width: 18px; height: 18px; border: 1.5px solid var(--ink); display: grid; place-items: center; flex: none; background: rgba(255, 252, 244, .5); }
  .check .box svg { width: 14px; height: 14px; opacity: 0; transform: scale(.6); transition: opacity .18s, transform .22s var(--ease); }
  .check[aria-checked="true"] .box svg { opacity: 1; transform: scale(1); }
  .check:hover { color: var(--ink); }
  .check .sw { width: 22px; height: 3px; flex: none; }

  .seg { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; color: var(--ink-2); flex-wrap: wrap; }
  .seg .opts { display: inline-flex; border: 1.5px solid var(--ink); }
  .seg button { font: inherit; font-size: 16px; background: none; border: 0; padding: 7px 12px; min-width: 42px; cursor: pointer; color: var(--ink-2); font-variant-numeric: lining-nums; }
  .seg button + button { border-left: 1px solid rgba(29, 25, 20, .45); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg button:hover:not([aria-pressed="true"]) { background: rgba(120, 90, 40, .1); }

  .records { margin-top: 10px; font-size: 15px; font-variant-numeric: lining-nums tabular-nums; }
  .records .hd { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .records .ln { display: grid; grid-template-columns: 44px 1fr auto; gap: 6px; align-items: baseline; line-height: 1.55; color: var(--ink-2); }
  .records .ln .g { color: var(--red); }
  .records .ln .lead { border-bottom: 1px dotted rgba(29, 25, 20, .3); transform: translateY(-4px); }

  .foot { margin-top: auto; padding-top: 18px; font-size: 14px; line-height: 1.45; color: var(--ink-3); font-style: italic; }
  .foot .bar { height: 2px; background: rgba(29, 25, 20, .12); margin-top: 8px; position: relative; overflow: hidden; }
  .foot .bar i { position: absolute; inset: 0; background: var(--ink-2); transform-origin: left; transform: scaleX(0); transition: transform .3s var(--ease); }

  /* ——— правая страница: таблица ——— */
  .plate { padding: 34px 40px 22px 44px; display: flex; flex-direction: column; }
  .plate-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .plate-head .t { font-size: 14px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-2); }
  .plate-head .t b { color: var(--red); font-weight: 400; }
  .plate-head .scale { font-size: 15px; font-style: italic; color: var(--ink-3); font-variant-numeric: lining-nums; }
  .frame { position: relative; flex: 1; min-height: 0; border: 2px solid var(--ink); padding: 4px; }
  .frame::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--ink); pointer-events: none; z-index: 2; }
  .frame .inner { position: relative; width: 100%; height: 100%; overflow: hidden; }
  canvas#plate { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#plate.dragging { cursor: grabbing; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(120, 85, 40, 0) 55%, rgba(120, 85, 40, .16) 100%); }
  .zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  .zoom button {
    width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
    background: var(--paper); border: 1.5px solid var(--ink); color: var(--ink); font: inherit; font-size: 20px; line-height: 1;
    transition: background .15s;
  }
  .zoom button:hover { background: #fffaf0; }
  .zoom button:active { transform: translateY(1px); }
  .zoom svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.5; }
  .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-top: 10px; min-height: 26px; }
  .readout { font-size: 17px; color: var(--ink-2); font-variant-numeric: lining-nums; }
  .readout b { font-weight: 700; color: var(--ink); }
  .readout .pr { color: var(--red); }
  .caption .hint { font-size: 14px; font-style: italic; color: var(--ink-3); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .spread { position: relative; inset: auto; margin: 10px; display: flex; flex-direction: column-reverse; min-height: calc(100% - 20px); }
    .spread::after { display: none; }
    .plate { padding: 18px 16px 8px; height: 62vh; min-height: 380px; }
    .text { padding: 18px 20px 26px; overflow: visible; }
    h1 { font-size: 28px; }
    .caption .hint { display: none; }
    .plate-head .t { font-size: 13px; letter-spacing: .16em; }
    .plates button { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="spread">
  <section class="page text" aria-label="Описание таблиц">
    <div class="eyebrow">Атлас в&nbsp;четырёх таблицах</div>
    <h1>Обсерватория простых чисел</h1>
    <p class="sub">Простые числа, наблюдаемые с&nbsp;разных точек: по спирали, по&nbsp;кругу, на&nbsp;комплексной плоскости и&nbsp;вдоль числовой оси.</p>
    <div class="double"></div>
    <ul class="plates" id="plates"></ul>
    <div class="about" id="about"></div>
    <div class="params" id="params"></div>
    <div class="records" id="records" hidden></div>
    <div class="foot" id="foot">Решето Эратосфена готовится…<div class="bar"><i id="bar"></i></div></div>
  </section>

  <section class="page plate" aria-label="Таблица">
    <div class="plate-head">
      <div class="t" id="plateTitle">Таблица <b>I</b> · Спираль Улама</div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="frame">
      <div class="inner">
        <canvas id="plate" aria-label="Изображение таблицы"></canvas>
        <div class="vignette"></div>
        <div class="zoom">
          <button id="zin" aria-label="Приблизить" title="Приблизить (+)"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg></button>
          <button id="zout" aria-label="Отдалить" title="Отдалить (−)"><svg viewBox="0 0 20 20"><path d="M4 10h12"/></svg></button>
          <button id="zreset" aria-label="Вернуть вид" title="Вернуть вид (0)"><svg viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4 3.5v3.2h3.2"/></svg></button>
        </div>
      </div>
    </div>
    <div class="caption">
      <div class="readout" id="readout">Наведите на&nbsp;число.</div>
      <div class="hint">Колесо — масштаб, перетаскивание — сдвиг</div>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';

/* ================================================================
   Решето Эратосфена в Web Worker (сегментами, до 2^25)
   ================================================================ */
const LIMIT = 1 << 25;                 // 33 554 432
const SEG = 1 << 21;                   // сегмент — 2 097 152 чисел
const bits = new Uint8Array(LIMIT >> 4);   // 1 бит на нечётное число: 1 — составное
const NBLOCK = (LIMIT >> 4) >> 6;          // блок — 64 байта = 512 нечётных
const blockPrefix = new Uint32Array(NBLOCK + 1);
const blockFirst = new Int32Array(NBLOCK).fill(-1);
const blockLast = new Int32Array(NBLOCK).fill(-1);
const blockMaxGap = new Uint16Array(NBLOCK);
const blockMaxAt = new Int32Array(NBLOCK);
const POP = new Uint8Array(256);
for (let i = 0; i < 256; i++) POP[i] = (i & 1) + POP[i >> 1];
let sieved = 0;                        // все числа < sieved уже проверены
const records = [];                    // [промежуток, после какого простого]
let donePrimes = 0;

const WORKER = `
self.onmessage = (e) => {
  const N = e.data.limit, SEG = e.data.seg;
  const root = Math.floor(Math.sqrt(N)) + 2;
  const small = new Uint8Array(root + 1), base = [];
  for (let i = 2; i <= root; i++) if (!small[i]) { base.push(i); for (let j = i * i; j <= root; j += i) small[j] = 1; }
  let last = 2, maxGap = 0;
  for (let lo = 0; lo < N; lo += SEG) {
    const hi = Math.min(N, lo + SEG), len = (hi - lo) >> 1;
    const comp = new Uint8Array(len);
    for (let k = 1; k < base.length; k++) {
      const p = base[k];
      if (p * p >= hi) break;
      let s = Math.max(p * p, Math.ceil(lo / p) * p);
      if ((s & 1) === 0) s += p;
      for (let m = s; m < hi; m += 2 * p) comp[(m - lo - 1) >> 1] = 1;
    }
    if (lo === 0) comp[0] = 1;
    const out = new Uint8Array((len + 7) >> 3), rec = [];
    let count = lo === 0 ? 1 : 0;
    for (let i = 0; i < len; i++) {
      if (comp[i]) { out[i >> 3] |= 1 << (i & 7); continue; }
      const p = lo + 2 * i + 1;
      count++;
      const g = p - last;
      if (g > maxGap) { maxGap = g; rec.push([g, last]); }
      last = p;
    }
    self.postMessage({ lo, hi, bits: out.buffer, count, rec }, [out.buffer]);
  }
};`;

function ingest(msg) {
  bits.set(new Uint8Array(msg.bits), msg.lo >> 4);
  const b0 = msg.lo >> 10, b1 = msg.hi >> 10;
  for (let b = b0; b < b1; b++) {
    let first = -1, last = -1, maxg = 0, at = 0, cnt = 0;
    const byte0 = b << 6;
    for (let j = 0; j < 64; j++) {
      const v = bits[byte0 + j];
      if (v === 255) continue;
      for (let k = 0; k < 8; k++) {
        if (v & (1 << k)) continue;
        const n = (((byte0 + j) << 3) + k) * 2 + 1;
        cnt++;
        if (first < 0) first = n;
        if (last >= 0 && n - last > maxg) { maxg = n - last; at = last; }
        last = n;
      }
    }
    blockFirst[b] = first; blockLast[b] = last; blockMaxGap[b] = maxg; blockMaxAt[b] = at;
    blockPrefix[b + 1] = blockPrefix[b] + cnt;
  }
  for (const r of msg.rec) records.push(r);
  donePrimes += msg.count;
  sieved = msg.hi;
}

function isPrime(n) {
  if (n < 2 || n >= sieved) return false;
  if (n === 2) return true;
  if ((n & 1) === 0) return false;
  const i = (n - 1) >> 1;
  return (bits[i >> 3] & (1 << (i & 7))) === 0;
}
function known(n) { return n < sieved; }
function piOf(n) { // количество простых ≤ n
  if (n < 2) return 0;
  n = Math.min(n, sieved - 1);
  const idx = (n - 1) >> 1, b = idx >> 9;
  let c = blockPrefix[b];
  const last = idx >> 3;
  for (let j = b << 6; j < last; j++) c += 8 - POP[bits[j]];
  const v = bits[last];
  for (let k = 0; k <= (idx & 7); k++) if (!(v & (1 << k))) c++;
  return c + 1;
}
function nextPrime(n) { for (let m = n + 1; m < sieved; m++) if (isPrime(m)) return m; return -1; }
function factor(n) {
  const f = [];
  for (let p = 2; p * p <= n; p += (p === 2 ? 1 : 2)) {
    if (n % p === 0) { let e = 0; while (n % p === 0) { n /= p; e++; } f.push([p, e]); }
  }
  if (n > 1) f.push([n, 1]);
  return f;
}

/* ================================================================
   Оформление чисел
   ================================================================ */
const NB = ' ';
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (e) => String(e).split('').map((d) => SUP[d]).join('');
const factStr = (f) => f.map(([p, e]) => fmt(p) + (e > 1 ? sup(e) : '')).join(' · ');

/* ================================================================
   Холст и бумага
   ================================================================ */
const canvas = document.getElementById('plate');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
const PAPER = [242, 233, 214], INK = [29, 25, 20], RED = [161, 36, 27];

// плитка бумажной фактуры 256×256: волокна и неравномерность
const TILE = 256;
const paperTile = new Float32Array(TILE * TILE);
(function makePaper() {
  let seed = 12345;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < paperTile.length; i++) paperTile[i] = (rnd() - 0.5) * 0.035;
  for (let f = 0; f < 420; f++) { // волокна
    let x = rnd() * TILE, y = rnd() * TILE; const a = rnd() * Math.PI, len = 6 + rnd() * 26, dv = (rnd() - 0.5) * 0.06;
    for (let t = 0; t < len; t++) { const xi = ((x + Math.cos(a) * t) | 0) & (TILE - 1), yi = ((y + Math.sin(a) * t) | 0) & (TILE - 1); paperTile[yi * TILE + xi] += dv; }
  }
  // лёгкое сглаживание
  const tmp = paperTile.slice();
  for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) {
    let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += tmp[((y + dy) & 255) * TILE + ((x + dx) & 255)];
    paperTile[y * TILE + x] = s / 9;
  }
})();
let paperPattern = null;
function makePaperPattern() {
  const c = document.createElement('canvas'); c.width = c.height = TILE;
  const x = c.getContext('2d'); const img = x.createImageData(TILE, TILE);
  for (let i = 0; i < TILE * TILE; i++) {
    const k = 1 + paperTile[i];
    img.data[i * 4] = PAPER[0] * k; img.data[i * 4 + 1] = PAPER[1] * k; img.data[i * 4 + 2] = PAPER[2] * k; img.data[i * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  paperPattern = ctx.createPattern(c, 'repeat');
}
function fillPaper() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = paperPattern; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function hash(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }

/* ================================================================
   Таблицы
   ================================================================ */
const PLATES = [
  { id: 'ulam', rn: 'I', name: 'Спираль Улама' },
  { id: 'sacks', rn: 'II', name: 'Спираль Сакса' },
  { id: 'gauss', rn: 'III', name: 'Гауссовы простые' },
  { id: 'gaps', rn: 'IV', name: 'Горизонт промежутков' },
];
const ABOUT = {
  ulam: `<h2>Таблица I. Спираль Улама</h2>
    <p>В&nbsp;1963 году Станислав Улам, скучая на&nbsp;докладе, выписал числа по&nbsp;квадратной спирали и&nbsp;обвёл простые. Они легли на&nbsp;диагонали&nbsp;— следы квадратичных многочленов.</p>
    <p><span class="red">Красным</span> отмечены значения n² + n + c, где c&nbsp;— число в&nbsp;центре. При c = 41 это многочлен Эйлера: сорок его значений подряд простые и&nbsp;лежат на&nbsp;одной диагонали.</p>`,
  sacks: `<h2>Таблица II. Спираль Сакса</h2>
    <p>Роберт Сакс в&nbsp;1994 году свернул числовую ось в&nbsp;архимедову спираль: число n&nbsp;стоит на&nbsp;расстоянии √n от&nbsp;центра, и&nbsp;каждый полный оборот проходит между соседними квадратами.</p>
    <p>Квадраты ложатся на&nbsp;луч вправо, а&nbsp;простые собираются в&nbsp;кривые&nbsp;— снова квадратичные многочлены. <span class="red">Красные</span> точки&nbsp;— значения n² + n + 41.</p>`,
  gauss: `<h2>Таблица III. Гауссовы простые</h2>
    <p>Простые среди комплексных чисел a + bi. Здесь привычное простое 5 раскладывается: 5 = (2 + i)(2 − i), а&nbsp;простые вида 4k + 3 остаются простыми.</p>
    <p>Точка стоит там, где a + bi нельзя разложить. <span class="red">Красным</span>&nbsp;— простые на&nbsp;осях. Узор не&nbsp;меняется от&nbsp;поворотов на&nbsp;90° и&nbsp;отражений.</p>`,
  gaps: `<h2>Таблица IV. Горизонт промежутков</h2>
    <p>Между простыми бывают сколь угодно длинные пустыни. Чёрные штрихи&nbsp;— расстояние до&nbsp;следующего простого, <span class="red">красные</span> точки&nbsp;— рекорды.</p>
    <p>Серая кривая&nbsp;— средний промежуток ln n, пунктир&nbsp;— граница (ln n)² из&nbsp;гипотезы Крамера 1936 года.</p>`,
};
const state = {
  plate: 'ulam',
  ulam: { cx: 0, cy: 0, s: 2, center: 41, poly: true, twins: false, path: true },
  sacks: { cx: 0, cy: 0, s: 1.2, squares: true, poly: true, twins: false },
  gauss: { cx: 0, cy: 0, s: 3.2, axes: true, norms: false },
  gaps: { log: true, x0: 2, x1: LIMIT, mean: true, cramer: true, rec: true, focus: -1 },
  hover: null,

  const Xinv = (px) => { const t = (px - padL) / (W - padL - padR); return v.log ? Math.exp(lx0 + t * (lx1 - lx0)) : x0 + t * (x1 - x0); };

  const Y = (g) => top + fig1H - (g / gMax) * fig1H;
  gapGeom = { padL, padR, top, fig1H, X, Xinv, Y };

  // оси и деления
  ctx.strokeStyle = inkCss; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, top); ctx.lineTo(padL, top + fig1H); ctx.lineTo(W - padR, top + fig1H); ctx.stroke();
  ctx.font = '14px "Old Standard TT", Georgia, serif'; ctx.fillStyle = 'rgb(63,55,45)';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let g = 0; g <= 300; g += 50) {
    ctx.fillText(String(g), padL - 8, Y(g));
    ctx.strokeStyle = 'rgba(29,25,20,0.12)'; ctx.beginPath(); ctx.moveTo(padL + 1, Y(g)); ctx.lineTo(W - padR, Y(g)); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const ticks = [];
  if (v.log) { for (let e = 1; e <= 8; e++) { const n = Math.pow(10, e); if (n >= x0 && n <= x1) ticks.push([n, e < 4 ? fmt(n) : `10${sup(e)}`]); } }
  else { const step = Math.pow(10, Math.floor(Math.log10((x1 - x0) / 4))); for (let n = Math.ceil(x0 / step) * step; n <= x1; n += step) ticks.push([n, fmt(n)]); }
  for (const [n, lab] of ticks) {
    const x = X(n);
    ctx.strokeStyle = inkCss; ctx.beginPath(); ctx.moveTo(x, top + fig1H); ctx.lineTo(x, top + fig1H + 5); ctx.stroke();
    ctx.fillText(lab, x, top + fig1H + 8);
  }
  // штрихи-горизонт
  const cols = Math.floor(W - padL - padR);
  ctx.strokeStyle = 'rgba(29,25,20,0.9)'; ctx.lineWidth = 1;
  ctx.beginPath();
  let hot = null;
  for (let i = 0; i < cols; i++) {
    const a = Xinv(padL + i), b = Xinv(padL + i + 1);
    if (a >= sieved) break;
    const [g, at] = maxGapIn(a, b);
    if (!g) continue;
    const x = padL + i + 0.5;
    ctx.moveTo(x, top + fig1H); ctx.lineTo(x, Y(g));
    if (v.focus >= 0 && Math.abs(i - v.focus) < 1) hot = [x, g, at];
  }
  ctx.stroke();
  // средний промежуток и граница Крамера
  const curve = (f, style, dash) => {
    ctx.strokeStyle = style; ctx.lineWidth = 1.4; ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (let i = 0; i <= cols; i += 2) { const n = Xinv(padL + i); if (n < 3) continue; const y = Y(f(n)); if (y < top) { ctx.moveTo(padL + i, top); continue; } ctx.lineTo(padL + i, y); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  if (v.mean) curve((n) => Math.log(n), 'rgba(110,100,85,0.95)');
  if (v.cramer) curve((n) => Math.log(n) ** 2, redCss, [5, 4]);
  // рекорды
  if (v.rec) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = 'italic 13px "Old Standard TT", Georgia, serif';
    let lastLabelX = -1e9;
    for (const [g, p] of records) {
      if (p < x0 || p > x1) continue;
      const x = X(p), y = Y(g);
      ctx.fillStyle = redCss; ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
      if (g >= 34 && x - lastLabelX > 70 && x < W - padR - 60) {
        ctx.fillStyle = redCss; ctx.fillText(`${g}`, x + 5, y - 3);
        lastLabelX = x;
      }
    }
  }
  if (hot) {
    ctx.strokeStyle = redCss; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(hot[0], top + fig1H); ctx.lineTo(hot[0], Y(hot[1]) - 6); ctx.stroke();
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = inkCss; ctx.font = 'italic 15px "Old Standard TT", Georgia, serif';
  ctx.fillText('Фиг. 1. Промежуток до следующего простого', padL + 8, top - 24);

  // Фиг. 2: π(x) против x / ln x и Li(x)
  const Y2 = (r) => fig2Top + fig2H - ((r - 0.9) / 0.4) * fig2H;
  ctx.fillText('Фиг. 2. Отношения π(x) : (x / ln x) и π(x) : Li(x)', padL + 8, fig2Top - 26);
  ctx.strokeStyle = inkCss; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, fig2Top); ctx.lineTo(padL, fig2Top + fig2H); ctx.lineTo(W - padR, fig2Top + fig2H); ctx.stroke();
  ctx.font = '14px "Old Standard TT", Georgia, serif'; ctx.fillStyle = 'rgb(63,55,45)'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const r of [0.9, 1.0, 1.1, 1.2, 1.3]) {
    ctx.fillText(r.toFixed(1).replace('.', ','), padL - 8, Y2(r));
    ctx.strokeStyle = r === 1 ? 'rgba(29,25,20,0.45)' : 'rgba(29,25,20,0.1)'; ctx.beginPath(); ctx.moveTo(padL + 1, Y2(r)); ctx.lineTo(W - padR, Y2(r)); ctx.stroke();
  }
  const lxa = Math.log(10), lxb = Math.log(Math.max(sieved, 1000));
  const X2 = (n) => padL + ((Math.log(n) - lxa) / (lxb - lxa)) * (W - padL - padR);
  const plot = (f, style) => {
    ctx.strokeStyle = style; ctx.lineWidth = 1.6; ctx.beginPath();
    let started = false;
    for (let i = 0; i <= 260; i++) {
      const n = Math.exp(lxa + (i / 260) * (lxb - lxa));
      if (n >= sieved) break;
      const y = Math.max(fig2Top, Math.min(fig2Top + fig2H, Y2(f(n))));
      started ? ctx.lineTo(X2(n), y) : ctx.moveTo(X2(n), y); started = true;
    }
    ctx.stroke();
  };
  plot((n) => piOf(n) / (n / Math.log(n)), inkCss);
  plot((n) => piOf(n) / li(n), redCss);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgb(63,55,45)';
  for (let e = 1; e <= 7; e++) { const n = Math.pow(10, e); if (n < sieved) { const x = X2(n); ctx.fillText(e < 4 ? fmt(n) : `10${sup(e)}`, x, fig2Top + fig2H + 8); ctx.strokeStyle = inkCss; ctx.beginPath(); ctx.moveTo(x, fig2Top + fig2H); ctx.lineTo(x, fig2Top + fig2H + 5); ctx.stroke(); } }
  // подписи кривых
  ctx.font = 'italic 14px "Old Standard TT", Georgia, serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  const nEnd = Math.max(1000, sieved - 1);
  ctx.fillStyle = inkCss; ctx.fillText('π(x) : (x / ln x)', W - padR - 4, Y2(piOf(nEnd) / (nEnd / Math.log(nEnd))) - 6);
  ctx.fillStyle = redCss; ctx.fillText('π(x) : Li(x)', W - padR - 4, Y2(piOf(nEnd) / li(nEnd)) + 22);
  return v.log ? 'логарифмическая шкала' : 'линейная шкала';
}

/* ================================================================
   Отрисовка и интерфейс
   ================================================================ */
let dirty = true;
const requestDraw = () => { dirty = true; };
function draw(now) {
  const p = state.plate;
  let info = '';
  if (p === 'ulam') info = drawUlam(now);
  else if (p === 'sacks') info = drawSacks();
  else if (p === 'gauss') info = drawGauss();
  else info = drawGaps();
  document.getElementById('scale').textContent = info;
}
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(10, Math.round(r.width)); H = Math.max(10, Math.round(r.height));
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makePaperPattern();
  requestDraw();
}
new ResizeObserver(resize).observe(canvas.parentElement);

function loop(now) {
  requestAnimationFrame(loop);
  if (!W || !H) return; // размеры приходят из ResizeObserver после первой раскладки
  const polyAnim = state.plate === 'ulam' && state.ulam.poly && now - state.polyT0 < 1700;
  if (dirty || polyAnim) { dirty = false; draw(now); }
}

/* ——— левая страница ——— */

const CHECK_SVG = '<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#1d1914" stroke-width="1.8"/></svg>';
function check(label, get, set, swatch) {

function seg(label, options, get, set) {

    b.setAttribute('aria-pressed', String(val === get()));

function buildParams() {

    p.appendChild(check('Многочлен n² + n + c', () => s.poly, (v) => { s.poly = v; state.polyT0 = performance.now(); }, 'var(--red)'));

function renderRecords() {

  el.innerHTML = `<div class="hd">Рекордные промежутки</div>` + list.map(([g, p]) => `<div class="ln"><span class="g">${g}</span><span class="lead"></span><span>после ${fmt(p)}</span></div>`).join('');
}
function setPlate(id) {

/* ——— мышь: сдвиг, масштаб, наведение ——— */
function view() { return state[state.plate]; }
function zoomAt(px, py, k) {
  const v = view();
  if (state.plate === 'gaps') {
    const g = gapGeom; if (!g) return;
    const n = g.Xinv(px);
    if (v.log) {
      const l0 = Math.log(Math.max(2, v.x0)), l1 = Math.log(v.x1), ln = Math.log(n);
      let a = ln - (ln - l0) / k, b = ln + (l1 - ln) / k;
      a = Math.max(Math.log(2), a); b = Math.min(Math.log(LIMIT), b);
      if (b - a < 0.05) return;
      v.x0 = Math.exp(a); v.x1 = Math.exp(b);
    } else {
      let a = n - (n - v.x0) / k, b = n + (v.x1 - n) / k;
      a = Math.max(2, a); b = Math.min(LIMIT, b);
      if (b - a < 200) return;
      v.x0 = a; v.x1 = b;
    }
    requestDraw(); return;
  }
  const limits = { ulam: [0.35, 90], sacks: [0.06, 120], gauss: [0.3, 110] }[state.plate];
  const ns = Math.max(limits[0], Math.min(limits[1], v.s * k));
  const wx = v.cx + (px - W / 2) / v.s, wy = v.cy - (py - H / 2) / v.s;
  v.s = ns;
  v.cx = wx - (px - W / 2) / ns; v.cy = wy + (py - H / 2) / ns;
  requestDraw();
}
let drag = null;
const pointers = new Map();
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { x: e.clientX, y: e.clientY };
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (pointers.has(e.pointerId)) {
    const prev = pointers.get(e.pointerId);
    if (pointers.size === 2) { // щипок
      const other = [...pointers.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
      if (d0 > 10) zoomAt((e.clientX + other.x) / 2 - r.left, (e.clientY + other.y) / 2 - r.top, d1 / d0);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      return;
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  if (drag && pointers.size === 1) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    const v = view();
    if (state.plate === 'gaps') {
      const g = gapGeom; if (g) {
        const span = W - g.padL - g.padR;
        if (v.log) { const l0 = Math.log(v.x0), l1 = Math.log(v.x1), d = (-dx / span) * (l1 - l0); const a = Math.max(Math.log(2), Math.min(Math.log(LIMIT) - (l1 - l0), l0 + d)); v.x0 = Math.exp(a); v.x1 = Math.exp(a + (l1 - l0)); }
        else { const d = (-dx / span) * (v.x1 - v.x0); const a = Math.max(2, Math.min(LIMIT - (v.x1 - v.x0), v.x0 + d)); v.x1 = a + (v.x1 - v.x0); v.x0 = a; }
      }
    } else { v.cx -= dx / v.s; v.cy += dy / v.s; }
    requestDraw();
  }
  hoverAt(px, py);
});
const endPtr = (e) => { pointers.delete(e.pointerId); if (!pointers.size) { drag = null; canvas.classList.remove('dragging'); } };
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('pointerleave', () => { if (!drag) { state.hover = null; if (state.plate === 'gaps') state.gaps.focus = -1; requestDraw(); } });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });
canvas.addEventListener('dblclick', (e) => { const r = canvas.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 2); });

const readout = document.getElementById('readout');
function describeInt(n) {
  if (!known(n)) return `<b>${fmt(n)}</b> — ещё не&nbsp;просеяно`;
  if (n === 1) return `<b>1</b> — ни&nbsp;простое, ни&nbsp;составное`;
  if (isPrime(n)) return `<b class="pr">${fmt(n)}</b> — простое, №&nbsp;${fmt(piOf(n))} по&nbsp;счёту`;
  return `<b>${fmt(n)}</b> = ${factStr(factor(n))}`;
}
function hoverAt(px, py) {
  const v = view();
  if (state.plate === 'ulam') {
    const x = Math.round(v.cx + (px - W / 2) / v.s), y = Math.round(v.cy - (py - H / 2) / v.s);
    const n = ulamK(x, y) + v.center - 1;
    state.hover = { plate: 'ulam', x, y };
    readout.innerHTML = describeInt(n);
  } else if (state.plate === 'sacks') {
    const wx = v.cx + (px - W / 2) / v.s, wy = v.cy - (py - H / 2) / v.s;
    const r = Math.hypot(wx, wy);
    // ближайшее n: перебираем кандидатов вокруг r²
    let best = 1, bd = 1e9;
    const c = Math.round(r * r);
    for (let n = Math.max(1, c - Math.ceil(4 * r) - 4); n <= c + Math.ceil(4 * r) + 4; n++) {
      const [x, y] = sacksXY(n); const d = Math.hypot(x - wx, y - wy);
      if (d < bd) { bd = d; best = n; }
    }
    if (bd * v.s > 26) { state.hover = null; readout.innerHTML = 'Наведите на&nbsp;число.'; }
    else { state.hover = { plate: 'sacks', n: best }; readout.innerHTML = describeInt(best) + (Number.isInteger(Math.sqrt(best)) ? ` = ${Math.sqrt(best)}²` : ''); }
  } else if (state.plate === 'gauss') {
    const a = Math.round(v.cx + (px - W / 2) / v.s), b = Math.round(v.cy - (py - H / 2) / v.s);
    state.hover = { plate: 'gauss', a, b };
    const N = a * a + b * b;
    if (!gaussKnown(a, b)) readout.innerHTML = `<b>${gStr(a, b)}</b> — ещё не&nbsp;просеяно`;
    else if (N === 0) readout.innerHTML = '<b>0</b>';
    else if (N === 1) readout.innerHTML = `<b>${gStr(a, b)}</b> — единица, обратимый элемент`;
    else if (gaussPrime(a, b)) readout.innerHTML = `<b class="pr">${gStr(a, b)}</b> — гауссово простое, норма ${fmt(N)}`;
    else if (b === 0 && isPrime(Math.abs(a))) { const p = Math.abs(a); const [x, y] = twoSquares(p); readout.innerHTML = `<b>${fmt(p)}</b> = (${gStr(x, y)})(${gStr(x, -y)}) — здесь составное`; }
    else readout.innerHTML = `<b>${gStr(a, b)}</b> — составное, норма ${fmt(N)} = ${factStr(factor(N))}`;
  } else {
    const g = gapGeom; if (!g) return;
    const i = Math.floor(px - g.padL);
    if (py > g.top + g.fig1H + 30 || i < 0 || px > W - g.padR) { state.gaps.focus = -1; requestDraw(); return; }
    const a = g.Xinv(g.padL + i), b = g.Xinv(g.padL + i + 1);
    const [gap, at] = maxGapIn(a, b);
    state.gaps.focus = i;
    const isRec = records.some((r) => r[1] === at && r[0] === gap);
    readout.innerHTML = gap ? `После <b>${fmt(at)}</b> — пустыня длиной <b class="pr">${gap}</b>${isRec ? ', рекорд' : ''}` : 'Здесь простых нет.';
  }
  requestDraw();
}
function twoSquares(p) { for (let x = 1; x * x < p; x++) { const y = Math.round(Math.sqrt(p - x * x)); if (x * x + y * y === p) return [Math.max(x, y), Math.min(x, y)]; } return [p, 0]; }

document.getElementById('zin').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.6));
document.getElementById('zout').addEventListener('click', () => zoomAt(W / 2, H / 2, 1 / 1.6));
document.getElementById('zreset').addEventListener('click', resetView);
function resetView() {
  Object.assign(state[state.plate], JSON.parse(JSON.stringify(DEFAULTS[state.plate])));
  if (state.plate === 'ulam') state.polyT0 = performance.now();
  buildParams(); requestDraw();
}
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key >= '1' && e.key <= '4') setPlate(PLATES[+e.key - 1].id);
  else if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.5);
  else if (e.key === '-' || e.key === '_') zoomAt(W / 2, H / 2, 1 / 1.5);
  else if (e.key === '0') resetView();
});

/* ——— решето: запуск ——— */
const foot = document.getElementById('foot');
const bar = document.getElementById('bar');
function updateFoot() {
  const done = sieved >= LIMIT;
  foot.firstChild.textContent = done
    ? `Решето Эратосфена: просеяно ${fmt(LIMIT)} чисел, найдено ${fmt(donePrimes + 1)} простых. Наибольший промежуток — ${records.length ? records[records.length - 1][0] : 0}.`
    : `Решето Эратосфена: просеяно ${fmt(sieved)} из ${fmt(LIMIT)}…`;
  bar.style.transform = `scaleX(${sieved / LIMIT})`;
}
let worker;
try {
  worker = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' })));
  worker.onmessage = (e) => {
    ingest(e.data);
    updateFoot();
    if (state.plate === 'gaps') renderRecords();
    requestDraw();
  };
  worker.postMessage({ limit: LIMIT, seg: SEG });
} catch (err) {
  // запасной путь: считаем на главном потоке по сегментам
  const run = new Function('self', WORKER.replace('self.onmessage = (e) =>', 'return (e) =>'));
  const post = (m) => { ingest(m); updateFoot(); requestDraw(); };
  const fn = run({ postMessage: post });
  setTimeout(() => fn({ data: { limit: LIMIT, seg: SEG } }), 50);
}

setPlate('ulam');
updateFoot();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
