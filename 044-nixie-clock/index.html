<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ламповые часы</title>
<meta name="description" content="Часы на газоразрядных индикаторах: неоновые цифры в стеклянных колбах, вакуумно-люминесцентная панель и декатрон. Часы, таймер и секундомер.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" width="0" height="0">
  <defs>
    <filter id="glow-big" x="-60%" y="-40%" width="220%" height="180%"><feGaussianBlur stdDeviation="5.5"/></filter>
    <filter id="glow-mid" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="glow-vfd" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CFE3E0" stop-opacity=".26"/>
      <stop offset=".16" stop-color="#9FB6B2" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset=".86" stop-color="#9FB6B2" stop-opacity=".06"/>
      <stop offset="1" stop-color="#CFE3E0" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="getter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9C3BA" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#6D6A66" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3A3836" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neon-fog" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF6A10" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#FF4A00" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FF4A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E0C0B"/><stop offset=".35" stop-color="#2B2724"/><stop offset=".65" stop-color="#1C1917"/><stop offset="1" stop-color="#0A0908"/>
    </linearGradient>
  </defs>
</svg>

<header class="top">
  <h1>Ламповые часы</h1>
  <p>Неон в&nbsp;стекле: ИН-14 для цифр, ИВ-18 для даты, декатрон ОГ-4 для секунд</p>
</header>

<main class="stage">
  <div class="clock" id="clock">
    <div class="tubes" id="tubes" aria-live="off"></div>
    <div class="case">
      <div class="deck"></div>
      <div class="front">
        <div class="vfd-wrap"><div class="vfd" id="vfd"></div><span class="engr">дата · круг</span></div>
        <div class="controls">
          <div class="modes" role="radiogroup" aria-label="Режим">
            <button class="brass" role="radio" data-mode="clock" aria-checked="true"><i></i><span>Часы</span></button>
            <button class="brass" role="radio" data-mode="timer" aria-checked="false"><i></i><span>Таймер</span></button>
            <button class="brass" role="radio" data-mode="watch" aria-checked="false"><i></i><span>Секундомер</span></button>
            <button class="brass" data-act="warm" title="Перебрать все катоды — так лампы не «отравляются»"><i></i><span>Прогрев</span></button>
          </div>
          <div class="acts" id="acts"></div>
        </div>
        <div class="dek-wrap"><div class="dekatron" id="dek"></div><span class="engr">секунды</span></div>
      </div>
      <div class="nameplate"><b>НЕОН-6</b><span>газоразрядные часы</span></div>
      <button class="toggle" id="btn-sound" aria-pressed="false" title="Звук реле"><span class="bat"></span><span class="tl">звук</span></button>
    </div>
    <div class="pool" aria-hidden="true"></div>
  </div>
</main>
<p class="note" id="note">Щёлкните по лампе — она переберёт все цифры.</p>
<script src="app.js"></script>
</body>
</html>
