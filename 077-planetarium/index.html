<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Небосвод</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Небо над вами: яркие звёзды с настоящими координатами и цветами, созвездия, планеты по орбитальным элементам, Луна и сумерки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#e9eefc; --dim:rgba(233,238,252,.72); --line:rgba(233,238,252,.2); --panel:rgba(8,13,32,.78); --gold:#f3cf7a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#040817;color:var(--ink);font:500 13px/1.45 "Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  button,select,input{font:inherit;color:inherit}

  .top{position:fixed;left:28px;top:24px;pointer-events:none;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  h1{margin:0;font:400 38px/1 "Tenor Sans",serif;letter-spacing:.14em;text-transform:uppercase}
  .where{margin-top:12px;display:flex;gap:10px;align-items:baseline;pointer-events:auto}
  .where select{appearance:none;-webkit-appearance:none;background:none;border:0;border-bottom:1px solid var(--line);padding:2px 18px 3px 0;font:600 14px "Manrope",sans-serif;
                color:var(--ink);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
                background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .where select option{color:#111}
  .where select:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
  .clock{font:600 14px "Manrope",sans-serif;color:var(--dim);font-variant-numeric:tabular-nums}
  .note{margin-top:10px;max-width:380px;font-size:13px;color:var(--dim);line-height:1.5;pointer-events:auto}
  .note button{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px;background:var(--panel);
       border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .bar button{height:40px;min-width:40px;padding:0 13px;border-radius:20px;border:0;background:none;color:var(--dim);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
  .bar button:hover{color:var(--ink)}
  .bar button[aria-pressed="true"]{background:var(--ink);color:#0a1024}
  .bar button:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}

  .layers{position:fixed;right:22px;top:22px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .layers button{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:600;cursor:pointer;backdrop-filter:blur(8px)}
  .layers button[aria-pressed="true"]{color:var(--ink);border-color:rgba(233,238,252,.5)}
  .layers button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

  .card{position:fixed;right:22px;bottom:84px;width:300px;padding:18px 20px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .card.on{opacity:1;transform:none;pointer-events:auto}
  .card h2{margin:0;font:400 26px/1.1 "Tenor Sans",serif;letter-spacing:.04em}
  .card .kind{margin-top:5px;color:var(--gold);font-weight:600}
  .card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:14px 0 0;font-variant-numeric:tabular-nums}
  .card dt{color:var(--dim)}
  .card dd{margin:0;text-align:right}
  .card .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--dim);font-size:18px;cursor:pointer}
  .card .x:hover{color:var(--ink);background:rgba(255,255,255,.06)}

  .hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);color:var(--dim);font-size:13px;pointer-events:none;transition:opacity 1s;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  @media (max-width:760px){
    .top{left:16px;top:14px;right:16px}
    h1{font-size:26px}
    .where{flex-wrap:wrap;gap:4px 12px}
    .clock{font-size:12.5px}
    .note{max-width:none;font-size:12.5px}
    .layers{left:10px;right:10px;top:auto;bottom:68px;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .layers::-webkit-scrollbar{display:none}
    .layers button{flex:none;height:34px;padding:0 12px;font-size:12px}
    .bar{bottom:12px;gap:2px;padding:4px;max-width:calc(100vw - 16px)}
    .bar button{padding:0 10px;height:40px;min-width:40px;font-size:12.5px}
    .bar .mob-hide{display:none}
    .card{left:12px;right:12px;width:auto;bottom:112px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="sky" aria-label="Карта неба. Тяните, чтобы осмотреться; колесо — масштаб; клик по светилу — подробности."></canvas>

<div class="top">
  <h1>Небосвод</h1>
  <div class="where">
    <select id="city" aria-label="Место наблюдения"></select>
    <span class="clock" id="clock">—</span>
  </div>
  <div class="note" id="note" hidden></div>
</div>

<div class="layers" id="layers">
  <button data-l="lines" aria-pressed="true">Созвездия</button>
  <button data-l="names" aria-pressed="true">Названия</button>
  <button data-l="ecl" aria-pressed="false">Эклиптика</button>
  <button data-l="grid" aria-pressed="false">Сетка</button>
  <button data-l="trails" aria-pressed="false">Следы звёзд</button>
</div>

<div class="bar" id="bar" role="group" aria-label="Время">
  <button id="back" class="mob-hide" aria-label="На час назад">−1 ч</button>
  <button data-sp="1" aria-pressed="true">Живое</button>
  <button data-sp="120" class="mob-hide">2 мин/с</button>
  <button data-sp="1800">½ ч/с</button>
  <button data-sp="21600">6 ч/с</button>
  <button data-sp="0">Пауза</button>
  <button id="fwd" class="mob-hide" aria-label="На час вперёд">+1 ч</button>
  <span class="sep mob-hide"></span>
  <button id="now">Сейчас</button>
</div>
<div class="hint" id="hint">Тяните небо · колесо — масштаб · клик по звезде — подробности</div>

<div class="card" id="card" role="dialog" aria-live="polite">
  <button class="x" id="cardX" aria-label="Закрыть">×</button>
  <h2 id="cName"></h2>
  <div class="kind" id="cKind"></div>
  <dl id="cData"></dl>
</div>

  if (o.type === 'star') { kind = 'Звезда' + (constellationOf(o) ? ' · ' + constellationOf(o) : ''); rows.push(['Блеск', num(o.mag, 2) + ' m'], ['Цвет (B−V)', num(o.bv, 2)]); }
  if (o.type === 'planet') { kind = 'Планета'; rows.push(['До Земли', num(o.dist, 2) + ' а. е.'], ['', Math.round(o.dist * 149.598).toLocaleString('ru-RU') + ' млн км'], ['Свет идёт', num(o.dist * 499 / 60, 1) + ' мин']); }
  if (o.type === 'moon') { kind = 'Спутник Земли'; rows.push(['Фаза', Math.round(o.phase * 100) + ' % · ' + (o.waxing ? 'растёт' : 'убывает')], ['До Земли', Math.round(o.distKm).toLocaleString('ru-RU') + ' км']); }
  if (o.type === 'sun') { kind = 'Звезда · центр Солнечной системы'; rows.push(['До Земли', num(o.dist, 4) + ' а. е.']); }
  rows.push(['Высота', num(h.alt, 1) + '°' + (h.alt < 0 ? ' · за горизонтом' : '')], ['Азимут', Math.round(h.az) + '° · ' + dirName(h.az)], ['Прямое восхождение', raStr(o.ra)], ['Склонение', decStr(o.dec)]);
  const key = o.name + rows.map(r => r[1]).join();
  if (key === cardKey) return;
  cardKey = key;
  document.getElementById('cName').textContent = o.name;
  document.getElementById('cKind').textContent = kind;
  document.getElementById('cData').innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  card.classList.add('on');
}
document.getElementById('cardX').addEventListener('click', () => { S.sel = null; card.classList.remove('on'); });

/* =====================================================================
   Управление
   ===================================================================== */
let drag = null, moved = 0;
const hint = document.getElementById('hint');
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, az: S.az, alt: S.alt }; moved = 0; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); hint.style.opacity = 0; });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = S.fov / W * 1.2;
  moved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0);
  S.az = norm360(drag.az + (e.clientX - drag.x) * k);
  S.alt = Math.max(-10, Math.min(90, drag.alt + (e.clientY - drag.y) * k));
  clearTrails();
});
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  if (drag && moved < 6) {
    const best = hit.reduce((m, h) => { const d = Math.hypot(h.x - e.clientX, h.y - e.clientY); return d < h.r && (!m || d < m.d) ? { h, d } : m; }, null);
    if (best) { S.sel = best.h.o; cardKey = ''; } else { S.sel = null; card.classList.remove('on'); }
  }
  drag = null;
});
cv.addEventListener('wheel', e => { e.preventDefault(); S.fov = Math.max(20, Math.min(170, S.fov * Math.exp(e.deltaY * 0.0012))); clearTrails(); hint.style.opacity = 0; }, { passive: false });
let pinch = null;
cv.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
cv.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); S.fov = Math.max(20, Math.min(170, S.fov * pinch / d)); pinch = d; drag = null; } }, { passive: true });

document.querySelectorAll('#bar [data-sp]').forEach(b => b.addEventListener('click', () => {
  S.speed = +b.dataset.sp;
  document.querySelectorAll('#bar [data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
document.getElementById('back').addEventListener('click', () => { S.time -= 3600e3; clearTrails(); });
document.getElementById('fwd').addEventListener('click', () => { S.time += 3600e3; clearTrails(); });
document.getElementById('now').addEventListener('click', () => { S.time = Date.now(); note.hidden = true; clearTrails(); });
document.querySelectorAll('#layers button').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.l; S.layers[k] = !S.layers[k]; b.setAttribute('aria-pressed', String(S.layers[k]));
  if (k === 'trails') { clearTrails(); if (S.layers.trails && S.speed < 600) { S.speed = 1800; document.querySelectorAll('#bar [data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sp === '1800'))); } }
}));

/* ---------- часы ---------- */
const clock = document.getElementById('clock');
function tickClock() {
  const tz = LOC()[3], d = new Date(S.time + tz * 3600e3);
  const dd = String(d.getUTCDate()).padStart(2, '0'), mo = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'][d.getUTCMonth()];
  clock.textContent = `${+dd} ${mo} ${d.getUTCFullYear()}, ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')} · UTC+${tz}`;
}

/* ---------- старт: если сейчас светло — показываем ближайшую ночь ---------- */
const note = document.getElementById('note');
(function pickNight() {
  const [, lat, lon, tz] = LOC();
  const sunAlt = t => { const J = jd(t), b = bodies(J).find(x => x.key === 'sun'); return eqToHor(b.ra, b.dec, norm360(gmst(J) + lon), lat).alt; };
  if (sunAlt(S.time) > -12) {
    const d = new Date(S.time + tz * 3600e3);
    let t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 23, 30) - tz * 3600e3;
    if (t < S.time) t += 86400e3;
    S.time = t;
    note.innerHTML = 'Сейчас у вас светло, поэтому показываю небо сегодняшней ночи. <button id="nowNote">Вернуть реальное время</button>';
    note.hidden = false;
    document.getElementById('nowNote').addEventListener('click', () => { S.time = Date.now(); note.hidden = true; clearTrails(); });
  }
})();

/* ---------- цикл ---------- */
let last = performance.now(), running = true;
S.tick = 0;
document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(loop); } });
function loop(now) {
  if (!running) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  S.time += dt * 1000 * S.speed;
  S.tick += dt;
  render();
  if (Math.floor(S.tick * 4) !== Math.floor((S.tick - dt) * 4)) tickClock();
  requestAnimationFrame(loop);
}
resize();
tickClock();
setTimeout(() => { hint.style.opacity = 0; }, 8000);
requestAnimationFrame(loop);
})();
</script>
</body>
