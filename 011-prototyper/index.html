<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототипатор — узловой редактор анимаций интерфейса</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Соединяйте патчи — «Нажатие», «Пружина», «Переход», «Слой» — и макет телефона оживает. Граф потоков данных с пружинной физикой.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
        <circle cx="7" cy="8" r="4" fill="#2ec4b6"/><circle cx="21" cy="14" r="4" fill="#ff9f43"/><circle cx="8" cy="21" r="4" fill="#4ea8ff"/>
        <path d="M11 8 C 16 8, 15 14, 17 14 M17 14 C 14 14, 15 21, 12 21" fill="none" stroke="#c9ccd4" stroke-width="1.6"/>
      </svg>
      <h1>Прототипатор</h1>
      <span class="sub">патчи, провода и&nbsp;пружины вместо кода</span>
    </div>
    <div class="presets" role="tablist" aria-label="Примеры" id="presets"></div>
    <div class="bar-actions">
      <button type="button" class="btn" id="add-btn" aria-expanded="false" aria-controls="palette">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Патч
      </button>
      <button type="button" class="btn ghost" id="reset-btn">Сбросить пример</button>
    </div>
  </header>

  <main class="work">
    <section class="editor" id="editor" aria-label="Граф патчей">
      <div class="world" id="world">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
      <div class="palette" id="palette" hidden></div>
      <div class="hint-row" id="hint-row">
        <span><b>Тяните</b> от выхода к входу — провод</span>
        <span><b>Двойной клик</b> по проводу — удалить</span>
        <span><b>Тяните число</b> — меняется значение</span>
        <span><b>Тяните фон</b> — двигать холст</span>
      </div>
    </section>

    <aside class="viewer" aria-label="Макет телефона">
      <div class="phone" id="phone">
        <div class="island"></div>
        <div class="screen" id="screen"></div>
        <div class="ghost-cursor" id="ghost"></div>
      </div>
      <p class="viewer-cap" id="viewer-cap">Нажмите на сердце</p>
      <p class="stats" id="stats">—</p>
    </aside>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
