<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>В бездну — погружение на 10 935 метров</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Прокрутите страницу от поверхности океана до дна Марианского жёлоба: свет гаснет, давление растёт, а на своих настоящих глубинах встречаются кальмары, удильщики и «Триест».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,600;0,800;1,300&family=Onest:wght@400;500;600&family=Jura:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e9f6ff;
    --ink-2: rgba(233, 246, 255, 0.8);
    --ink-3: rgba(233, 246, 255, 0.6);
    --glow: #7df9ff;
    --biolum: #59ffd0;
    --deep: #01040c;
    --head: "Exo 2", "Onest", system-ui, sans-serif;
    --body: "Onest", system-ui, sans-serif;
    --num: "Jura", "Onest", ui-monospace, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--deep); }
  body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #sea { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }

  /* ——— поверхность ——— */
  .surface { height: 100vh; height: 100svh; position: relative; display: flex; flex-direction: column; justify-content: flex-start; padding: 12vh 8vw 0; }
  .surface .kicker { font: 600 13px var(--head); letter-spacing: .3em; text-transform: uppercase; color: #0d2c4d; }
  .surface h1 { font: 800 clamp(72px, 12vw, 176px)/0.86 var(--head); letter-spacing: -.03em; margin: 14px 0 20px; color: #0a2442; }
  .surface p { font-size: clamp(17px, 1.5vw, 21px); max-width: 520px; margin: 0; color: #123a5e; line-height: 1.5; }
  .dive-cue { position: absolute; left: 8vw; bottom: 7vh; display: flex; align-items: center; gap: 12px; color: #051c33; font: 600 16px var(--body); }
  .dive-cue svg { width: 22px; height: 22px; animation: bob 2s var(--ease) infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* ——— океан ——— */
  #ocean { position: relative; }
  .zone { position: absolute; left: 8vw; width: min(470px, 84vw); pointer-events: none; }
  .zone .z-depth { font: 700 15px var(--num); letter-spacing: .08em; color: var(--glow); }
  .zone h2 { font: 800 clamp(40px, 6vw, 84px)/0.95 var(--head); letter-spacing: -.02em; margin: 8px 0 14px; }
  .zone p { font-size: 18px; color: var(--ink-2); margin: 0; }
  .zone .rule { height: 1px; background: linear-gradient(to right, rgba(125, 249, 255, 0.6), rgba(125, 249, 255, 0)); margin-bottom: 18px; }

  .item { position: absolute; display: flex; align-items: center; gap: 22px; }
  .item.left { left: 8vw; width: calc(50vw - 8vw - 28px); }
  .item.right { right: max(8vw, 190px); width: calc(50vw - max(8vw, 190px) - 28px); flex-direction: row-reverse; text-align: right; }
  .item .art { flex: 0 1 46%; min-width: 0; display: flex; justify-content: center; }
  .item .art svg { display: block; overflow: visible; max-width: 100%; height: auto; }
  .item .card { flex: 1 1 54%; }
  .card { max-width: 340px; padding: 16px 18px 15px; border-radius: 14px; background: rgba(1, 10, 28, 0.58); border: 1px solid rgba(125, 249, 255, 0.18); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .card .d { font: 700 14px var(--num); color: var(--glow); letter-spacing: .06em; }
  .card h3 { font: 600 22px/1.15 var(--head); margin: 4px 0 6px; }
  .card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); }
  .item.right .card { text-align: left; }
  .marker { position: absolute; left: 0; right: 0; height: 1px; pointer-events: none; }
  .marker::before { content: ""; position: absolute; left: 0; width: 5vw; height: 1px; background: rgba(125, 249, 255, 0.35); }

  .everest { position: absolute; left: 2.4vw; width: 36px; border-left: 1px dashed rgba(233, 246, 255, 0.35); pointer-events: none; }
  .everest span { position: absolute; left: 12px; top: 8px; font: 500 13px var(--body); color: var(--ink-3); writing-mode: vertical-rl; letter-spacing: .06em; white-space: nowrap; }

  .bottom { position: absolute; left: 0; right: 0; padding: 0 8vw; text-align: center; }
  .bottom h2 { font: 800 clamp(44px, 7vw, 96px)/0.95 var(--head); margin: 0 0 16px; }
  .bottom p { max-width: 620px; margin: 0 auto 14px; color: var(--ink-2); font-size: 18px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 26px; border-radius: 25px; border: 1px solid rgba(233, 246, 255, 0.45); background: rgba(1, 10, 28, 0.5); color: var(--ink); font: 600 17px var(--body); cursor: pointer; margin-top: 14px; transition: background .25s, border-color .25s; }
  .btn:hover { background: rgba(20, 60, 100, 0.55); border-color: rgba(233, 246, 255, 0.8); }
  .btn svg { width: 18px; height: 18px; }
  :focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  /* ——— глубиномер ——— */
  .gauge { position: fixed; right: 26px; top: 50%; transform: translateY(-50%); width: 150px; z-index: 5; opacity: 0; transition: opacity .6s var(--ease); pointer-events: none; }
  .gauge.on { opacity: 1; pointer-events: auto; }
  .gauge .lbl { font: 600 12px var(--head); letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3); }
  .gauge .val { font: 700 38px/1 var(--num); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .gauge .val small { font-size: 18px; margin-left: 4px; color: var(--ink-2); }
  .gauge .zn { font: 600 14px var(--head); color: var(--glow); min-height: 20px; }
  .gauge dl { margin: 12px 0 14px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13px; }
  .gauge dt { color: var(--ink-3); }
  .gauge dd { margin: 0; font: 500 13px var(--num); text-align: right; }
  .track { position: relative; height: 34vh; margin-left: 6px; border-left: 1px solid rgba(233, 246, 255, 0.35); }
  .track .tk { position: absolute; left: -4px; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--ink-3); font: 500 13px var(--body); cursor: pointer; transform: translateY(-50%); }
  .track .tk::before { content: ""; width: 7px; height: 1px; background: rgba(233, 246, 255, 0.6); }
  .track .tk:hover { color: var(--ink); }
  .track .me { position: absolute; left: -6px; width: 11px; height: 11px; border-radius: 50%; background: var(--glow); transform: translateY(-50%); }

  @media (max-width: 900px) {
    .gauge { top: 12px; right: 12px; transform: none; width: auto; padding: 8px 12px; border-radius: 12px; background: rgba(1, 10, 28, 0.6); border: 1px solid rgba(125, 249, 255, 0.2); }
    .gauge .val { font-size: 24px; margin: 2px 0 0; }
    .gauge dl, .gauge .track, .gauge .lbl { display: none; }
    .gauge .zn { font-size: 12px; min-height: 0; }
    .item, .item.left, .item.right { left: 5vw; right: auto; width: 90vw; flex-direction: row; align-items: center; text-align: left; gap: 10px; }
    .item .art { width: 30%; }
    .item .art svg { width: 100%; height: auto; max-height: 120px; }
    .card { max-width: none; flex: 1; padding: 12px 14px; }
    .card h3 { font-size: 18px; }
    .card p { font-size: 14px; }
    .zone { left: 5vw; width: 90vw; }
    .zone h2 { font-size: 40px; }
    .zone p { font-size: 16px; }
    .everest { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .dive-cue svg { animation: none; } }
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas>

<header class="surface">
  <div class="kicker">Погружение на 10 935 метров</div>
  <h1>В бездну</h1>
  <p>Прокрутите страницу вниз, до&nbsp;дна Марианского жёлоба. Масштаб честный: каждые сто метров глубины&nbsp;— сто двадцать пять пикселей. Свет кончится очень быстро, дорога&nbsp;— нет.</p>
  <div class="dive-cue"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3v15M5 12l6 6 6-6"/></svg>Нырнуть</div>
</header>

<main id="ocean" aria-label="Толща океана"></main>

<aside class="gauge" id="gauge" aria-live="off">
  <div class="lbl">Глубина</div>
  <div class="val" id="gDepth">0<small>м</small></div>
  <div class="zn" id="gZone">Солнечная зона</div>
  <dl>
    <dt>давление</dt><dd id="gP">1 атм</dd>
    <dt>вода</dt><dd id="gT">24 °C</dd>
    <dt>свет</dt><dd id="gL">100 %</dd>
  </dl>
  <div class="track" id="track"><span class="me" id="gMe"></span></div>
</aside>

<script>
(() => {
'use strict';
const SCALE = 1.25;                 // пикселей на метр
const BOTTOM = 10935;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const NB = ' ';
const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, NB);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================================================================
   Зоны и обитатели (глубины — по данным наблюдений)
   ================================================================ */
const ZONES = [
  { d: 0, name: 'Солнечная зона', short: 'Солнечная' },
  { d: 200, name: 'Сумеречная зона', short: 'Сумеречная', title: 'Сумеречная зона', text: 'Здесь остаётся около одного процента солнечного света. Водорослям его уже не хватает: фотосинтез кончается, и дальше жизнь питается тем, что падает сверху.' },
  { d: 1000, name: 'Полуночная зона', short: 'Полуночная', title: 'Полуночная зона', text: 'Солнечного света нет совсем. Единственный свет здесь живой: около трёх четвертей обитателей толщи воды умеют светиться.' },
  { d: 4000, name: 'Бездна', short: 'Бездна', title: 'Бездна', text: 'Вода на пару градусов теплее нуля, давление — четыреста атмосфер. На этих глубинах лежит дно большей части океана.' },
  { d: 6000, name: 'Зона желобов', short: 'Желоба', title: 'Зона желобов', text: 'Ниже шести километров океан уходит в узкие разломы. Их назвали хадальными — в честь Аида. Пищи мало: она медленно оседает сверху хлопьями «морского снега».' },
];

// SVG-рисунки: стилизованные силуэты с живым светом
const G = '#59ffd0', C = '#7df9ff';
const glow = (id, color) => `<radialGradient id="${id}"><stop offset="0" stop-color="${color}" stop-opacity=".95"/><stop offset=".35" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient>`;
const ART = {
  red: () => `<svg width="260" height="90" viewBox="0 0 260 90">${[['#e0452f', 0], ['#ef8a2a', 1], ['#f2d12a', 2], ['#3fbf5a', 3], ['#2f6fe0', 4]].map(([c, i]) => `<g transform="translate(${20 + i * 50} 45)"><circle r="18" fill="${c}"/><circle r="18" fill="#0a3a5a" opacity="${[0.75, 0.55, 0.35, 0.18, 0.05][i]}"/></g>`).join('')}<text x="20" y="88" fill="rgba(233,246,255,.6)" font-family="Onest" font-size="13">так выглядят краски на глубине 10 м</text></svg>`,
  diver: () => `<svg width="220" height="120" viewBox="0 0 220 120"><g fill="#062b45"><ellipse cx="110" cy="58" rx="46" ry="11"/><circle cx="160" cy="54" r="10"/><rect x="72" y="44" width="42" height="9" rx="4" fill="#0d4d70"/><path d="M64 58 L28 44 L18 52 L60 64 Z"/><path d="M64 60 L26 72 L22 82 L62 66 Z"/></g><circle cx="167" cy="52" r="4" fill="#9ee7ff" opacity=".7"/>${[0, 1, 2, 3, 4, 5].map((i) => `<circle cx="${168 + (i % 2) * 6}" cy="${40 - i * 7}" r="${2 + i * 0.6}" fill="none" stroke="rgba(233,246,255,.7)" stroke-width="1.2"/>`).join('')}</svg>`,
  freediver: () => `<svg width="120" height="180" viewBox="0 0 120 180"><g fill="#041f38"><circle cx="60" cy="150" r="9"/><path d="M52 142 Q60 90 58 60 L64 60 Q66 92 68 142 Z"/><path d="M58 62 L40 18 L50 14 L62 56 Z"/><path d="M62 62 L76 16 L86 20 L66 58 Z"/></g><path d="M60 158 L60 178" stroke="rgba(233,246,255,.35)" stroke-dasharray="3 5"/></svg>`,
  scuba: () => `<svg width="130" height="170" viewBox="0 0 130 170"><g fill="#031a30"><circle cx="64" cy="140" r="9"/><path d="M56 132 Q60 84 60 58 L70 58 Q72 86 74 132 Z"/><rect x="72" y="80" width="12" height="40" rx="5" fill="#0b3b5c"/><path d="M60 60 L46 16 L56 13 L66 55 Z"/><path d="M66 58 L82 18 L92 22 L72 58 Z"/></g><circle cx="64" cy="140" r="3.5" fill="#9ee7ff" opacity=".5"/></svg>`,
  lantern: () => { let s = '<svg width="360" height="170" viewBox="0 0 360 170"><defs>' + glow('lg', G) + '</defs>'; for (let i = 0; i < 16; i++) { const x = 20 + (i * 67) % 320, y = 20 + ((i * 41) % 130), k = 0.6 + ((i * 7) % 5) * 0.12; s += `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 0 Q14 -9 30 0 Q14 9 0 0 Z M30 0 L38 -6 L38 6 Z" fill="#082643"/>${[6, 11, 16, 21].map((px) => `<circle cx="${px}" cy="4" r="3.2" fill="url(#lg)"/>`).join('')}<circle cx="5" cy="-1" r="1.6" fill="#bff"/></g>`; } return s + '</svg>'; },
  penguin: () => `<svg width="200" height="110" viewBox="0 0 200 110"><g transform="rotate(12 100 55)"><path d="M30 58 Q60 30 130 44 Q170 50 178 58 Q170 66 130 72 Q60 86 30 58 Z" fill="#051a2c"/><path d="M60 66 Q100 74 140 64 Q120 72 80 74 Z" fill="#12344f"/><path d="M178 58 L192 56 L178 61 Z" fill="#051a2c"/><path d="M92 54 L70 80 L100 64 Z" fill="#051a2c"/><circle cx="168" cy="54" r="2" fill="#bfe"/></g>${[0, 1, 2].map((i) => `<circle cx="${40 - i * 10}" cy="${58 - i * 12}" r="${2 + i}" fill="none" stroke="rgba(233,246,255,.5)"/>`).join('')}</svg>`,
  barreleye: () => `<svg width="230" height="120" viewBox="0 0 230 120"><path d="M40 70 Q90 40 160 58 Q190 66 204 72 Q190 80 160 84 Q90 96 40 70 Z" fill="#0a2a44"/><path d="M204 72 L224 58 L220 72 L224 86 Z" fill="#0a2a44"/><path d="M52 68 Q60 18 110 22 Q142 26 150 60" fill="rgba(160,240,255,.08)" stroke="rgba(160,240,255,.5)" stroke-width="1.5"/><ellipse cx="96" cy="42" rx="7" ry="13" fill="#41ff8a" opacity=".85"/><ellipse cx="116" cy="44" rx="7" ry="13" fill="#41ff8a" opacity=".6"/><circle cx="58" cy="76" r="2.4" fill="#bff"/></svg>`,
  squid: () => `<svg width="420" height="170" viewBox="0 0 420 170"><defs><linearGradient id="sq" x1="0" x2="1"><stop offset="0" stop-color="#3a0d18"/><stop offset="1" stop-color="#6e1f25"/></linearGradient></defs><path d="M250 85 Q300 50 390 78 Q410 85 390 92 Q300 120 250 85 Z" fill="url(#sq)"/><path d="M392 85 L414 70 L410 85 L414 100 Z" fill="#6e1f25"/>${[-22, -14, -6, 2, 10, 18].map((o, i) => `<path d="M252 ${85 + o * 0.2} Q ${190 - i * 6} ${85 + o * 1.4} ${120 - i * 10} ${85 + o * 2.2}" stroke="#5a1720" stroke-width="${5 - i * 0.4}" fill="none" stroke-linecap="round"/>`).join('')}<path d="M252 84 Q140 70 20 40" stroke="#5a1720" stroke-width="2.4" fill="none"/><path d="M252 88 Q150 110 30 128" stroke="#5a1720" stroke-width="2.4" fill="none"/><ellipse cx="18" cy="40" rx="10" ry="5" fill="#5a1720"/><ellipse cx="28" cy="128" rx="10" ry="5" fill="#5a1720"/><circle cx="268" cy="80" r="11" fill="#f2e6c8"/><circle cx="266" cy="80" r="6" fill="#0a0506"/></svg>`,
  siphon: () => { let s = '<svg width="560" height="150" viewBox="0 0 560 150"><defs>' + glow('sg', C) + '</defs><path d="M10 40 C 150 150, 300 0, 550 110" stroke="rgba(125,249,255,.35)" stroke-width="1.5" fill="none"/>'; for (let i = 0; i < 28; i++) { const t = i / 27; const x = 10 + t * 540, y = 40 + Math.sin(t * Math.PI * 1.3 + 0.4) * 38 + t * 40; s += `<circle cx="${x}" cy="${y}" r="${5 + (i % 3) * 2}" fill="url(#sg)" opacity="${0.5 + (i % 4) * 0.12}"/><circle cx="${x}" cy="${y}" r="${3 + (i % 3)}" fill="none" stroke="rgba(190,255,255,.6)" stroke-width="1"/>`; } return s + '</svg>'; },
  vampire: () => `<svg width="220" height="170" viewBox="0 0 220 170"><defs>${glow('vg', '#5ad7ff')}</defs><path d="M110 20 Q150 22 150 70 Q150 92 172 142 Q140 124 126 148 Q112 124 96 150 Q84 124 50 140 Q72 94 70 70 Q70 22 110 20 Z" fill="#2a0a14"/><path d="M78 36 Q60 22 58 40 M142 36 Q160 22 162 40" stroke="#2a0a14" stroke-width="8" stroke-linecap="round"/><circle cx="96" cy="64" r="9" fill="#c9372c"/><circle cx="124" cy="64" r="9" fill="#c9372c"/><circle cx="96" cy="64" r="4" fill="#120203"/><circle cx="124" cy="64" r="4" fill="#120203"/><circle cx="58" cy="44" r="10" fill="url(#vg)"/><circle cx="162" cy="44" r="10" fill="url(#vg)"/></svg>`,
  komsomolets: () => `<svg width="420" height="110" viewBox="0 0 420 110"><path d="M20 62 Q40 44 110 44 L330 44 Q392 46 404 62 Q392 78 330 80 L110 80 Q40 80 20 62 Z" fill="#06121f"/><path d="M190 44 L204 20 L262 20 L272 44 Z" fill="#06121f"/><path d="M404 62 L416 50 L416 74 Z" fill="#06121f"/><path d="M40 62 L380 62" stroke="rgba(125,249,255,.2)"/></svg>`,
  turtle: () => `<svg width="240" height="140" viewBox="0 0 240 140"><path d="M50 72 Q90 30 160 50 Q190 60 196 74 Q186 92 150 100 Q80 110 50 72 Z" fill="#081b2c"/><path d="M60 72 Q110 60 190 74 M70 84 Q120 78 180 86 M80 60 Q120 48 170 58" stroke="rgba(125,249,255,.25)" fill="none"/><path d="M196 72 Q216 64 226 72 Q216 82 196 78 Z" fill="#081b2c"/><path d="M120 54 Q100 12 60 8 Q88 32 104 58 Z" fill="#081b2c"/><path d="M120 96 Q108 128 76 132 Q98 112 108 94 Z" fill="#081b2c"/><circle cx="218" cy="70" r="2" fill="#bff"/></svg>`,
  angler: () => `<svg width="230" height="170" viewBox="0 0 230 170"><defs>${glow('ag', G)}</defs><path d="M60 100 Q60 50 120 52 Q172 56 176 100 Q172 140 120 142 Q72 142 60 100 Z" fill="#070c12"/><path d="M60 100 L24 80 L30 104 L20 128 Z" fill="#070c12"/><path d="M172 92 Q186 104 172 120 Q162 110 172 92 Z" fill="#010203"/>${[0, 1, 2, 3, 4, 5].map((i) => `<path d="M${170 + (i % 2) * 2} ${96 + i * 4} l6 2 l-6 2" fill="#dfe" opacity=".85"/>`).join('')}<path d="M130 56 Q150 10 196 24" stroke="#0b1520" stroke-width="3" fill="none"/><circle cx="198" cy="26" r="22" fill="url(#ag)"/><circle cx="198" cy="26" r="5" fill="#dfffee"/><circle cx="148" cy="84" r="4" fill="#9fe"/></svg>`,
  whale: () => `<svg width="460" height="170" viewBox="0 0 460 170"><g transform="rotate(20 230 85)"><path d="M40 80 Q40 44 110 42 L300 50 Q370 60 400 80 Q370 104 300 112 L110 118 Q40 116 40 80 Z" fill="#081725"/><path d="M398 80 L446 56 L432 82 L448 104 Z" fill="#081725"/><path d="M160 112 L134 150 L180 116 Z" fill="#081725"/><path d="M48 96 L140 100" stroke="rgba(125,249,255,.2)"/><circle cx="92" cy="74" r="2.4" fill="#bfe"/></g></svg>`,

    const top = Math.max(surfY, 0);
    for (let i = 0; i < 9; i++) {
      const x = W * (0.06 + i * 0.105) + Math.sin(now * 0.00025 + i * 2.3) * 50;
      const w0 = 26 + (i % 3) * 26, len = H * (0.8 + (i % 4) * 0.12);
      const sway = Math.sin(now * 0.0004 + i) * 0.02;
      // четыре вложенные полосы дают мягкий край
      for (let k = 1; k <= 4; k++) {
        const w = w0 * k / 2.2;
        const rg = ctx.createLinearGradient(0, top, 0, top + len);
        rg.addColorStop(0, `rgba(190,245,255,${0.028 * rayA})`); rg.addColorStop(0.55, `rgba(190,245,255,${0.012 * rayA})`); rg.addColorStop(1, 'rgba(190,245,255,0)');
        ctx.fillStyle = rg; ctx.beginPath();
        ctx.moveTo(x - w / 2, top); ctx.lineTo(x + w / 2, top);
        ctx.lineTo(x + w * 0.9 + len * (0.22 + sway), top + len); ctx.lineTo(x - w * 0.9 + len * (0.22 + sway), top + len); ctx.fill();
      }
    }
    ctx.restore();
  }
  // морской снег: частицы уходят вверх при погружении
  const dy = (y0 - lastScroll); lastScroll = y0;
  const deepK = clamp((dTop - 100) / 800, 0, 1);
  for (const s of snow) {
    s.y -= dy / H * s.z * 0.9;
    s.y += dt * 0.012 * s.z * (reduceMotion ? 0 : 1);
    s.x += Math.sin(now * 0.0004 + s.ph) * 0.00006;
    if (s.y < 0) s.y += 3; if (s.y > 3) s.y -= 3;
    if (s.y > 1) continue;
    const sy = s.y * H;
    if (sy < surfY + 10) continue;
    ctx.fillStyle = `rgba(220,240,255,${(0.1 + 0.35 * deepK) * s.z})`;
    ctx.fillRect(s.x * W, sy, 1.4 * s.z, 1.4 * s.z);
  }
  // вспышки биолюминесценции
  const bioK = clamp((dTop - 350) / 700, 0, 1);
  if (bioK > 0 && !reduceMotion && Math.random() < 0.08 * bioK) flashes.push({ x: Math.random() * W, y: Math.random() * H, t: 0, hue: Math.random() < 0.8 ? '89,255,208' : '125,200,255', r: 2 + Math.random() * 5, n: 1 + Math.floor(Math.random() * 5) });
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt; f.y -= dy;
    const a = Math.sin(Math.min(1, f.t / 1.6) * Math.PI);
    if (f.t > 1.6) { flashes.splice(i, 1); continue; }
    for (let k = 0; k < f.n; k++) {
      const xx = f.x + k * 9, yy = f.y + Math.sin(k) * 6;
      const gr = ctx.createRadialGradient(xx, yy, 0, xx, yy, f.r * 5);
      gr.addColorStop(0, `rgba(${f.hue},${0.8 * a})`); gr.addColorStop(1, `rgba(${f.hue},0)`);
      ctx.fillStyle = gr; ctx.fillRect(xx - f.r * 5, yy - f.r * 5, f.r * 10, f.r * 10);
    }
  }
  ctx.restore();
}
let ticking = false;
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  drawSea(now);
  updateGauge();
}
requestAnimationFrame(loop);
})();
</script>
