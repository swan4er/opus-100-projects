<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь пакета</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f2ea;
    --card: #fffdf8;
    --ink: #1d1c1a;
    --ink-2: #55524b;
    --ink-3: #6f6b62;
    --rule: #e3ddd0;
    --red: #d8443a;      /* домашняя линия */
    --purple: #7b4bb7;   /* DNS */
    --ring: #8a5a2b;     /* магистральное кольцо */
    --green: #2c9a58;    /* дата-центр */
    --tcp: #2f6fd1;
    --tls: #c99316;
    --http: #2c9a58;
    --ack: #8c877c;
    --drop: #d8443a;
    --sans: "Onest", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { overflow: hidden; }
  .app { height: 100vh; display: grid; grid-template-columns: 420px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }

  /* Левая колонка: рассказ */
  .story { grid-row: 1 / 3; background: var(--card); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 22px 28px 0; display: flex; align-items: center; gap: 12px; }
  .brand .m { width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: none; }
  .brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .brand span { display: block; font-size: 13px; color: var(--ink-3); }
  .chapter { padding: 20px 28px 0; overflow-y: auto; flex: 1; min-height: 0; }
  .num { font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .num i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .chapter h1 { font-size: 34px; line-height: 1.08; letter-spacing: -.025em; margin: 10px 0 14px; font-weight: 800; }
  .chapter p { font-size: 15.5px; line-height: 1.55; color: var(--ink-2); margin: 0 0 12px; }
  .chapter p b { color: var(--ink); font-weight: 600; }
  .widget { margin: 16px 0 6px; }

  .url { font-family: var(--mono); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; line-height: 1.6; word-break: break-all; }
  .url .s { color: #2a63bd; } .url .h { color: var(--purple); font-weight: 500; } .url .p { color: #1f7a45; } .url .q { color: #8f6400; }
  .parts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; margin-top: 10px; }
  .parts dt { color: var(--ink-3); } .parts dd { margin: 0; font-family: var(--mono); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .field label { font-size: 13px; color: var(--ink-3); }
  .field input { font: 500 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: #fff; color: var(--ink); outline: none; transition: border-color .2s; }
  .field input:focus { border-color: var(--purple); }
  .puny { font-family: var(--mono); font-size: 14px; color: var(--purple); padding: 2px 2px; word-break: break-all; }

  .row { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; min-height: 36px; font-size: 13.5px; color: var(--ink-2); }
  .row output { font-family: var(--mono); font-size: 13px; text-align: right; color: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--ink) var(--p, 50%), var(--rule) var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--rule); }
  input[type=range]::-moz-range-progress { height: 4px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  input[type=range]:focus-visible { outline: 2px solid var(--tcp); outline-offset: 2px; border-radius: 4px; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { appearance: none; border: 1px solid var(--rule); background: #fff; color: var(--ink); font: 600 14px var(--sans); padding: 10px 14px; min-height: 40px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .2s, border-color .2s, transform .15s; }
  .btn:hover { border-color: #cfc7b6; background: #fbf8f1; }
  .btn:active { transform: translateY(1px); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.dark:hover { background: #33312d; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn:focus-visible, .stop:focus-visible { outline: 2px solid var(--tcp); outline-offset: 2px; }

  /* Журнал */
  .log { border-top: 1px solid var(--rule); padding: 12px 28px 16px; background: #fbf9f3; }
  .log h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  .log h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .log ol { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; height: 150px; overflow: hidden; display: flex; flex-direction: column-reverse; }
  .log li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; color: var(--ink-2); animation: in .35s ease both; }
  .log li time { color: var(--ink-3); text-align: right; }
  .log li i { font-style: normal; font-weight: 500; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  /* Карта */
  .mapbox { position: relative; min-width: 0; min-height: 0; }
  svg#map { width: 100%; height: 100%; display: block; }
  .station-label { font: 600 15px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }
  .station-sub { font: 400 12px var(--mono); fill: var(--ink-3); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
  .line-name { font: 700 13px var(--sans); fill: #fff; }
  .chart { position: absolute; right: 22px; bottom: 18px; width: min(520px, calc(100% - 44px)); background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px 10px; box-shadow: 0 12px 30px rgba(40, 30, 10, .08); display: none; }
  .chart.on { display: block; }
  .chart h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 12px; }
  .chart h3 b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
  .chart canvas { width: 100%; height: 170px; display: block; }

  /* Нижняя навигация — ветка метро */
  .route { grid-column: 2; border-top: 1px solid var(--rule); background: var(--card); padding: 12px 26px 14px; display: flex; align-items: center; gap: 16px; }
  .stops { position: relative; flex: 1; display: flex; justify-content: space-between; align-items: flex-start; }
  .stops::before { content: ""; position: absolute; left: 14px; right: 14px; top: 11px; height: 6px; border-radius: 6px; background: var(--rule); }
  .stops .fill { position: absolute; left: 14px; top: 11px; height: 6px; border-radius: 6px; background: var(--ink); transition: width .5s cubic-bezier(.3, .7, .3, 1); }
  .stop { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; min-width: 56px; font: 500 12.5px var(--sans); color: var(--ink-3); }
  .stop i { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 5px solid var(--rule); transition: border-color .3s, transform .3s; }
  .stop.done i { border-color: var(--ink); }
  .stop[aria-current=true] { color: var(--ink); font-weight: 700; }
  .stop[aria-current=true] i { border-color: var(--ink); transform: scale(1.18); }
  .navbtns { display: flex; gap: 8px; }
  .round { width: 42px; height: 42px; padding: 0; justify-content: center; }

  @media (max-width: 1000px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
    .story { grid-row: 3; border-right: 0; border-top: 1px solid var(--rule); }
    .mapbox { grid-row: 1; height: 58vh; min-height: 330px; }
    .route { grid-column: 1; grid-row: 2; padding: 10px 12px; }
    .stop { min-width: 0; font-size: 0; }
    .stop[aria-current=true] { font-size: 12px; }
    .stop i { width: 22px; height: 22px; border-width: 4px; }
    .stops::before, .stops .fill { top: 8px; height: 5px; }
    .chart { position: static; width: auto; margin: 0 12px 12px; }
    .chapter { padding: 18px 18px 0; }
    .brand, .log { padding-left: 18px; padding-right: 18px; }
    .chapter h1 { font-size: 28px; }
    .log ol { height: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01s !important; animation-duration: .01s !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="story">
    <div class="brand"><div class="m" aria-hidden="true">П</div><div><b>Путь пакета</b><span>что происходит после Enter</span></div></div>
    <div class="chapter" id="chapter" aria-live="polite"></div>
    <div class="log">
      <h2>Журнал <span>модельные задержки</span></h2>
      <ol id="log"></ol>
    </div>
  </section>
  <div class="mapbox">
    <svg id="map" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Схема сети в стиле карты метро"></svg>
    <div class="chart" id="chart">
      <h3><span>Окно перегрузки TCP, сегментов</span><span>скорость ≈ <b id="thr">—</b></span></h3>
      <canvas id="cw" width="1040" height="340"></canvas>
    </div>
  </div>
  <nav class="route">
    <div class="navbtns">
      <button class="btn round" id="prev" aria-label="Предыдущая глава"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
    </div>
    <div class="stops" id="stops"><div class="fill" id="fill"></div></div>
    <div class="navbtns">
      <button class="btn round dark" id="next" aria-label="Следующая глава"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    </div>
  </nav>
</div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ─────────────────────────────────────────────────────────────
// Punycode (RFC 3492): кириллические домены в DNS путешествуют латиницей
// ─────────────────────────────────────────────────────────────
function punyLabel(input) {
  const base = 36, tMin = 1, tMax = 26, skew = 38, damp = 700;
  const cps = Array.from(input).map((c) => c.codePointAt(0));
  let n = 128, delta = 0, bias = 72;
  const out = cps.filter((c) => c < 0x80).map((c) => String.fromCharCode(c));
  let h = out.length; const b = h;
  if (b > 0) out.push('-');
  const adapt = (d, num, first) => { d = first ? Math.floor(d / damp) : d >> 1; d += Math.floor(d / num); let k = 0; while (d > ((base - tMin) * tMax) >> 1) { d = Math.floor(d / (base - tMin)); k += base; } return k + Math.floor(((base - tMin + 1) * d) / (d + skew)); };
  const digit = (d) => String.fromCharCode(d + 22 + 75 * (d < 26));
  while (h < cps.length) {
    let m = Infinity; for (const c of cps) if (c >= n && c < m) m = c;
    delta += (m - n) * (h + 1); n = m;
    for (const c of cps) {
      if (c < n) delta++;
      if (c === n) {
        let q = delta;
        for (let k = base; ; k += base) { const t = k <= bias ? tMin : k >= bias + tMax ? tMax : k - bias; if (q < t) break; out.push(digit(t + ((q - t) % (base - t)))); q = Math.floor((q - t) / (base - t)); }
        out.push(digit(q)); bias = adapt(delta, h + 1, h === b); delta = 0; h++;
      }
    }
    delta++; n++;
  }
  return out.join('');
}
const toAscii = (dom) => dom.trim().toLowerCase().split('.').map((l) => (!l || /^[\x00-\x7f]*$/.test(l) ? l : 'xn--' + punyLabel(l))).join('.');

// ─────────────────────────────────────────────────────────────
// Схема «метро»
// ─────────────────────────────────────────────────────────────
const RC = { x: 790, y: 500, r: 215 };               // магистральное кольцо
const ring = (deg) => [RC.x + RC.r * Math.cos(deg * Math.PI / 180), RC.y - RC.r * Math.sin(deg * Math.PI / 180)];
const ST = {
  laptop: { p: [90, 620], name: 'Ноутбук', sub: '192.168.1.23', side: 'below' },
  wifi: { p: [225, 620], name: 'Роутер Wi‑Fi', sub: '192.168.1.1', side: 'below' },
  isp: { p: [360, 620], name: 'Провайдер', sub: 'шлюз 100.64.0.1', side: 'below', hub: true },
  resolver: { p: [360, 470], name: 'Резолвер DNS', sub: 'у провайдера', side: 'left' },
  root: { p: [360, 310], name: 'Корневые «.»', sub: 'anycast', side: 'left' },
  tld: { p: [440, 230], name: 'Зона .рф', sub: 'xn--p1ai', side: 'above' },
  auth: { p: [640, 230], name: 'DNS пример.рф', sub: 'ns1.пример.рф', side: 'above' },
  ix: { p: ring(180), name: 'Точка обмена', sub: 'Москва', side: 'left', hub: true },
  spb: { p: ring(135), name: 'Санкт-Петербург', sub: '', side: 'left' },
  sto: { p: ring(90), name: 'Стокгольм', sub: '', side: 'above' },
  ams: { p: ring(45), name: 'Амстердам', sub: '', side: 'right' },
  fra: { p: ring(0), name: 'Франкфурт', sub: 'дата-центр', side: 'left', hub: true },
  waw: { p: ring(270), name: 'Варшава', sub: 'магистраль', side: 'below' },
  lb: { p: [1105, 500], name: 'Балансировщик', sub: '', side: 'above' },
  web: { p: [1150, 640], name: 'Веб-сервер', sub: '203.0.113.42', side: 'leftlow' },
};
// Маршруты — ломаные по линиям схемы
const arc = (a0, a1, step) => { const pts = []; const s = a1 > a0 ? step : -step; for (let a = a0; s > 0 ? a <= a1 + 1e-6 : a >= a1 - 1e-6; a += s) pts.push(ring(a)); return pts; };
const P = (k) => ST[k].p;
const ROUTES = {
  toIsp: [P('laptop'), P('wifi'), P('isp')],
  ispToResolver: [P('isp'), P('resolver')],
  resolverToRoot: [P('resolver'), P('root')],
  resolverToTld: [P('resolver'), P('root'), [360, 310], P('tld')],
  resolverToAuth: [P('resolver'), P('root'), P('tld'), P('auth')],
  main: [P('laptop'), P('wifi'), P('isp'), [455, 620], P('ix'), ...arc(180, 270, 5).slice(1), ...arc(270, 360, 5).slice(1), P('lb'), [1150, 545], P('web')],
};
ROUTES.clientToResolver = [...ROUTES.toIsp, P('resolver')];

const svg = $('map');
function el(name, attrs, parent = svg) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const dPath = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');

function drawMap() {
  // бумага и сетка
  const defs = el('defs', {});
  const pat = el('pattern', { id: 'grid', width: 40, height: 40, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M40 0H0V40', fill: 'none', stroke: '#e9e3d6', 'stroke-width': 1 }, pat);
  el('rect', { x: 0, y: 0, width: 1200, height: 780, fill: 'url(#grid)' });
  // линии
  const L = (pts, color, w = 11) => el('path', { d: dPath(pts), fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  el('circle', { cx: RC.x, cy: RC.y, r: RC.r, fill: 'none', stroke: 'var(--ring)', 'stroke-width': 11 });
  L([P('laptop'), P('wifi'), P('isp'), [455, 620], P('ix')], 'var(--red)');
  L([P('isp'), P('resolver'), P('root'), [360, 310], P('tld'), P('auth')], 'var(--purple)');
  L([P('fra'), P('lb'), [1150, 545], P('web')], 'var(--green)');
  // значки линий
  const badge = (x, y, color, t) => { el('circle', { cx: x, cy: y, r: 13, fill: color }); const tx = el('text', { x, y: y + 4.5, 'text-anchor': 'middle', class: 'line-name' }); tx.textContent = t; };
  badge(50, 620, '#c2362d', '1'); badge(684, 230, 'var(--purple)', '2'); badge(RC.x, RC.y, 'var(--ring)', '5'); badge(1150, 700, '#1f7a45', '7');
  const cap = el('text', { x: RC.x, y: RC.y + 32, 'text-anchor': 'middle', class: 'station-sub' }); cap.textContent = 'магистральное кольцо';
  // станции
  for (const [key, s] of Object.entries(ST)) {
    const [x, y] = s.p;
    const g = el('g', { id: 'st-' + key });
    if (s.hub) el('circle', { cx: x, cy: y, r: 14, fill: '#fff', stroke: 'var(--ink)', 'stroke-width': 4 }, g);
    else el('circle', { cx: x, cy: y, r: 9, fill: '#fff', stroke: 'var(--ink)', 'stroke-width': 3.5 }, g);
    const pos = { below: [0, 36, 'middle'], above: [0, -26, 'middle'], left: [-24, 5, 'end'], right: [24, 5, 'start'], rightup: [22, -22, 'start'], leftlow: [-22, 30, 'end'] }[s.side];
    // у подписей над станцией вторая строка идёт выше названия, чтобы не наезжать на кружок
    const up = s.side === 'above' && s.sub;
    const t = el('text', { x: x + pos[0], y: y + pos[1] - (up ? 17 : 0), 'text-anchor': pos[2], class: 'station-label' }, g);
    t.textContent = s.name;
    if (s.sub) { const u = el('text', { x: x + pos[0], y: y + pos[1] + (up ? 0 : 17), 'text-anchor': pos[2], class: 'station-sub' }, g); u.textContent = s.sub; }
  }
  // очередь маршрутизатора (для главы о потерях)
  const q = el('g', { id: 'queue', opacity: 0 });
  const [qx, qy] = P('waw');
  el('rect', { x: qx + 26, y: qy - 46, width: 84, height: 18, rx: 4, fill: '#fff', stroke: 'var(--ink)', 'stroke-width': 1.5 }, q);
  el('rect', { id: 'qfill', x: qx + 28, y: qy - 44, width: 0, height: 14, rx: 3, fill: 'var(--drop)' }, q);
  const ql = el('text', { x: qx + 26, y: qy - 54, class: 'station-sub' }, q); ql.textContent = 'очередь маршрутизатора';
  svg.appendChild(trainLayer);
}
const trainLayer = document.createElementNS(NS, 'g');

// ─────────────────────────────────────────────────────────────
// Поезда-пакеты
// ─────────────────────────────────────────────────────────────
// цвета «поездов» темнее линий: белая подпись должна читаться (контраст ≥ 4,5)
const KIND = { dns: '#7b4bb7', tcp: '#2a63bd', tls: '#8f6400', http: '#1f7a45', ack: '#6d685f', drop: '#b8322a', icmp: '#9a3f73' };
let trains = [];
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function pointAt(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0);
    if (d <= L || i === pts.length - 1) { const u = L ? Math.min(1, d / L) : 0; return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, Math.atan2(y1 - y0, x1 - x0)]; }
    d -= L;
  }
  return pts[pts.length - 1];
}
// Запустить поезд. Возвращает промис, который выполнится по прибытии.
function train(route, { label = '', kind = 'tcp', dir = 1, dur = 1800, stopAt = 1, onArrive, drop = false } = {}) {
  const pts = dir > 0 ? route : route.slice().reverse();
  const g = document.createElementNS(NS, 'g');
  const w = Math.max(34, label.length * 7.4 + 16);
  const rect = document.createElementNS(NS, 'rect');
  Object.entries({ x: -w / 2, y: -11, width: w, height: 22, rx: 11, fill: KIND[kind], stroke: '#fff', 'stroke-width': 2.5 }).forEach(([k, v]) => rect.setAttribute(k, v));

    const [x, y] = pointAt(t.pts, e * t.L);
    t.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);

// ─────────────────────────────────────────────────────────────
// Модель окна перегрузки (Reno): медленный старт, AIMD, деление пополам при потере
// ─────────────────────────────────────────────────────────────
const cw = {
  hist: [], w: 1, ss: 32, acc: 0, frames: 0,
  reset() { this.hist = []; this.w = 1; this.ss = 32; this.acc = 0; this.frames = 0; },
  step(p) {
    // один шаг анимации = один RTT
    if (++this.frames % 3) return;
    let lost = false;
    for (let i = 0; i < Math.round(this.w); i++) if (Math.random() < p) { lost = true; break; }
    if (lost) { this.ss = Math.max(2, this.w / 2); this.w = this.ss; }
    else if (this.w < this.ss) this.w = Math.min(this.w * 2, this.ss + 0.001);
    else this.w += 1;
    this.w = Math.min(this.w, 400);
    this.hist.push({ w: this.w, lost });
    if (this.hist.length > 160) this.hist.shift();
    const mss = 1460 * 8;
    const bps = (this.w * mss) / (net.rtt / 1000);
    $('thr').textContent = bps > 1e6 ? `${(bps / 1e6).toFixed(1).replace('.', ',')} Мбит/с` : `${Math.round(bps / 1e3)} кбит/с`;
  },
  draw() {
    const c = $('cw'), g = c.getContext('2d');
    const W = c.width, H = c.height;
    g.clearRect(0, 0, W, H);
    const max = Math.max(40, ...this.hist.map((h) => h.w)) * 1.1;
    g.strokeStyle = '#e3ddd0'; g.lineWidth = 1; g.font = '20px JetBrains Mono, monospace'; g.fillStyle = '#6f6b62';
    for (let v = 0; v <= max; v += max > 200 ? 100 : max > 80 ? 40 : 20) { const y = H - 20 - (v / max) * (H - 40); g.beginPath(); g.moveTo(50, y); g.lineTo(W, y); g.stroke(); g.fillText(String(v), 0, y + 7); }
    g.beginPath(); g.lineWidth = 4; g.strokeStyle = '#1d1c1a'; g.lineJoin = 'round';
    this.hist.forEach((h, i) => { const x = 50 + (i / 159) * (W - 60), y = H - 20 - (h.w / max) * (H - 40); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    g.fillStyle = '#d8443a';
    this.hist.forEach((h, i) => { if (!h.lost) return; const x = 50 + (i / 159) * (W - 60), y = H - 20 - (h.w / max) * (H - 40); g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill(); });
    const ssY = H - 20 - (this.ss / max) * (H - 40);
    g.setLineDash([8, 8]); g.strokeStyle = '#c99316'; g.lineWidth = 2; g.beginPath(); g.moveTo(50, ssY); g.lineTo(W, ssY); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#c99316'; g.fillText('порог', W - 80, ssY - 8);
  },
};

// ─────────────────────────────────────────────────────────────
// Навигация
// ─────────────────────────────────────────────────────────────
let cur = 0;
const stops = $('stops');
CHAPTERS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'stop'; b.innerHTML = `<i></i>${c.stop}`;
  b.setAttribute('aria-label', `Глава ${i + 1}: ${c.stop}`);
  b.addEventListener('click', () => startChapter(i));
  stops.appendChild(b);
});
function startChapter(i) {
  if (CHAPTERS[cur] && CHAPTERS[cur].leave) CHAPTERS[cur].leave();
  cur = Math.max(0, Math.min(CHAPTERS.length - 1, i));
  const id = ++run;
  trains.forEach((t) => { t.g.remove(); t.resolve(); });
  trains = [];
  const c = CHAPTERS[cur];
  $('chapter').innerHTML = `<div class="num"><i style="background:${c.color}"></i>Глава ${cur + 1} из ${CHAPTERS.length}</div><h1>${c.title}</h1>${c.html}`;
  [...stops.querySelectorAll('.stop')].forEach((b, j) => { b.setAttribute('aria-current', String(j === cur)); b.classList.toggle('done', j < cur); });
  updateFill();
  $('prev').disabled = cur === 0; $('next').disabled = cur === CHAPTERS.length - 1;
  $('log').innerHTML = '';
  c.play(id);
}
$('prev').addEventListener('click', () => startChapter(cur - 1));
$('next').addEventListener('click', () => startChapter(cur + 1));
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') startChapter(cur + 1);
  if (e.key === 'ArrowLeft') startChapter(cur - 1);
});
function updateFill() {
  const all = stops.querySelectorAll('.stop');
  const span = all[all.length - 1].offsetLeft - all[0].offsetLeft;
  $('fill').style.width = (span * cur) / (CHAPTERS.length - 1) + 'px';
}
addEventListener('resize', updateFill);

function frame(now) { tickTrains(now); requestAnimationFrame(frame); }
drawMap();
requestAnimationFrame(frame);
// с первого кадра — живая глава про DNS: по схеме уже бегут поезда
startChapter(1);
})();
</script>
