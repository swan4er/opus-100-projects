<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игра, которая пишет себя</title>
<meta name="description" content="Опишите игру одной фразой — нейросеть напишет её, запустит в песочнице, сама починит ошибки и поменяет игру по словам.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect x="4" y="3" width="24" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M9 3v6h14V3" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M10 16l4 3-4 3" fill="none" stroke="#ff6b3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="16" y="21" width="7" height="2.4" rx="1" fill="#ff6b3d"/>
    </svg>
    <span>Игра, которая <em>пишет себя</em><i class="logo-caret" aria-hidden="true"></i></span>
  </h1>
  <div class="top-tools">
    <div class="demo-badge" id="demo-badge" hidden>
      <span>демо-режим — нейросеть не&nbsp;подключена</span>
      <button type="button" id="connect">Подключить</button>
    </div>
    <div class="models" id="models" role="radiogroup" aria-label="Модель DeepSeek"></div>
    <span class="cost" id="cost" aria-label="Потрачено на нейросеть">$0.0000</span>
    <button type="button" class="icon-btn" id="sound" aria-label="Звук" aria-pressed="true">
      <svg class="i-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="stage-col" aria-label="Игра">
    <form class="ask" id="ask" autocomplete="off">
      <label for="phrase" class="ask-label">Опишите игру одной фразой</label>
      <div class="ask-row">
        <input id="phrase" class="ask-input" maxlength="200" spellcheck="false" placeholder="например: змейка, но на льду">
        <button class="go" id="go" type="submit"><span>Написать игру</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="ideas" id="ideas" aria-label="Идеи">
        <button type="button" data-idea="танк в лабиринте стреляет рикошетом">танк и рикошет</button>
        <button type="button" data-idea="пчела собирает мёд, а осы охотятся за ней">пчела и осы</button>
        <button type="button" data-idea="гонка улиток под дождём, лужи замедляют">гонка улиток</button>
        <button type="button" data-idea="пингвин скатывается с горы и уворачивается от ёлок">пингвин с горы</button>
        <button type="button" data-idea="змейка, но на льду">змейка на льду</button>
      </div>
    </form>

    <div class="screen" id="screen">
      <div class="screen-bar">
        <div class="now"><b id="game-title">Картридж пуст</b><span id="game-controls"></span></div>
        <div class="versions" id="versions" aria-label="Версии"></div>
        <button type="button" class="icon-btn" id="restart" title="Заново" aria-label="Начать заново">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 11-2.4-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon-btn" id="fullscreen" title="На весь экран" aria-label="На весь экран">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="frame-box" id="frame-box">
        <div class="overlay" id="overlay" hidden>
          <p class="ov-phrase" id="ov-phrase"></p>
          <ol class="ov-steps" id="ov-steps">
            <li data-step="think">думает</li><li data-step="write">пишет</li><li data-step="test">проверяет</li><li data-step="play">играем</li>
          </ol>
          <div class="ov-bar" aria-hidden="true"></div>
          <p class="ov-status" id="ov-status" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <div class="pad" id="pad" hidden aria-label="Экранные кнопки">
      <div class="pad-cross">
        <button type="button" data-code="ArrowUp" class="pb pb-up" aria-label="Вверх"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-code="ArrowLeft" class="pb pb-left" aria-label="Влево"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-code="ArrowRight" class="pb pb-right" aria-label="Вправо"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" data-code="ArrowDown" class="pb pb-down" aria-label="Вниз"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="pad-acts">
        <button type="button" data-code="KeyX" class="pb pb-b" aria-label="Кнопка X">X</button>
        <button type="button" data-code="Space" class="pb pb-a" aria-label="Прыжок или выстрел">●</button>
      </div>
    </div>

    <form class="edit" id="edit" autocomplete="off">
      <label for="edit-input" class="sr">Правка словами</label>
      <div class="edit-row">
        <input id="edit-input" class="edit-input" maxlength="200" spellcheck="false" placeholder="Правка словами: «сделай врагов быстрее»">
        <button class="edit-go" id="edit-go" type="submit">Поправить</button>
      </div>
      <div class="ideas" id="edit-ideas" aria-label="Примеры правок">
        <button type="button" data-idea="сделай врагов быстрее">врагов быстрее</button>
        <button type="button" data-idea="добавь босса, который появляется каждые 30 секунд">добавь босса</button>
        <button type="button" data-idea="пусть будет ночь со звёздами и фонарями">пусть будет ночь</button>
        <button type="button" data-idea="добавь бонус, который на 5 секунд даёт неуязвимость">бонус-щит</button>
      </div>
    </form>
  </section>

  <aside class="side" aria-label="Процесс и код">
    <section class="log-box">
      <div class="side-head">
        <h2>Процесс</h2>
        <button type="button" class="stop" id="stop" hidden>Остановить</button>
      </div>
      <ol class="log" id="log" aria-live="polite"></ol>
    </section>
    <section class="code-box">
      <div class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="code" class="on" aria-selected="true">Код</button>
        <button type="button" role="tab" data-tab="gallery" aria-selected="false">Галерея</button>
        <span class="code-meta" id="code-meta"></span>
      </div>
      <div class="pane" id="pane-code">
        <div class="code" id="code" tabindex="0" aria-label="Код игры"></div>
        <div class="code-tools">
          <button type="button" id="copy">Копировать</button>
          <button type="button" id="download">Скачать игру .html</button>
        </div>
      </div>
      <div class="pane" id="pane-gallery" hidden><div class="gallery" id="gallery"></div></div>
    </section>
  </aside>
</main>

<script src="../_ai/ai.js"></script>
<script src="prompts.js"></script>
<script src="runtime.js"></script>
<script src="demos.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
