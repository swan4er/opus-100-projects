<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лисий дом — воксельный мультфильм</title>
<meta name="description" content="Воксельный мультфильм на three.js: лисица строит дом до первого снега. История, камера, музыка и шумы — всё кодом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#16110E;--bg2:#221A15;--cream:#F3E9DB;--mut:#A89A8B;--fox:#E8772E;--fox2:#F49A57;--ink:#1D1511;--line:rgba(243,233,219,.16);--fw:960px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#241B15 0%,var(--bg) 60%)}
button{font:inherit;color:inherit}
#top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:20px 32px 14px;max-width:calc(var(--fw) + 64px);margin:0 auto}
#top h1{margin:0;font:400 28px/1 'Yeseva One',Georgia,serif;letter-spacing:.01em}
#top .sub{margin:8px 0 0;font-size:13px;color:var(--mut);line-height:1.4}
#top .keys{font-size:12px;color:var(--mut);text-align:right;line-height:1.6}
#top .keys kbd{font:500 12px 'Golos Text',sans-serif;color:var(--cream);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:0 2px}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 32px}
#frame{position:relative;border-radius:10px;overflow:hidden;background:#0D0A08;box-shadow:0 28px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,240,220,.05);cursor:pointer;container-type:inline-size}
#cv{display:block;width:100%;height:100%}
#caps{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:6%;right:6%;text-align:center;color:#FFF7EC;opacity:0;will-change:opacity,transform}
.cap-title{top:24%;font:400 calc(var(--fw) * .066)/1 'Yeseva One',Georgia,serif;letter-spacing:.01em;text-shadow:0 3px 26px rgba(24,14,8,.55),0 1px 2px rgba(24,14,8,.4)}
.cap-sub{bottom:7.5%;font:500 calc(var(--fw) * .021)/1.35 'Golos Text',sans-serif;text-shadow:0 1px 3px rgba(10,6,4,.8),0 0 16px rgba(10,6,4,.6)}
.cap-end{top:40%;font:400 calc(var(--fw) * .05)/1 'Yeseva One',Georgia,serif;text-shadow:0 2px 20px rgba(0,0,0,.6)}
#load{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;background:radial-gradient(90% 90% at 50% 45%,#3A2A1E 0%,#150F0C 75%);transition:opacity .9s cubic-bezier(.2,.7,.2,1);text-align:center;padding:24px}
#load.gone{opacity:0;pointer-events:none}
#load .cubes{display:flex;gap:7px}
#load .cubes i{width:14px;height:14px;border-radius:3px;background:var(--fox);animation:hop 1.1s cubic-bezier(.4,0,.2,1) infinite}
#load .cubes i:nth-child(2){background:#F2C14E;animation-delay:.14s}
#load .cubes i:nth-child(3){background:#D8512A;animation-delay:.28s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
#loadText{margin:0;font-size:15px;line-height:1.5;color:#E7D8C4;max-width:30em}
#load.err .cubes i{animation:none;opacity:.5}
#bar{display:flex;align-items:center;gap:12px;width:var(--fw)}
.btn{height:44px;min-width:44px;border:0;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 18px;cursor:pointer;
  font-weight:600;font-size:14px;transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .2s,color .2s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible,.mark:focus-visible,#track:focus-visible,#chapters button:focus-visible{outline:2px solid var(--fox2);outline-offset:3px}
#bPlay{background:var(--cream);color:var(--ink);min-width:132px}
#bPlay .i-pause{display:none}
#bPlay.is-playing .i-pause{display:block}
#bPlay.is-playing .i-play{display:none}
#bSound{background:rgba(243,233,219,.09);color:var(--cream);box-shadow:inset 0 0 0 1px var(--line)}
#bSound.is-first{background:var(--fox);color:#23140B;box-shadow:none}
#bSound.is-on{color:var(--cream)}
#bSound .i-off{display:none}
#bSound:not(.is-on):not(.is-first) .i-off{display:block}
#bSound:not(.is-on):not(.is-first) .i-on{display:none}
#bSound:disabled{opacity:.45;cursor:default}
.ico{width:44px;padding:0;background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px}
.ico:hover{background:rgba(243,233,219,.07)}
#time{font:500 13px 'Golos Text',sans-serif;font-variant-numeric:tabular-nums;color:var(--mut);min-width:84px;text-align:center}
#tl{position:relative;flex:1;min-width:0;padding-bottom:22px;margin-bottom:-22px}
#track{position:relative;height:40px;cursor:pointer;touch-action:none;outline:none}
#track::before{content:'';position:absolute;left:0;right:0;top:18px;height:4px;border-radius:2px;background:rgba(243,233,219,.18)}
#fill{position:absolute;left:0;right:0;top:18px;height:4px;border-radius:2px;background:var(--fox);transform-origin:0 50%;transform:scaleX(0)}
#thumb{position:absolute;left:-7px;top:13px;width:14px;height:14px;border-radius:50%;background:var(--cream);box-shadow:0 2px 6px rgba(0,0,0,.4);transition:width .15s,height .15s}
#track:hover #thumb,#track.drag #thumb{box-shadow:0 0 0 5px rgba(243,233,219,.12),0 2px 6px rgba(0,0,0,.4)}
.tick{position:absolute;top:14px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:rgba(243,233,219,.35);pointer-events:none}
#hover{position:absolute;left:0;top:-22px;margin-left:-22px;width:44px;text-align:center;font-size:12px;color:var(--cream);opacity:0;transition:opacity .15s;pointer-events:none;font-variant-numeric:tabular-nums}
#track:hover #hover{opacity:1}
#marks{position:absolute;left:0;right:0;top:36px;height:22px}
.mark{position:absolute;top:0;transform:translateX(-1px);background:none;border:0;padding:2px 4px 2px 0;cursor:pointer;font-size:12px;color:var(--mut);white-space:nowrap;transition:color .2s}
.mark:first-child{transform:none}
.mark:last-child{transform:translateX(-1px)}
.mark:hover{color:var(--cream)}
.mark.on{color:var(--cream)}
.mark.on span{box-shadow:inset 0 -2px 0 var(--fox)}
#chapters{display:none}
body.is-full #stage{background:#000;justify-content:center;padding:0;height:100vh}
body.is-full #bar{position:fixed;left:0;right:0;bottom:0;width:auto;padding:28px 32px 26px;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,0));transition:opacity .4s}
body.is-full #stage.idle #bar{opacity:0}
body.is-full #frame{border-radius:0;box-shadow:none}
@media (max-width:760px){
  body{overflow-y:auto;overflow-x:hidden}
  #top{padding:16px 12px 12px;display:block}
  #top h1{font-size:26px}
  #top .keys{display:none}
  #stage{padding:0 12px 28px;gap:10px}
  #bar{width:100%;flex-wrap:wrap;gap:8px}
  #tl{order:-2;flex:1 1 calc(100% - 92px);padding-bottom:0;margin-bottom:0}
  #time{order:-1;flex:0 0 84px;min-width:0;font-size:12px;text-align:right}
  #marks{display:none}
  #bPlay{flex:none;width:44px;min-width:44px;padding:0}
  #lPlay{display:none}
  #bSound{flex:1;min-width:0;padding:0 14px}
  .ico{width:44px;flex:none}
  #chapters{display:block;list-style:none;margin:6px 0 0;padding:0;width:100%}
  #chapters li{border-top:1px solid var(--line)}
  #chapters button{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0 4px;cursor:pointer;text-align:left;font-size:15px}
  #chapters b{font:400 16px 'Yeseva One',serif;color:var(--mut);width:18px}
  #chapters span{flex:1}
  #chapters i{font-style:normal;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
  #chapters button.on{color:var(--fox2)}
  #chapters button.on b{color:var(--fox2)}
  p.about{display:block;margin:18px 4px 0;font-size:14px;line-height:1.55;color:var(--mut)}
}
.about{display:none}
body.offline #bar{opacity:.4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}#load .cubes i{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header id="top">
  <div>
    <h1>Лисий дом</h1>
    <p class="sub">113 · воксельный мультфильм · 1:44 · лисица строит дом до&nbsp;первого снега</p>
  </div>
  <div class="keys"><kbd>Пробел</kbd> пауза&nbsp;&nbsp;<kbd>←</kbd><kbd>→</kbd> 5&nbsp;секунд&nbsp;&nbsp;<kbd>F</kbd> экран</div>
</header>
<main id="stage">
  <div id="frame" role="img" aria-label="Кадр мультфильма «Лисий дом»">
    <canvas id="cv"></canvas>
    <div id="caps" aria-live="off"></div>
    <div id="load"><div class="cubes"><i></i><i></i><i></i></div><p id="loadText">Собираем лес из кубиков…</p></div>
  </div>
  <div id="bar">
    <button class="btn" id="bPlay" type="button" aria-label="Смотреть">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>
      <span id="lPlay">Смотреть</span>
    </button>
    <button class="btn is-first" id="bSound" type="button" aria-pressed="false">
      <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      <span id="lSound">Смотреть со звуком</span>
    </button>
    <div id="tl">
      <div id="track" tabindex="0" role="slider" aria-label="Время фильма" aria-valuemin="0" aria-valuemax="104" aria-valuenow="0">
        <div id="fill"></div><div id="thumb"></div><div id="hover">0:00</div>
      </div>
      <div id="marks"></div>
    </div>
    <span id="time">0:00 / 1:44</span>
    <button class="btn ico" id="bReplay" type="button" aria-label="Смотреть сначала">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
    <button class="btn ico" id="bFull" type="button" aria-label="Во весь экран">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></svg>
    </button>
  </div>
  <ol id="chapters" aria-label="Сцены"></ol>
  <p class="about">Осень. Лисица просыпается в&nbsp;куче листьев и&nbsp;видит: скоро снег, а&nbsp;дома нет. Брёвна, крыша, ветер — и&nbsp;успеет ли она до&nbsp;первого снега?</p>
</main>
<script src="story.js"></script>
<script src="world.js"></script>
<script src="fox.js"></script>
<script src="script.js"></script>
<script src="film.js"></script>
<script src="audio.js"></script>
<script src="player.js"></script>
<script>
  // Без сети three.js не загрузится — говорим об этом прямо
  function foxOffline() {
    if (window.__foxReady) return;
    var l = document.getElementById('load');
    l.classList.add('err');
    document.body.classList.add('offline');
    document.getElementById('loadText').innerHTML = 'Для мультфильма нужен интернет: трёхмерный движок three.js загружается из&nbsp;сети (jsDelivr). Подключитесь и&nbsp;обновите страницу.';
  }
  setTimeout(foxOffline, 14000);
</script>
<script type="module" onerror="foxOffline()">
import * as THREE from 'three';
window.FoxPlayer.start(THREE);
</script>
</body>
</html>
