<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Апериодическая мозаика</title>
<meta name="description" content="Мозаика Пенроуза с бесконечным зумом, мультисетка де Брёйна и «шляпа» 2023 года — порядок без повторения.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0e14;
    --panel: rgba(13, 15, 21, .9);
    --gold: #d8b766;
    --gold-soft: rgba(216, 183, 102, .38);
    --gold-line: rgba(216, 183, 102, .22);
    --text: #f1eadb;
    --muted: #b9ae95;
    --display: "Prata", "Playfair Display", Georgia, serif;
    --ui: "Manrope", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }

  .card { background: var(--panel); border: 1px solid var(--gold-line); border-radius: 2px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }

  .title { position: fixed; left: 28px; top: 28px; width: 380px; padding: 22px 24px 20px; }
  .kicker { font: 600 12px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 12px 0 12px; font: 400 36px/1.08 var(--display); letter-spacing: -.005em; }
  .lede { margin: 0; font: 400 15px/1.5 var(--ui); color: #d9d0bd; }
  .lede b { color: var(--text); font-weight: 600; }

  .modes { position: fixed; top: 28px; right: 28px; display: flex; padding: 5px; gap: 4px; }
  .modes button { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 14px 0 11px; border: 1px solid transparent; background: transparent; color: var(--muted); font: 600 14px/1 var(--ui); border-radius: 2px; cursor: pointer; transition: color .2s, background .2s, border-color .2s; }
  .modes button svg { width: 20px; height: 20px; flex: none; }
  .modes button:hover { color: var(--text); }
  .modes button[aria-selected=true] { color: #17130b; background: var(--gold); }

  .info { position: fixed; left: 28px; bottom: 28px; width: 380px; padding: 18px 24px 18px; }
  .info h2 { margin: 0 0 10px; font: 400 21px/1.2 var(--display); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0; }
  .stats div { border-top: 1px solid var(--gold-line); padding-top: 8px; }
  .stats dt { font: 600 12px/1.2 var(--ui); color: var(--muted); letter-spacing: .02em; }
  .stats dd { margin: 4px 0 0; font: 400 22px/1.1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .stats dd small { font: 500 12px/1 var(--ui); color: var(--muted); margin-left: 4px; }
  .fact { margin: 14px 0 0; font: 400 13.5px/1.5 var(--ui); color: #d9d0bd; }

  .controls { position: fixed; right: 28px; bottom: 28px; width: 300px; padding: 16px 18px 18px; }
  .group + .group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--gold-line); }
  .glabel { font: 600 12px/1 var(--ui); color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .glabel span:last-child { color: var(--text); font-weight: 500; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch { height: 44px; border: 1px solid var(--gold-line); border-radius: 2px; padding: 0; cursor: pointer; overflow: hidden; display: grid; grid-template-columns: repeat(4, 1fr); transition: border-color .2s, transform .2s cubic-bezier(.2, .8, .2, 1); }
  .swatch i { display: block; }
  .swatch:hover { transform: translateY(-2px); }
  .swatch[aria-pressed=true] { border-color: var(--gold); outline: 1px solid var(--gold); outline-offset: 2px; }
  .chips { display: flex; gap: 6px; }
  .chip { flex: 1; min-height: 40px; border: 1px solid var(--gold-line); background: transparent; color: var(--text); font: 600 14px/1 var(--ui); border-radius: 2px; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
  .chip:hover { border-color: var(--gold-soft); }
  .chip[aria-pressed=true] { background: rgba(216, 183, 102, .14); border-color: var(--gold); color: #fff5dc; }
  .row { display: flex; gap: 6px; }
  .row .chip { flex: 1 1 auto; }
  .zoom { flex: 0 0 44px !important; font-size: 20px; font-weight: 500; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .hint { margin-top: 12px; font: 500 12px/1.45 var(--ui); color: var(--muted); }
  .mg-only { display: none; }
  body.mode-multigrid .mg-only { display: block; }

  .toast { position: fixed; left: 50%; top: 28px; transform: translate(-50%, -8px); padding: 10px 16px; font: 600 13px/1 var(--ui); color: var(--text); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) {
    .title { width: 330px; }
    h1 { font-size: 30px; }
    .info { width: 330px; }
    .fact { display: none; }
  }
  @media (max-width: 760px) {
    .title { left: 12px; right: 12px; top: 12px; width: auto; padding: 14px 16px; }
    h1 { font-size: 24px; margin: 8px 0 6px; }
    .lede { font-size: 13.5px; line-height: 1.45; }
    .modes { top: auto; bottom: 214px; left: 12px; right: 12px; justify-content: stretch; }
    .modes button { flex: 1; justify-content: center; padding: 0 8px; font-size: 13px; }
    .modes button svg { display: none; }
    .info { left: 12px; right: auto; bottom: 12px; width: calc(50% - 16px); padding: 12px 14px; }
    .info h2 { font-size: 17px; margin-bottom: 6px; }
    .stats { grid-template-columns: 1fr; gap: 6px; }
    .stats div:nth-child(n+3) { display: none; }
    .stats dd { font-size: 18px; }
    .controls { right: 12px; bottom: 12px; width: calc(50% - 16px); padding: 12px 12px; }
    .swatches { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .swatch { height: 34px; }
    .controls .group:not(:first-child), .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .swatch, .toast { transition: none; } }

</head>
<body class="mode-penrose">
<canvas id="c" aria-label="Апериодическая мозаика"></canvas>

<header class="title card">
  <div class="kicker">Апериодические мозаики</div>
  <h1 id="h1">Порядок без&nbsp;повторения</h1>

</header>

<nav class="modes card" role="tablist" aria-label="Мозаика">
  <button role="tab" data-mode="penrose" aria-selected="true">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2l3.1 8L10 18 6.9 10z"/><path d="M13.1 10L19 7.2M6.9 10L1 12.8"/></svg>Пенроуз</button>
  <button role="tab" data-mode="multigrid" aria-selected="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 6h16M2 14h16M6 2l-2 16M14 2l2 16M3 3l14 14"/></svg>Мультисетка</button>
  <button role="tab" data-mode="hat" aria-selected="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12.6l-1.4-2.4 1.4-2.4h2.8l1.4-2.4h2.8l1.4 2.4 2.8 0 1.4 2.4-1.4 2.4h-2.8l-1.4 2.4-2.8 0v-2.4z"/></svg>Шляпа</button>
</nav>

<section class="info card" aria-live="polite">
  <h2 id="infoTitle"></h2>
  <dl class="stats" id="stats"></dl>
  <p class="fact" id="fact"></p>
</section>

<aside class="controls card" aria-label="Настройки">
  <div class="group">
    <div class="glabel"><span>Глазурь</span><span id="palName"></span></div>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="group mg-only">
    <div class="glabel"><span>Симметрия</span><span id="symName"></span></div>
    <div class="chips" id="sym"></div>
  </div>
  <div class="group">
    <div class="row">
      <button class="chip" id="tAuto" aria-pressed="true">Движение</button>
      <button class="chip" id="tHier" aria-pressed="false">Иерархия</button>
      <button class="chip zoom" id="zIn" aria-label="Приблизить">+</button>
      <button class="chip zoom" id="zOut" aria-label="Отдалить">−</button>
    </div>
    <div class="hint" id="hint">Колесо или щипок — зум, перетаскивание — сдвиг.</div>
  </div>
</aside>
<div class="toast card" id="toast"></div>

<script>
(() => {
'use strict';
const PHI = (1 + Math.sqrt(5)) / 2;
const $ = (id) => document.getElementById(id);
const fmt = (x, d) => x.toFixed(d).replace('.', ',');
const fmtInt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

// ───────────────────────── Палитры глазури ─────────────────────────
// cls: цвета классов плиток; seam: золото швов; deep: цвет за пределами мозаики
const PALETTES = [
  { name: 'Гжель', seam: '#d6b25e', deep: '#0b1530', cls: ['#f2efe6', '#2346a3', '#5d7fd1', '#aabfeb', '#142a6e', '#e7e0cf'] },
  { name: 'Изник', seam: '#dcb865', deep: '#0e1d2b', cls: ['#f0e5cc', '#1d9a94', '#1c3f94', '#c63a2f', '#6f9c6c', '#123a5a'] },
  { name: 'Изразец', seam: '#c9a14c', deep: '#1a140d', cls: ['#eadfc5', '#2f6b4a', '#c58a2b', '#7a3e24', '#3d5a80', '#e0c68c'] },
  { name: 'Кинцуги', seam: '#ecc664', deep: '#0b0b0d', cls: ['#2b2c31', '#3a3d45', '#1f3c40', '#43332d', '#4c515d', '#26262c'] },
];
let pal = PALETTES[0];

// Вариация тона плитки — «ручная» керамика
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r * k)); g = Math.max(0, Math.min(255, g * k)); b = Math.max(0, Math.min(255, b * k));
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

// ───────────────────────── Пенроуз P3: треугольники Робинсона ─────────────────────────
// c = 0 — острый (36°, половинка тонкого ромба), c = 1 — тупой (108°, половинка толстого)
const WHEEL = [];
for (let i = 0; i < 10; i++) {
  let b = [Math.cos((2 * i - 1) * Math.PI / 10), Math.sin((2 * i - 1) * Math.PI / 10)];
  let c = [Math.cos((2 * i + 1) * Math.PI / 10), Math.sin((2 * i + 1) * Math.PI / 10)];
  if (i % 2 === 0) [b, c] = [c, b];
  WHEEL.push([0, 0, 0, b[0], b[1], c[0], c[1]]);
}
function subdivide(t, out) {
  const [c, ax, ay, bx, by, cx, cy] = t;
  if (c === 0) {
    const px = ax + (bx - ax) / PHI, py = ay + (by - ay) / PHI;
    out.push([0, cx, cy, px, py, bx, by], [1, px, py, cx, cy, ax, ay]);
  } else {
    const qx = bx + (ax - bx) / PHI, qy = by + (ay - by) / PHI, rx = bx + (cx - bx) / PHI, ry = by + (cy - by) / PHI;
    out.push([1, rx, ry, cx, cy, ax, ay], [1, qx, qy, rx, ry, bx, by], [0, rx, ry, qx, qy, ax, ay]);
  }
}
const triHits = (t, R) => {
  const x0 = Math.min(t[1], t[3], t[5]), x1 = Math.max(t[1], t[3], t[5]), y0 = Math.min(t[2], t[4], t[6]), y1 = Math.max(t[2], t[4], t[6]);
  return x1 >= R[0] && x0 <= R[2] && y1 >= R[1] && y0 <= R[3];
};
function collectP3(level, R, superLevel) {
  const tris = [], sup = [];
  const tmp = [];
  const rec = (t, k) => {
    if (!triHits(t, R)) return;
    if (k === superLevel) sup.push(t);
    if (k === level) { tris.push(t); return; }
    const kids = []; subdivide(t, kids);
    for (const ch of kids) rec(ch, k + 1);
  };
  for (const t of WHEEL) rec(t, 0);
  // склеиваем половинки через общее основание BC в целые ромбы
  const leg = Math.pow(PHI, -level), inv = 1e4 / leg, map = new Map(), rhombs = [];
  for (const t of tris) {
    const key = Math.round((t[3] + t[5]) * inv) + ',' + Math.round((t[4] + t[6]) * inv);
    const m = map.get(key);
    if (m) { map.delete(key); rhombs.push({ c: t[0], p: [m[1], m[2], t[3], t[4], t[1], t[2], t[5], t[6]] }); }
    else map.set(key, t);
  }
  for (const t of map.values()) rhombs.push({ c: t[0], p: [t[1], t[2], t[3], t[4], t[5], t[6]], half: true });
  return { rhombs, sup };
}

// ───────────────────────── Мультисетка де Брёйна ─────────────────────────
const SYMS = [
  { n: 5, fold: 10, name: 'Пенроуз' },
  { n: 7, fold: 14, name: 'семиугольная' },
  { n: 4, fold: 8, name: 'Амман — Бенкер' },
  { n: 6, fold: 12, name: 'двенадцатиугольная' },
];
function gridDirs(n) {
  const d = [];
  for (let j = 0; j < n; j++) { const a = (n % 2 ? 2 * Math.PI : Math.PI) * j / n; d.push([Math.cos(a), Math.sin(a)]); }
  return d;
}
function collectMultigrid(n, gam, R) {
  const E = gridDirs(n), f = 2 / n;
  const gx0 = R[0] * f - 1.5, gy0 = R[1] * f - 1.5, gx1 = R[2] * f + 1.5, gy1 = R[3] * f + 1.5;
  const tiles = [];
  for (let r = 0; r < n; r++) for (let s = r + 1; s < n; s++) {
    const er = E[r], es = E[s], det = er[0] * es[1] - er[1] * es[0];
    if (Math.abs(det) < 1e-9) continue;
    const rng = (e, g) => { const v = [gx0 * e[0] + gy0 * e[1], gx1 * e[0] + gy0 * e[1], gx0 * e[0] + gy1 * e[1], gx1 * e[0] + gy1 * e[1]]; return [Math.floor(Math.min(...v) + g), Math.ceil(Math.max(...v) + g)]; };
    const [kr0, kr1] = rng(er, gam[r]), [ks0, ks1] = rng(es, gam[s]);
    for (let kr = kr0; kr <= kr1; kr++) for (let ks = ks0; ks <= ks1; ks++) {
      const a = kr - gam[r], b = ks - gam[s];
      const x = (a * es[1] - b * er[1]) / det, y = (er[0] * b - es[0] * a) / det;
      if (x < gx0 || x > gx1 || y < gy0 || y > gy1) continue;
      let bx = 0, by = 0;
      for (let j = 0; j < n; j++) {
        const K = j === r ? kr - 1 : j === s ? ks - 1 : Math.floor(x * E[j][0] + y * E[j][1] + gam[j]);
        bx += K * E[j][0]; by += K * E[j][1];
      }
      const p = [bx, by, bx + er[0], by + er[1], bx + er[0] + es[0], by + er[1] + es[1], bx + es[0], by + es[1]];
      let d = s - r; if (n % 2 === 1) d = Math.min(d, n - d); else d = Math.min(d, n - d);
      tiles.push({ c: d - 1, p, r, s, kr, ks, key: r + ':' + s + ':' + kr + ':' + ks });
    }
  }
  return tiles;
}

// ───────────────────────── «Шляпа» (Смит, Майерс, Каплан, Гудман-Страусс, 2023) ─────────────────────────
// Построение метатайлами H, T, P, F по схеме Крейга Каплана (hatviz).
const hr3 = 0.8660254037844386;
const pt = (x, y) => ({ x, y });
const hexPt = (x, y) => pt(x + 0.5 * y, hr3 * y);
const padd = (p, q) => pt(p.x + q.x, p.y + q.y), psub = (p, q) => pt(p.x - q.x, p.y - q.y);
const IDENT = [1, 0, 0, 0, 1, 0];
const mul = (A, B) => [A[0] * B[0] + A[1] * B[3], A[0] * B[1] + A[1] * B[4], A[0] * B[2] + A[1] * B[5] + A[2], A[3] * B[0] + A[4] * B[3], A[3] * B[1] + A[4] * B[4], A[3] * B[2] + A[4] * B[5] + A[5]];
const inv = (T) => { const d = T[0] * T[4] - T[1] * T[3]; return [T[4] / d, -T[1] / d, (T[1] * T[5] - T[2] * T[4]) / d, -T[3] / d, T[0] / d, (T[2] * T[3] - T[0] * T[5]) / d]; };
const trot = (a) => [Math.cos(a), -Math.sin(a), 0, Math.sin(a), Math.cos(a), 0];
const ttrans = (x, y) => [1, 0, x, 0, 1, y];
const rotAbout = (p, a) => mul(ttrans(p.x, p.y), mul(trot(a), ttrans(-p.x, -p.y)));
const tp = (M, P) => pt(M[0] * P.x + M[1] * P.y + M[2], M[3] * P.x + M[4] * P.y + M[5]);
const matchSeg = (p, q) => [q.x - p.x, p.y - q.y, p.x, q.y - p.y, q.x - p.x, p.y];
const matchTwo = (p1, q1, p2, q2) => mul(matchSeg(p2, q2), inv(matchSeg(p1, q1)));
function intersect(p1, q1, p2, q2) {
  const d = (q2.y - p2.y) * (q1.x - p1.x) - (q2.x - p2.x) * (q1.y - p1.y);
  const uA = ((q2.x - p2.x) * (p1.y - p2.y) - (q2.y - p2.y) * (p1.x - p2.x)) / d;
  return pt(p1.x + uA * (q1.x - p1.x), p1.y + uA * (q1.y - p1.y));
}
const HAT = [hexPt(0, 0), hexPt(-1, -1), hexPt(0, -2), hexPt(2, -2), hexPt(2, -1), hexPt(4, -2), hexPt(5, -1), hexPt(4, 0), hexPt(3, 0), hexPt(2, 2), hexPt(0, 3), hexPt(0, 2), hexPt(-1, 2)];
class HatTile { constructor(label) { this.label = label; this.shape = HAT; this.hat = true; } }
class MetaTile {
  constructor(shape, width) { this.shape = shape; this.width = width; this.children = []; }
  addChild(T, geom) { this.children.push({ T, geom }); }
  evalChild(n, i) { return tp(this.children[n].T, this.children[n].geom.shape[i]); }
  recentre() {
    let cx = 0, cy = 0; for (const p of this.shape) { cx += p.x; cy += p.y; }
    cx /= this.shape.length; cy /= this.shape.length;
    this.shape = this.shape.map((p) => padd(p, pt(-cx, -cy)));
    const M = ttrans(-cx, -cy);
    for (const ch of this.children) ch.T = mul(M, ch.T);
  }
}
function initTiles() {
  let o = [pt(0, 0), pt(4, 0), pt(4.5, hr3), pt(2.5, 5 * hr3), pt(1.5, 5 * hr3), pt(-0.5, hr3)];
  const H = new MetaTile(o, 2);
  H.addChild(matchTwo(HAT[5], HAT[7], o[5], o[0]), new HatTile('H'));
  H.addChild(matchTwo(HAT[9], HAT[11], o[1], o[2]), new HatTile('H'));
  H.addChild(matchTwo(HAT[5], HAT[7], o[3], o[4]), new HatTile('H'));
  H.addChild(mul(ttrans(2.5, hr3), mul([-0.5, -hr3, 0, hr3, -0.5, 0], [0.5, 0, 0, 0, -0.5, 0])), new HatTile('H1'));
  o = [pt(0, 0), pt(3, 0), pt(1.5, 3 * hr3)];
  const T = new MetaTile(o, 2);
  T.addChild([0.5, 0, 0.5, 0, 0.5, hr3], new HatTile('T'));
  o = [pt(0, 0), pt(4, 0), pt(3, 2 * hr3), pt(-1, 2 * hr3)];
  const P = new MetaTile(o, 2);
  P.addChild([0.5, 0, 1.5, 0, 0.5, hr3], new HatTile('P'));
  P.addChild(mul(ttrans(0, 2 * hr3), mul([0.5, hr3, 0, -hr3, 0.5, 0], [0.5, 0, 0, 0, 0.5, 0])), new HatTile('P'));
  o = [pt(0, 0), pt(3, 0), pt(3.5, hr3), pt(3, 2 * hr3), pt(-1, 2 * hr3)];
  const F = new MetaTile(o, 2);
  F.addChild([0.5, 0, 1.5, 0, 0.5, hr3], new HatTile('F'));
  F.addChild(mul(ttrans(0, 2 * hr3), mul([0.5, hr3, 0, -hr3, 0.5, 0], [0.5, 0, 0, 0, 0.5, 0])), new HatTile('F'));

    lede: '«Шляпа» — первая найденная плитка-одиночка, которой плоскость покрывается <b>только непериодически</b>. Её открыли в 2023 году Дэвид Смит, Джозеф Майерс, Крейг Каплан и Хаим Гудман-Страусс.',
    title: 'Монотайл «шляпа»',
    fact: 'Зеркальные шляпы выделены отдельным цветом. Их доля в бесконечной мозаике — ровно 1 / (1 + φ⁴) ≈ 12,73 %. Включите «Иерархию», чтобы увидеть метатайлы H, T, P, F, из которых складывается узор.',
  },
};
function updateInfo() {
  const s = stats;
  let html = '';
  const cell = (dt, dd) => `<div><dt>${dt}</dt><dd>${dd}</dd></div>`;
  if (mode === 'penrose') {
    const ratio = s.thin ? s.thick / s.thin : 0;
    // во всей мозаике уровня n число половинок подчиняется рекурренции (a, o) → (a + o, a + 2o)
    let a = 10, o = 0; for (let k = 0; k < (s.level || 1); k++) [a, o] = [a + o, a + 2 * o];
    html = cell('Толстых : тонких в кадре', fmt(ratio, 3)) + cell('Во всей мозаике', fmt(o / a, 4) + '<small>→ φ</small>') + cell('Уровень деления', s.level ?? '—') + cell('Увеличение', '×' + fmtShort(view.s / (Math.min(W, H) * 0.95)));
  } else if (mode === 'multigrid') {
    const sym = s.sym || SYMS[symIdx];
    html = cell('Симметрия', `${sym.fold}-го порядка`) + cell('Ромбов на экране', fmtInt(s.tiles || 0)) + cell('Типов ромбов', Math.floor(sym.n / 2)) + cell('Сетки', sym.n + ' семейств');
  } else {
    const c = s.counts || {}, tot = s.tiles || 1;
    html = cell('Шляп на экране', fmtInt(s.tiles || 0)) + cell('Зеркальных', fmt((c.H1 || 0) / tot * 100, 1) + ' %<small>теория 12,73</small>') + cell('Метатайлов H', fmtInt(c.H ? (c.H + c.H1) / 4 : 0)) + cell('Уровней иерархии', HAT_LEVELS);
  }
  $('stats').innerHTML = html;
}
function fmtShort(x) {
  if (x < 1000) return fmt(x, x < 10 ? 1 : 0);
  const e = Math.floor(Math.log10(x)); return fmt(x / Math.pow(10, e), 1) + '·10' + String(e).split('').map((d) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
}
function setMode(m) {
  mode = m; document.body.className = 'mode-' + m;
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  const T = TEXT[m]; $('lede').innerHTML = T.lede; $('infoTitle').textContent = T.title; $('fact').textContent = T.fact;
  view.rot = 0; lastGridTiles = []; ghosts = []; seen = new Map(); stats = {};
  if (m === 'penrose') { view.s = target.s = Math.min(W, H) * 0.95 * Math.pow(PHI, 3); }
  else if (m === 'multigrid') { view.s = target.s = Math.min(W, H) / 13; }
  else { view.s = target.s = Math.min(W, H) / 34; }
  view.x = target.x = 0; view.y = target.y = 0;
  t0 = performance.now(); lastUser = -1e9;
  $('hint').textContent = m === 'multigrid' ? 'Наведите на плитку — подсветятся её ленты. Колесо — зум, перетаскивание — сдвиг.' : 'Колесо или щипок — зум, перетаскивание — сдвиг.';
  updateInfo();
}
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

// Палитры
PALETTES.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'swatch'; b.type = 'button'; b.title = p.name; b.setAttribute('aria-label', 'Глазурь «' + p.name + '»');
  b.innerHTML = [p.cls[0], p.cls[1], p.cls[2], p.cls[4]].map((c) => `<i style="background:${c}"></i>`).join('');
  b.addEventListener('click', () => { pal = p; syncPal(); });
  $('swatches').appendChild(b);
});
function syncPal() { [...$('swatches').children].forEach((b, i) => b.setAttribute('aria-pressed', String(PALETTES[i] === pal))); $('palName').textContent = pal.name; }
syncPal();
// Симметрии мультисетки
SYMS.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = s.fold; b.title = s.name;
  b.addEventListener('click', () => { symIdx = i; lastGridTiles = []; ghosts = []; seen = new Map(); syncSym(); });
  $('sym').appendChild(b);
});
function syncSym() { [...$('sym').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === symIdx))); $('symName').textContent = SYMS[symIdx].name; }
syncSym();

$('tAuto').addEventListener('click', (e) => { auto = !auto; e.currentTarget.setAttribute('aria-pressed', String(auto)); if (auto) lastUser = -1e9; });
$('tHier').addEventListener('click', (e) => { hier = !hier; e.currentTarget.setAttribute('aria-pressed', String(hier)); });
const zoomBy = (f, sx = W / 2, sy = H / 2) => {
  lastUser = performance.now();
  const before = toWorld(sx, sy);
  target.s = clampScale(target.s * f);
  // точка под курсором остаётся на месте
  const s0 = view.s; view.s = target.s; const after = toWorld(sx, sy); view.s = s0;
  target.x += before[0] - after[0]; target.y += before[1] - after[1];
};
function clampScale(s) {
  if (mode === 'penrose') return Math.max(Math.min(W, H) * 0.6, Math.min(s, Math.min(W, H) * Math.pow(PHI, 50)));
  if (mode === 'multigrid') return Math.max(Math.min(W, H) / 40, Math.min(s, Math.min(W, H) / 1.5));
  return Math.max(Math.min(W, H) / 70, Math.min(s, Math.min(W, H) / 3));
}
$('zIn').addEventListener('click', () => zoomBy(1.6));
$('zOut').addEventListener('click', () => zoomBy(1 / 1.6));

// ───────────────────────── Мышь, тач, колесо ─────────────────────────
const pointers = new Map();
let pinch = null;
cv.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY); }, { passive: false });
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); cv.classList.add('drag'); lastUser = performance.now(); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; } });
cv.addEventListener('pointermove', (e) => {
  hoverPt = [e.clientX, e.clientY];
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  lastUser = performance.now();
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomBy(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d; return;
  }
  const w0 = toWorld(prev[0], prev[1]), w1 = toWorld(e.clientX, e.clientY);
  view.x -= w1[0] - w0[0]; view.y -= w1[1] - w0[1]; target.x = view.x; target.y = view.y;
});
const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) cv.classList.remove('drag'); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { hoverPt = null; });
addEventListener('keydown', (e) => { if (e.key === '+' || e.key === '=') zoomBy(1.4); else if (e.key === '-') zoomBy(1 / 1.4); });

setMode('penrose');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
