<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глубже — рогалик</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Рогалик на десять ярусов: цветной свет факела, монстры со своим характером, неопознанные зелья и эпитафия по истории забега.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+SC:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070a;
    --side: #0d0d11;
    --line: rgba(201, 163, 107, .18);
    --line-strong: rgba(201, 163, 107, .36);
    --bronze: #c9a36b;
    --text: #ece3d0;
    --muted: #a39a88;
    --blood: #d2463c;
    --soul: #7fb2ff;
    --serif: "Alegreya", Georgia, serif;
    --sc: "Alegreya SC", "Alegreya", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  .stage { position: relative; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: none; }

  .log { position: absolute; left: 24px; bottom: 20px; right: 24px; pointer-events: none; font: 400 17px/1.45 var(--serif); }
  .log p { margin: 0; text-shadow: 0 1px 3px #000, 0 0 12px #000; transition: opacity .4s; }
  .log p b { font-weight: 500; }
  .log .hurt { color: #ff9a8a; } .log .good { color: #f2d48a; } .log .info { color: #b9c9e8; } .log .dim { color: var(--muted); }

  .side { background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 26px 16px; gap: 13px; overflow-y: auto; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .brand h1 { margin: 0; font: 800 46px/.9 var(--sc); letter-spacing: .01em; color: var(--text); }
  .brand p { margin: 8px 0 0; font: italic 400 16px/1.3 var(--serif); color: var(--muted); }
  .depth { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .depth .lbl { font: 500 15px/1 var(--sc); color: var(--muted); letter-spacing: .04em; }
  .depth b { font: 700 42px/1 var(--mono); color: var(--bronze); }
  .depth .of { font: 400 14px/1 var(--mono); color: var(--muted); }
  .depth .best { margin-left: auto; font: 400 13px/1.2 var(--serif); color: var(--muted); text-align: right; }

  .hero .name { font: 500 19px/1.2 var(--serif); margin-bottom: 10px; }
  .hero .name small { font: italic 400 15px/1 var(--serif); color: var(--muted); }
  .bar { position: relative; height: 22px; background: #1a1a20; border: 1px solid #25252c; margin-bottom: 7px; overflow: hidden; }
  .bar i { position: absolute; inset: 0; transform-origin: 0 50%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  .bar.hp i { background: linear-gradient(90deg, #7a1c17, var(--blood)); }
  .bar.xp { height: 18px; }
  .bar.xp i { background: linear-gradient(90deg, #3a4f86, var(--soul)); }
  .bar > span { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 9px; font: 500 12.5px/1 var(--mono); color: #fff; text-shadow: 0 1px 2px #000; }
  .bar.xp > span { font-size: 12px; color: #dfe8ff; }
  .gear { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font: 400 15px/1.3 var(--serif); }
  .gear dt { font: 500 13px/1 var(--sc); color: var(--muted); letter-spacing: .03em; margin-bottom: 3px; }
  .gear dd { margin: 0; }
  .gear dd em { font: normal 400 13px/1 var(--mono); color: var(--muted); }

  h2 { margin: 0 0 8px; font: 500 15px/1 var(--sc); color: var(--muted); letter-spacing: .05em; display: flex; justify-content: space-between; }
  h2 span { font: 400 13px/1 var(--mono); letter-spacing: 0; }
  .inv { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .inv li button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 8px; background: transparent; border: 1px solid transparent; color: var(--text); font: 400 15.5px/1.2 var(--serif); text-align: left; cursor: pointer; border-radius: 2px; transition: background .15s, border-color .15s; }
  .inv li button:hover, .inv li button:focus-visible { background: #16161c; border-color: var(--line-strong); outline: none; }
  .inv kbd { font: 500 12px/1 var(--mono); color: var(--muted); border: 1px solid #2c2c34; padding: 3px 5px; border-radius: 2px; min-width: 20px; text-align: center; }
  .inv .gl { font: 700 18px/1 var(--mono); width: 14px; text-align: center; }
  .empty { font: italic 400 15px/1.3 var(--serif); color: var(--muted); }
  .foes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .foes li { display: grid; grid-template-columns: 18px 1fr 60px; align-items: center; gap: 10px; font: 400 15px/1.2 var(--serif); }
  .foes .gl { font: 700 17px/1 var(--mono); text-align: center; }
  .foes .mini { height: 5px; background: #1c1c22; position: relative; overflow: hidden; }
  .foes .mini i { position: absolute; inset: 0; background: var(--blood); transform-origin: 0 50%; }
  .foes .zz { font: italic 400 13px/1 var(--serif); color: var(--muted); }
  #mini { width: 100%; max-height: 170px; object-fit: contain; height: auto; image-rendering: pixelated; border: 1px solid var(--line); background: #060608; }
  .keys { margin: auto 0 0; display: grid; gap: 6px; font: 400 14px/1.3 var(--serif); color: var(--muted); }
  .keys div { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .keys dt { white-space: nowrap; } .keys dd { margin: 0; white-space: nowrap; color: var(--text); }
  .keys kbd { font: 500 12px/1 var(--mono); color: var(--text); background: #16161b; border: 1px solid #2a2a31; padding: 2px 5px; border-radius: 2px; }
  .hover { min-height: 18px; font: italic 400 15px/1.3 var(--serif); color: #cfc3a8; }

  .dpad { display: none; }

  /* ── Надгробие ── */
  .grave { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(12, 12, 16, .55), rgba(3, 3, 5, .94)); opacity: 0; pointer-events: none; transition: opacity .9s ease; z-index: 10; padding: 20px; }
  .grave.show { opacity: 1; pointer-events: auto; }
  .stone { width: min(520px, 100%); padding: 56px 44px 34px; text-align: center; border-radius: 240px 240px 6px 6px; background:
      radial-gradient(ellipse at 30% 18%, rgba(255, 255, 255, .07), transparent 55%),
      repeating-linear-gradient(115deg, rgba(255, 255, 255, .012) 0 3px, rgba(0, 0, 0, .025) 3px 7px),
      linear-gradient(180deg, #5d5a55, #3c3a37 60%, #2d2b29);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), inset 0 -18px 40px rgba(0, 0, 0, .35), 0 40px 80px rgba(0, 0, 0, .7);
    color: #d9d2c3; transform: translateY(16px); transition: transform 1.1s cubic-bezier(.2, .8, .2, 1); }
  .grave.show .stone { transform: none; }
  .stone .rip { font: 700 15px/1 var(--sc); letter-spacing: .3em; color: #b8b0a0; text-shadow: 0 1px 0 rgba(255, 255, 255, .12), 0 -1px 0 rgba(0, 0, 0, .5); }
  .stone .who { margin: 18px 0 4px; font: 700 34px/1.1 var(--sc); color: #ece6d8; text-shadow: 0 1px 0 rgba(255, 255, 255, .15), 0 -1px 1px rgba(0, 0, 0, .6); }
  .stone .dates { font: italic 400 16px/1 var(--serif); color: #b9b1a1; }
  .stone .ep { margin: 22px 0 0; font: 400 18px/1.55 var(--serif); color: #e2dbcb; text-shadow: 0 -1px 0 rgba(0, 0, 0, .45); }
  .stone .ep p { margin: 0 0 8px; }
  .stone .ep .last { font-style: italic; color: #bdb4a2; margin-top: 14px; }
  .stone .row { display: flex; justify-content: center; gap: 22px; margin: 22px 0 22px; font: 500 13px/1.3 var(--mono); color: #b8b0a0; }
  .stone .row b { display: block; font: 700 20px/1 var(--mono); color: #ece6d8; margin-bottom: 4px; }
  .again { min-height: 46px; padding: 0 26px; background: #16151a; color: var(--text); border: 1px solid var(--line-strong); font: 500 18px/1 var(--sc); letter-spacing: .04em; border-radius: 2px; cursor: pointer; transition: background .2s, border-color .2s; }
  .again:hover, .again:focus-visible { background: #211f25; border-color: var(--bronze); outline: none; }
  .stone.win { background: radial-gradient(ellipse at 50% 20%, rgba(255, 214, 140, .18), transparent 60%), linear-gradient(180deg, #4a3d26, #2c2419 70%, #201a12); }

  @media (max-width: 900px) and (min-width: 761px) { .app { grid-template-columns: 1fr 290px; } .side { padding: 20px 18px; } }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .stage { min-height: 0; }
    .log { left: 12px; right: 12px; bottom: auto; top: 10px; font-size: 15px; }
    .side { border-left: 0; border-top: 1px solid var(--line); padding: 12px 14px 14px; gap: 10px; display: grid; grid-template-columns: 1fr 150px; grid-template-areas: "vit pad" "inv pad"; overflow: visible; }
    .brand, .gear, .foes-wrap, #mini, .keys, .hover, .depth .best { display: none; }
    .vit { grid-area: vit; }
    .inv-wrap { grid-area: inv; }
    .depth { padding: 0 0 6px; border-top: 0; }
    .depth b { font-size: 26px; }
    .hero .name { display: none; }
    .inv { grid-template-columns: 1fr; max-height: 76px; overflow-y: auto; }
    .inv li button { min-height: 32px; font-size: 14.5px; padding: 2px 6px; }
    .dpad { grid-area: pad; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-self: center; }
    .dpad button { height: 44px; background: #15151a; border: 1px solid #2a2a31; color: var(--text); border-radius: 2px; font: 500 15px/1 var(--mono); display: grid; place-items: center; }
    .dpad button:active { background: #24242b; }
    .dpad svg { width: 16px; height: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .grave, .stone, .bar i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <canvas id="map" aria-label="Подземелье"></canvas>
    <div class="log" id="log" aria-live="polite"></div>
  </main>
  <aside class="side">
    <header class="brand"><h1>Глубже</h1><p>рогалик на десять ярусов</p></header>
    <section class="vit">
      <div class="depth"><span class="lbl">ярус</span><b id="depth">1</b><span class="of">из 10</span><span class="best" id="best"></span></div>
      <div class="hero">
        <div class="name" id="heroName"></div>
        <div class="bar hp"><i id="hpBar"></i><span><b>Здоровье</b><b id="hpTxt"></b></span></div>
        <div class="bar xp" title="Опыт до следующего уровня"><i id="xpBar"></i><span><b>Опыт</b><b id="xpTxt"></b></span></div>
      </div>
    </section>
    <dl class="gear" id="gear"></dl>
    <section class="inv-wrap"><h2>Сумка <span id="invCount"></span></h2><ul class="inv" id="inv"></ul></section>
    <section class="foes-wrap"><h2>Рядом</h2><ul class="foes" id="foes"></ul></section>
    <canvas id="mini" width="192" height="132" aria-label="Карта яруса"></canvas>
    <div class="hover" id="hover"></div>
    <dl class="keys">
      <div><dt>Шаг и атака</dt><dd><kbd>←↑→↓</kbd> <kbd>WASD</kbd> <kbd>hjkl</kbd></dd></div>
      <div><dt>Идти туда</dt><dd>клик по клетке</dd></div>
      <div><dt>Предмет</dt><dd><kbd>1</kbd>–<kbd>9</kbd></dd></div>
      <div><dt>Спуститься, ждать</dt><dd><kbd>&gt;</kbd> <kbd>.</kbd></dd></div>
    </dl>
    <div class="dpad" id="dpad"></div>
  </aside>
</div>

<div class="grave" id="grave" role="dialog" aria-modal="true" aria-labelledby="graveWho">
  <div class="stone" id="stone">
    <div class="rip" id="graveRip">Здесь покоится</div>
    <div class="who" id="graveWho"></div>
    <div class="dates" id="graveDates"></div>
    <div class="ep" id="graveEp"></div>
    <div class="row" id="graveRow"></div>
    <button class="again" id="again">Спуститься снова</button>
  </div>
</div>

<script>
(() => {
'use strict';
// ───────────────────────── Случайность ─────────────────────────
let seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
function rnd() { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return f[a > 10 && a < 20 ? 2 : b > 1 && b < 5 ? 1 : b === 1 ? 0 : 2]; };
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const $ = (id) => document.getElementById(id);

// ───────────────────────── Мир ─────────────────────────
const MW = 64, MH = 44, MAXD = 10;
const T = { WALL: 0, FLOOR: 1, DOORC: 2, DOORO: 3, STAIRS: 4, WATER: 5, LAVA: 6, GRASS: 7, CRYSTAL: 8, BRAZIER: 9, BRIDGE: 10, RUBBLE: 11 };
// glyph, цвет знака, цвет фона (0–255)
const TILE = {
  [T.WALL]: ['#', [132, 136, 152], [66, 68, 82]],
  [T.FLOOR]: ['·', [128, 124, 132], [36, 34, 40]],
  [T.DOORC]: ['+', [236, 170, 96], [86, 54, 28]],
  [T.DOORO]: ["'", [220, 160, 90], [44, 34, 24]],
  [T.STAIRS]: ['>', [255, 244, 214], [52, 46, 70]],
  [T.WATER]: ['≈', [140, 196, 255], [22, 56, 112]],
  [T.LAVA]: ['≈', [255, 222, 150], [196, 62, 18]],
  [T.GRASS]: ['"', [132, 196, 90], [30, 44, 26]],
  [T.CRYSTAL]: ['◆', [190, 250, 255], [40, 84, 100]],
  [T.BRAZIER]: ['Ψ', [255, 200, 110], [70, 42, 20]],
  [T.BRIDGE]: ['=', [196, 150, 100], [60, 42, 26]],
  [T.RUBBLE]: [',', [140, 128, 116], [36, 34, 40]],
};
const PASS = new Set([T.FLOOR, T.DOORC, T.DOORO, T.STAIRS, T.WATER, T.GRASS, T.BRIDGE, T.RUBBLE]);
const OPAQUE = new Set([T.WALL, T.DOORC, T.CRYSTAL]);

// Монстры: имена в нужных падежах, глагол атаки, поведение
const MON = {
  rat: { g: 'к', col: [214, 160, 110], hp: 4, dmg: [1, 2], acc: 0.7, spd: 1, xp: 1, err: 0.3, nom: 'крыса', acc_: 'крысу', one: 'одну крысу', pl: ['крысу', 'крысы', 'крыс'], verb: 'кусает', by: 'от укуса крысы' },
  bat: { g: 'м', col: [190, 150, 230], hp: 3, dmg: [1, 3], acc: 0.65, spd: 2, xp: 2, err: 0.55, nom: 'летучая мышь', acc_: 'летучую мышь', one: 'одну летучую мышь', pl: ['летучую мышь', 'летучие мыши', 'летучих мышей'], verb: 'кусает', by: 'от зубов летучей мыши' },
  gob: { g: 'г', col: [130, 204, 108], hp: 8, dmg: [2, 4], acc: 0.75, spd: 1, xp: 3, nom: 'гоблин', acc_: 'гоблина', one: 'одного гоблина', pl: ['гоблина', 'гоблина', 'гоблинов'], verb: 'бьёт', by: 'от ножа гоблина' },
  arch: { g: 'л', col: [226, 206, 96], hp: 6, dmg: [2, 3], acc: 0.7, spd: 1, xp: 4, ranged: 6, nom: 'гоблин-лучник', acc_: 'гоблина-лучника', one: 'одного гоблина-лучника', pl: ['гоблина-лучника', 'гоблина-лучника', 'гоблинов-лучников'], verb: 'стреляет в', by: 'от стрелы гоблина-лучника' },
  slime: { g: 'с', col: [96, 222, 172], hp: 10, dmg: [1, 3], acc: 0.7, spd: 0.5, xp: 3, split: true, nom: 'слизень', acc_: 'слизня', one: 'одного слизня', pl: ['слизня', 'слизня', 'слизней'], verb: 'обволакивает', by: 'в объятиях слизня' },
  ghost: { g: 'п', col: [210, 230, 255], hp: 7, dmg: [2, 5], acc: 0.8, spd: 1, xp: 6, phase: true, nom: 'призрак', acc_: 'призрака', one: 'одного призрака', pl: ['призрака', 'призрака', 'призраков'], verb: 'касается', by: 'от ледяного касания призрака' },
  troll: { g: 'Т', col: [160, 176, 104], hp: 22, dmg: [4, 8], acc: 0.7, spd: 1, xp: 12, regen: true, nom: 'тролль', acc_: 'тролля', one: 'одного тролля', pl: ['тролля', 'тролля', 'троллей'], verb: 'бьёт дубиной', by: 'от дубины тролля' },
  boss: { g: 'Х', col: [255, 110, 80], hp: 60, dmg: [5, 10], acc: 0.8, spd: 1, xp: 50, boss: true, nom: 'Хранитель глубины', acc_: 'Хранителя глубины', one: 'Хранителя глубины', pl: ['Хранителя глубины', 'Хранителей глубины', 'Хранителей глубины'], verb: 'обрушивает удар на', by: 'от руки Хранителя глубины' },
};
const SPAWN = [
  ['rat', 1, 4, 5], ['bat', 1, 6, 3], ['gob', 2, 8, 4], ['arch', 3, 9, 3], ['slime', 4, 9, 3], ['ghost', 5, 10, 3], ['troll', 7, 10, 2],
];

// Предметы: зелья и свитки неопознаны до первого применения
const POTIONS = [
  { id: 'heal', name: 'зелье лечения' }, { id: 'str', name: 'зелье силы' }, { id: 'see', name: 'зелье зоркости' },
  { id: 'fire', name: 'зелье огня' }, { id: 'poison', name: 'зелье яда' },
];
const LOOKS = [
  ['багровое', 'багровом', [210, 50, 74]], ['лазурное', 'лазурном', [70, 160, 255]], ['изумрудное', 'изумрудном', [50, 200, 126]],
  ['янтарное', 'янтарном', [240, 160, 48]], ['молочное', 'молочном', [232, 228, 218]], ['чернильное', 'чернильном', [122, 92, 255]], ['золотистое', 'золотистом', [242, 210, 78]],
];
const SCROLLS = [{ id: 'tele', name: 'свиток телепортации' }, { id: 'map', name: 'свиток карты' }, { id: 'light', name: 'свиток света' }];
const WEAPONS = [
  { name: 'кинжал', acc_: 'кинжал', ins: 'кинжалом', dmg: [1, 4], depth: 1 }, { name: 'меч', acc_: 'меч', ins: 'мечом', dmg: [2, 6], depth: 2 },
  { name: 'топор', acc_: 'топор', ins: 'топором', dmg: [3, 8], depth: 4 }, { name: 'боевой молот', acc_: 'боевой молот', ins: 'молотом', dmg: [4, 10], depth: 7 },
];
const ARMORS = [
  { name: 'кожаная куртка', acc_: 'кожаную куртку', def: 1, depth: 1 }, { name: 'кольчуга', acc_: 'кольчугу', def: 2, depth: 3 }, { name: 'латы', acc_: 'латы', def: 4, depth: 6 },
];
const HEROES = [['Мирон', 0], ['Всеволод', 0], ['Тихон', 0], ['Демид', 0], ['Ульяна', 1], ['Злата', 1], ['Агафья', 1], ['Василиса', 1]];
const SYL = ['ЗЕЛ', 'АР', 'ТОН', 'ОКС', 'МУР', 'ВЕЛ', 'ЯР', 'ГОР', 'ИЛЬ', 'КАН', 'ДУМ', 'ЭЛЬ', 'РОС', 'БЕЗ', 'НОЧ'];

// ───────────────────────── Состояние забега ─────────────────────────
let G;          // игра
let L;          // текущий уровень
function newRun() {
  seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  const looks = LOOKS.slice().sort(() => rnd() - 0.5);
  const titles = SCROLLS.map(() => pick(SYL) + pick(SYL).toLowerCase() + ' ' + pick(SYL));
  const [hname, fem] = pick(HEROES);
  G = {
    depth: 1, turn: 0, dead: false, won: false, msgs: [],
    potionLook: Object.fromEntries(POTIONS.map((p, i) => [p.id, looks[i]])),
    scrollTitle: Object.fromEntries(SCROLLS.map((s, i) => [s.id, titles[i]])),
    known: new Set(),
    hero: { name: hname, fem, x: 0, y: 0, px: 0, py: 0, mt: 0, hp: 24, max: 24, lvl: 1, xp: 0, str: 0, weapon: WEAPONS[0], armor: null, gold: 0, inv: [] },
    kills: {}, cause: '', sights: new Set(), usedUnknown: [], lastTele: -99,

const ease = (t) => { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); };

// ───────────────────────── Ввод ─────────────────────────
const KEYS = {

addEventListener('keydown', (e) => {
  if ($('grave').classList.contains('show')) { if (e.code === 'KeyR' || e.code === 'Enter') { e.preventDefault(); $('grave').classList.remove('show'); newRun(); } return; }

  if (e.key === '>' || (e.code === 'Period' && e.shiftKey) || e.code === 'Enter') { e.preventDefault(); stopTravel(); descend(); return; }

// Клик: соседняя клетка — шаг или удар; дальняя — путь по разведанным клеткам
let travel = null;

// Экранный крест для телефона
(() => {
