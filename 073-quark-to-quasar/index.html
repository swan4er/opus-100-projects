<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>От кварка до квазара</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Непрерывный зум через 45 порядков величины: от кварка внутри протона до наблюдаемой Вселенной. Центр экрана — всегда вы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" async id="topojs"></script>
<style>
:root{
  --text:#f2ede4;
  --soft:#b4ab9f;
  --dim:#8f877d;
  --acc:#ffcf7a;
  --line:rgba(242,237,228,.16);
  --display:'Unbounded','Arial Black',sans-serif;
  --sans:'Onest','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0a0d;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.title{position:fixed;left:40px;top:34px;z-index:2;pointer-events:none;max-width:460px}
.title .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:500}
.title h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.02;letter-spacing:-.02em;margin:10px 0 12px}
.title p{font-size:15px;line-height:1.5;color:var(--soft);max-width:34ch}

/* шкала порядков справа */
.rail{position:fixed;right:34px;top:50%;transform:translateY(-50%);height:min(72vh,640px);width:120px;z-index:3;cursor:ns-resize;touch-action:none}
.rail .track{position:absolute;right:52px;top:0;bottom:0;width:1px;background:var(--line)}
.rail .tick{position:absolute;right:52px;height:1px;background:rgba(242,237,228,.35)}
.rail .lab{position:absolute;right:0;transform:translateY(-50%);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail .obj{position:absolute;right:48px;width:9px;height:1px;background:rgba(255,207,122,.5)}
.rail .cur{position:absolute;right:40px;width:26px;height:2px;background:var(--acc);transform:translateY(-50%)}
.rail .cur b{position:absolute;right:32px;top:-9px;font-size:12px;font-weight:600;color:var(--acc);white-space:nowrap}

/* карточка объекта в фокусе */
.card{position:fixed;left:40px;bottom:34px;z-index:2;max-width:430px;pointer-events:none;transition:opacity .35s}
.card .name{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;margin-bottom:6px}
.card .size{font-size:15px;color:var(--acc);font-weight:500;margin-bottom:8px;font-variant-numeric:tabular-nums}
.card .fact{font-size:15px;line-height:1.5;color:var(--soft)}
.card .cmp{display:inline-block;margin-left:8px;font-size:12px;color:var(--dim);border:1px solid var(--line);padding:1px 6px;vertical-align:2px}

/* линейка и кнопки */
.bottom{position:fixed;right:34px;bottom:30px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.ruler{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ruler .bar{height:8px;border:1px solid rgba(242,237,228,.7);border-top:0}
.ruler span{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.jumps{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:520px}
.jumps button{font-size:13px;padding:7px 10px;border:1px solid var(--line);color:var(--soft);transition:border-color .2s,color .2s,background .2s}
.jumps button:hover{border-color:rgba(255,207,122,.6);color:var(--text)}
.jumps button.tour{background:var(--acc);border-color:var(--acc);color:#1d1406;font-weight:600}
.hint{position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:2;font-size:13px;color:var(--dim);pointer-events:none;transition:opacity .6s}

@media (max-width:820px){
  .title{left:18px;top:18px;right:18px}
  .title h1{font-size:26px}
  .title p{display:none}
  .rail{right:6px;width:84px;height:46vh;top:44%}
  .rail .track,.rail .tick{right:40px}
  .rail .obj{right:36px}
  .rail .cur{right:30px;width:20px}
  .rail .lab{font-size:11px}
  .card{left:18px;right:18px;bottom:128px;max-width:none}
  .card .name{font-size:20px}
  .card .fact{font-size:14px}
  .bottom{right:12px;left:12px;bottom:14px;align-items:stretch}
  .ruler{align-items:flex-end}
  .jumps{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;max-width:none;padding-bottom:2px;scrollbar-width:none}
  .jumps button{flex:none}
  .hint{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Зум через масштабы Вселенной. Колесо мыши или перетаскивание вверх-вниз меняет масштаб."></canvas>
<header class="title">
  <div class="k">45 порядков величины</div>
  <h1>От кварка до&nbsp;квазара</h1>
  <p>Центр экрана&nbsp;— всегда вы. Внутрь&nbsp;— к&nbsp;атомам вашего тела, наружу&nbsp;— к&nbsp;краю наблюдаемой Вселенной.</p>
</header>
<div class="hint" id="hint">колесо вверх&nbsp;— внутрь, к&nbsp;кварку · вниз&nbsp;— наружу, к&nbsp;квазару</div>
<div class="rail" id="rail"><div class="track"></div></div>
<div class="card" id="card"><div class="name" id="cName"></div><div class="size" id="cSize"></div><div class="fact" id="cFact"></div></div>
<div class="bottom">
  <div class="ruler"><div class="bar" id="rBar"></div><span id="rText"></span></div>
  <div class="jumps" id="jumps">
    <button class="tour" id="tour">Путешествие</button>
    <button data-s="-14.9">Протон</button>
    <button data-s="-9.3">Атом</button>
    <button data-s="-4.3">Клетка</button>
    <button data-s="0.35">Человек</button>
    <button data-s="4.75">Москва</button>
    <button data-s="7.25">Земля</button>
    <button data-s="12.2">Планеты</button>
    <button data-s="21.2">Галактика</button>
    <button data-s="26.95">Вселенная</button>
  </div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   S — десятичный логарифм высоты экрана в метрах.
   Каждый объект задан размером (м) и положением относительно «вас» (м).
   Центральная цепочка вложена: кварк ⊂ протон ⊂ ядро ⊂ атом ⊂ ДНК ⊂ ядро клетки
   ⊂ клетка ⊂ человек ⊂ Москва ⊂ Земля; дальше — честные положения:
   Солнце в 1 а. е. сбоку, центр Галактики в 26 000 св. лет и т. д.
   ════════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const cv = $('#c'), mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0, DPR = 1;
const LY = 9.4607e15, AU = 1.496e11, KM = 1e3;
const TAU = Math.PI * 2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* детерминированный ГПСЧ для процедурных текстур */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function glow(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function sprite(size, painter) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  painter(c.getContext('2d'), size); return c;
}
const spriteCache = {};
const spr = (name, size, painter) => spriteCache[name] || (spriteCache[name] = sprite(size, painter));
function drawSprite(s, R, rot = 0) {
  ctx.save(); ctx.rotate(rot); ctx.drawImage(s, -R, -R, R * 2, R * 2); ctx.restore();
}

/* ── Земля: настоящие материки (world-atlas), если есть сеть ──
   Суша растеризуется в равнопромежуточную карту, а глобус над Москвой
   строится попиксельно обратной ортографической проекцией — без артефактов на горизонте. */
let earthSprite = null;
async function loadLand() {
  try {
    await new Promise((res, rej) => {
      if (window.topojson) return res();
      const sc = $('#topojs'); sc.addEventListener('load', res); sc.addEventListener('error', rej);
      setTimeout(() => (window.topojson ? res() : rej()), 8000);
    });
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json')).json();
    const land = window.topojson.feature(topo, topo.objects.land);
    const EW = 2048, EH = 1024;
    const eq = document.createElement('canvas'); eq.width = EW; eq.height = EH;
    const e = eq.getContext('2d');
    e.fillStyle = '#fff'; e.beginPath();
    const feats = land.type === 'FeatureCollection' ? land.features : [land];
    const polys = [];
    for (const f of feats) {
      if (!f.geometry) continue;
      if (f.geometry.type === 'MultiPolygon') polys.push(...f.geometry.coordinates);
      else if (f.geometry.type === 'Polygon') polys.push(f.geometry.coordinates);
    }
    for (const poly of polys) for (const ring of poly) {
      ring.forEach(([lon, lat], i) => { const x = ((lon + 180) / 360) * EW, y = ((90 - lat) / 180) * EH; i ? e.lineTo(x, y) : e.moveTo(x, y); });
      e.closePath();
    }
    e.fill('evenodd');
    const src = e.getImageData(0, 0, EW, EH).data;
    const N = 900, lat0 = 55.756 * Math.PI / 180, lon0 = 37.617 * Math.PI / 180;
    const sp = document.createElement('canvas'); sp.width = sp.height = N;
    const x = sp.getContext('2d'), img = x.createImageData(N, N), d = img.data;
    const sl = Math.sin(lat0), cl = Math.cos(lat0), r = rng(4);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const u = ((i + 0.5) / N) * 2 - 1, v = 1 - ((j + 0.5) / N) * 2, rho = Math.hypot(u, v);
      if (rho >= 1) continue;
      const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c);
      const lat = rho ? Math.asin(cc * sl + (v * sc * cl) / rho) : lat0;
      const lon = lon0 + Math.atan2(u * sc, rho * cl * cc - v * sl * sc);
      let lx = Math.floor(((((lon * 180) / Math.PI + 540) % 360) / 360) * EW), ly = Math.floor(((90 - (lat * 180) / Math.PI) / 180) * EH);
      ly = Math.min(EH - 1, Math.max(0, ly));
      if (src[(ly * EW + lx) * 4 + 3] < 128) continue;
      const k = (j * N + i) * 4, alat = Math.abs(lat * 180 / Math.PI), n = r() * 14 - 7;
      let col = alat > 66 ? [214, 224, 226] : alat < 33 && alat > 12 ? [176, 150, 102] : [104, 138, 84];
      d[k] = col[0] + n; d[k + 1] = col[1] + n; d[k + 2] = col[2] + n; d[k + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    earthSprite = sp;
  } catch (err) { earthSprite = null; }
}
loadLand();

/* ── объекты ─────────────────────────────────────────────────── */
const OBJ = [];
const add = (o) => OBJ.push(Object.assign({ pos: [0, 0], cmp: false }, o));

add({ id: 'quark', name: 'Кварк', size: 1e-18, fact: 'Размер кварка не измерен: эксперименты дают только верхнюю границу — меньше 10⁻¹⁸ м. Возможно, он вообще точечный.',
  draw(R, t) { glow(0, 0, R * 3.2, 'rgba(255,90,110,A)', 0.55); glow(0, 0, R * 1.2, 'rgba(255,220,220,A)', 1); } });
add({ id: 'proton', name: 'Протон', size: 1.7e-15, fact: 'Три кварка, склеенные глюонами. Почти вся масса протона — энергия этого поля, а не масса самих кварков.',
  draw(R, t) {
    glow(0, 0, R * 1.15, 'rgba(160,90,255,A)', 0.55);
    const q = [[0, 0, '#ff5a6e'], [R * 0.52, -R * 0.3, '#5ee37c'], [R * 0.12, R * 0.55, '#5aa8ff']];
    ctx.lineWidth = Math.max(1, R * 0.02);
    for (let i = 0; i < 3; i++) { const a = q[i], b = q[(i + 1) % 3];
      ctx.strokeStyle = 'rgba(255,230,160,.55)'; ctx.beginPath();
      for (let k = 0; k <= 40; k++) { const u = k / 40, x = a[0] + (b[0] - a[0]) * u, y = a[1] + (b[1] - a[1]) * u, n = [-(b[1] - a[1]), b[0] - a[0]], L = Math.hypot(...n) || 1, w = Math.sin(u * 28 + t * 6) * R * 0.035;
        const px = x + n[0] / L * w, py = y + n[1] / L * w; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke(); }
    for (const [x, y, c] of q) { glow(x, y, R * 0.16, 'rgba(255,255,255,A)', 0.4); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, R * 0.075, 0, TAU); ctx.fill(); }
  } });
add({ id: 'nucleus', name: 'Ядро атома углерода', size: 5.5e-15, fact: '6 протонов и 6 нейтронов. Ядро в 60 000 раз меньше атома, но в нём 99,97 % массы.',
  draw(R) {
    const pts = [[0.42, 0.1], [-0.36, 0.28], [0.1, -0.46], [-0.2, -0.36], [0.4, -0.3], [-0.46, -0.12], [0.2, 0.44], [-0.12, 0.46], [0.5, 0.36], [-0.5, 0.42], [0.05, 0.0]];
    pts.forEach(([x, y], i) => {
      if (i === 10) return;
      const g = ctx.createRadialGradient(x * R - R * 0.08, y * R - R * 0.08, R * 0.02, x * R, y * R, R * 0.26);
      g.addColorStop(0, i % 2 ? '#e8b7ff' : '#ff9a8a'); g.addColorStop(1, i % 2 ? '#6d4a9a' : '#9a3a3a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x * R, y * R, R * 0.25, 0, TAU); ctx.fill();
    });
  } });
add({ id: 'uranium', name: 'Ядро урана-238', size: 1.5e-14, pos: [1.35e-14, 0.2e-14], cmp: true, fact: '238 нуклонов — самое тяжёлое из ядер, которых в природе много. И всё равно в тысячи раз меньше атома.',
  draw(R) {
    const r = rng(238);
    for (let i = 0; i < 170; i++) { const a = r() * TAU, d = Math.sqrt(r()) * R * 0.86, x = Math.cos(a) * d, y = Math.sin(a) * d;
      ctx.fillStyle = r() < 0.39 ? '#ff8f7e' : '#b98be6'; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(x, y, R * 0.075, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  } });
add({ id: 'atom', name: 'Атом углерода', size: 3.4e-10, fact: 'Почти целиком пустота: электронное облако в поперечнике около 0,34 нм, а ядро в центре в 60 000 раз меньше.',
  draw(R, t) {
    const s = spr('atom', 512, (x, n) => {
      const r = rng(6);
      for (let i = 0; i < 9000; i++) { const a = r() * TAU, rr = -Math.log(1 - r() * 0.985) * 0.2, d = Math.min(0.98, rr) * n / 2;
        x.fillStyle = `rgba(120,200,255,${0.08 + r() * 0.12})`; x.fillRect(n / 2 + Math.cos(a) * d, n / 2 + Math.sin(a) * d, 2, 2); }
      const g = x.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
      g.addColorStop(0, 'rgba(110,190,255,.28)'); g.addColorStop(0.6, 'rgba(60,120,220,.1)'); g.addColorStop(1, 'rgba(40,80,200,0)');
      x.fillStyle = g; x.fillRect(0, 0, n, n);
    });
    drawSprite(s, R, t * 0.05);
    ctx.fillStyle = '#ffd7a0'; ctx.beginPath(); ctx.arc(0, 0, Math.max(1.2, R * 0.004), 0, TAU); ctx.fill();
  } });
add({ id: 'water', name: 'Молекула воды', size: 2.8e-10, pos: [4.3e-10, 0.9e-10], cmp: true, fact: 'Кислород и два водорода под углом 104,5°. В стакане воды таких молекул около 10²⁵.',
  draw(R) {
    const ball = (x, y, r, c1, c2) => { const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
    const a = 104.5 / 2 * Math.PI / 180;
    ball(Math.sin(a) * R * 0.62, Math.cos(a) * R * 0.5, R * 0.3, '#ffffff', '#9aa6b8');
    ball(-Math.sin(a) * R * 0.62, Math.cos(a) * R * 0.5, R * 0.3, '#ffffff', '#9aa6b8');
    ball(0, -R * 0.12, R * 0.48, '#ff8a7a', '#b3332c');
  } });
add({ id: 'dna', name: 'ДНК', size: 1.2e-8, fact: 'Двойная спираль шириной 2 нм. Один виток — 3,4 нм и 10 пар оснований. В каждой клетке её около двух метров.',
  draw(R, t) {
    const h = R, w = R * (2e-9 / 1.2e-8) * 1.0, turns = 1.2e-8 / 3.4e-9;
    const cols = ['#ff7a6b', '#ffd36b', '#6be1ff', '#8f7bff'];
    for (let k = 0; k <= 36; k++) {
      const u = k / 36, y = -h + u * 2 * h, ph = u * turns * TAU + t * 0.4;
      const x1 = Math.sin(ph) * w, x2 = Math.sin(ph + Math.PI * 0.8) * w;
      ctx.strokeStyle = cols[k % 4]; ctx.lineWidth = Math.max(1, w * 0.18); ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const off of [0, Math.PI * 0.8]) {
      ctx.strokeStyle = off ? '#9fd8ff' : '#e9f6ff'; ctx.lineWidth = Math.max(1.5, w * 0.3); ctx.beginPath();
      for (let k = 0; k <= 200; k++) { const u = k / 200, y = -h + u * 2 * h, x = Math.sin(u * turns * TAU + t * 0.4 + off) * w; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
  } });
add({ id: 'hemo', name: 'Гемоглобин', size: 5.5e-9, pos: [-8e-9, 3e-9], cmp: true, fact: 'Белок, который носит кислород: четыре субъединицы, в каждой — атом железа.',
  draw(R) {
    const c = [['#e0625a', -0.3, -0.25], ['#c94a6a', 0.3, -0.25], ['#d9745a', -0.3, 0.28], ['#b8506e', 0.3, 0.28]];
    for (const [col, x, y] of c) { const g = ctx.createRadialGradient(x * R - R * 0.1, y * R - R * 0.1, R * 0.05, x * R, y * R, R * 0.5); g.addColorStop(0, '#ffb3a6'); g.addColorStop(1, col); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x * R, y * R, R * 0.46, 0, TAU); ctx.fill(); }
    for (const [, x, y] of c) { ctx.fillStyle = '#ffe28a'; ctx.beginPath(); ctx.arc(x * R * 0.9, y * R * 0.9, R * 0.06, 0, TAU); ctx.fill(); }
  } });
add({ id: 'ribo', name: 'Рибосома', size: 2.5e-8, pos: [3.4e-8, -1.0e-8], cmp: true, fact: 'Молекулярная машина, которая по записи в РНК собирает белки — по несколько аминокислот в секунду.',
  draw(R) {
    ctx.fillStyle = '#8fd6a8'; ctx.beginPath(); ctx.ellipse(0, R * 0.25, R * 0.8, R * 0.55, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2c46b'; ctx.beginPath(); ctx.ellipse(-R * 0.1, -R * 0.42, R * 0.6, R * 0.4, -0.2, 0, TAU); ctx.fill();
  } });
add({ id: 'virus', name: 'Вирус гриппа', size: 1.0e-7, pos: [-1.5e-7, 0.4e-7], cmp: true, fact: 'Около 100 нм: в оптический микроскоп не увидеть. На поверхности — белки-шипы, которыми он цепляется к клеткам.',
  draw(R) {
    for (let i = 0; i < 40; i++) { const a = (i / 40) * TAU; ctx.strokeStyle = i % 3 ? '#d8b36a' : '#ff8a6b'; ctx.lineWidth = Math.max(1, R * 0.05);

function fmtNum(x, d) {
  const s = x >= 100 ? Math.round(x).toString() : x >= 10 ? x.toFixed(d > 0 ? 1 : 0) : x.toFixed(d);
  return s.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ').replace(/,0$/, '');
}
function fmtSize(m) {
  if (m < 1e-15) return 'меньше 10⁻¹⁸ м';
  if (m < 1e-12) return fmtNum(m / 1e-15, 1) + ' фм';
  if (m < 1e-9) return fmtNum(m / 1e-12, 0) + ' пм';
  if (m < 1e-6) return fmtNum(m / 1e-9, 1) + ' нм';
  if (m < 1e-3) return fmtNum(m / 1e-6, 1) + ' мкм';
  if (m < 0.01) return fmtNum(m / 1e-3, 1) + ' мм';
  if (m < 1) return fmtNum(m / 0.01, 1) + ' см';
  if (m < 1e4) return fmtNum(m, m < 10 ? 2 : 0) + ' м';
  if (m < 1e10) return fmtNum(m / 1e3, 0) + ' км';
  if (m < 2e15) return fmtNum(m / AU, m < 1e13 ? 1 : 0) + ' а. е.';
  if (m < 1e6 * LY) return fmtNum(m / LY, 1) + ' св. лет';
  if (m < 1e9 * LY) return fmtNum(m / LY / 1e6, 1) + ' млн св. лет';
  return fmtNum(m / LY / 1e9, 1) + ' млрд св. лет';
}

/* ── шкала справа ────────────────────────────────────────────── */
const SMIN = -18.6, SMAX = 27.2;
const rail = $('#rail');
const railY = (S) => ((SMAX - S) / (SMAX - SMIN)) * 100;
function buildRail() {
  const unitLabels = { '-15': 'фм', '-12': 'пм', '-9': 'нм', '-6': 'мкм', '-3': 'мм', '0': 'метр', '3': 'км', '6': '1000 км', '11.17': 'а. е.', '15.98': 'св. год', '21.98': 'млн св. л.', '24.98': 'млрд св. л.' };
  let html = '<div class="track"></div>';
  for (let s = -18; s <= 27; s++) html += `<div class="tick" style="top:${railY(s)}%;width:${s % 3 === 0 ? 10 : 5}px"></div>`;
  for (const [s, l] of Object.entries(unitLabels)) html += `<div class="lab" style="top:${railY(+s)}%">${l}</div>`;
  for (const o of OBJ) html += `<div class="obj" style="top:${railY(Math.log10(o.size))}%" title="${o.name}"></div>`;
  html += '<div class="cur" id="railCur"><b id="railCurT"></b></div>';
  rail.innerHTML = html;
}
buildRail();

/* ── состояние и ввод ────────────────────────────────────────── */
let S = 7.25, target = 7.25, tour = null, lastInput = 0;
const clampS = (s) => Math.max(SMIN, Math.min(SMAX, s));
function userZoom(d) { target = clampS(target + d); tour = null; lastInput = performance.now(); $('#hint').style.opacity = 0; syncTourBtn(); }
cv.addEventListener('wheel', (e) => { e.preventDefault(); userZoom((e.deltaY > 0 ? 1 : -1) * Math.min(0.5, Math.abs(e.deltaY) * 0.0035)); }, { passive: false });
const pointers = new Map();
let pinch0 = 0;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
cv.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) userZoom(-Math.log10(d / pinch0)); pinch0 = d; }
  else userZoom((e.clientY - prev[1]) * -0.012);
});
const endP = (e) => { pointers.delete(e.pointerId); pinch0 = 0; };
cv.addEventListener('pointerup', endP); cv.addEventListener('pointercancel', endP);
let railDrag = false;
const railSet = (e) => { const r = rail.getBoundingClientRect(); const k = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); target = clampS(SMAX - k * (SMAX - SMIN)); tour = null; syncTourBtn(); lastInput = performance.now(); };
rail.addEventListener('pointerdown', (e) => { railDrag = true; rail.setPointerCapture(e.pointerId); railSet(e); });
rail.addEventListener('pointermove', (e) => { if (railDrag) railSet(e); });
rail.addEventListener('pointerup', () => { railDrag = false; });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') userZoom(0.25);
  if (e.key === 'ArrowDown' || e.key === '-') userZoom(-0.25);
  if (e.key === ' ') { e.preventDefault(); startTour(); }
});
$('#jumps').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.id === 'tour') return;
  target = +b.dataset.s; tour = null; syncTourBtn(); lastInput = performance.now();
});
function startTour() {
  if (tour) { tour = null; syncTourBtn(); return; }
  tour = { phase: 0 };
  syncTourBtn();
}
function syncTourBtn() { $('#tour').textContent = tour ? 'Стоп' : 'Путешествие'; }
$('#tour').onclick = startTour;

/* ── кадр ────────────────────────────────────────────────────── */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize);
resize();

let last = performance.now(), t = 0, focusId = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  t += dt;
  if (tour) {
    const speed = 0.55;
    if (tour.phase === 0) { target = clampS(target - speed * dt * 1.6); if (target <= -17.7) { tour.phase = 1; tour.hold = 1.6; } }
    else if (tour.phase === 1) { tour.hold -= dt; if (tour.hold <= 0) tour.phase = 2; }
    else { target = clampS(target + speed * 1.3 * dt); if (target >= 27.0) { tour = null; syncTourBtn(); } }
  }
  S += (target - S) * Math.min(1, dt * (tour ? 6 : 5));
  const D = Math.min(H, W * 1.25);    // опорный размер: высота, но не шире экрана
  const mpp = Math.pow(10, S) / D;   // метров на CSS-пиксель
  const bg = bgAt(S);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const grd = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  grd.addColorStop(0, `rgb(${bg.map((v) => Math.min(255, v * 1.6 + 6) | 0).join(',')})`);
  grd.addColorStop(1, `rgb(${bg.map((v) => v * 0.6 | 0).join(',')})`);
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  // звёзды — в космических масштабах
  const starA = Math.max(0, Math.min(1, (S - 6.2) / 1.2));
  if (starA > 0) for (const [x, y, b, ph] of STARS) { ctx.fillStyle = `rgba(240,236,228,${starA * (0.15 + b * 0.5) * (0.75 + 0.25 * Math.sin(t * 1.5 + ph))})`; ctx.fillRect(x * W, y * H, b > 0.9 ? 2 : 1.2, b > 0.9 ? 2 : 1.2); }
  // квантовая «пена» в самых малых масштабах
  const qA = Math.max(0, Math.min(1, (-11 - S) / 2));
  if (qA > 0) { const r = rng(Math.floor(t * 8)); for (let i = 0; i < 70; i++) { ctx.fillStyle = `rgba(200,160,255,${qA * r() * 0.25})`; ctx.beginPath(); ctx.arc(r() * W, r() * H, r() * 3, 0, TAU); ctx.fill(); } }

  const cx = W * (W > 820 ? 0.47 : 0.5), cy = H * (W > 820 ? 0.5 : 0.46);
  let best = null, bestD = 1e9;
  const order = OBJ.slice().sort((a, b) => b.size - a.size);
  const vis = [];
  for (const o of order) {
    const R = o.size / 2 / mpp;
    if (R < 1.2 || R > D * 5) continue;
    const fadeIn = Math.min(1, (R - 1.2) / 10), fadeOut = Math.min(1, Math.max(0, (D * 5 - R) / (D * 3.2)));
    // объект «для сравнения» показываем, только пока он сам заметен, иначе он повиснет на центральном
    const cmpK = o.cmp ? Math.max(0, Math.min(1, (R - D * 0.035) / (D * 0.05))) : 1;
    const alpha = fadeIn * fadeOut * cmpK;
    if (alpha <= 0.01) continue;
    const x = cx + o.pos[0] / mpp, y = cy - o.pos[1] / mpp;
    if (x + R < -50 || x - R > W + 50 || y + R < -50 || y - R > H + 50) continue;
    vis.push({ o, R, alpha, x, y });
    const d = Math.abs(Math.log(R / (D * 0.36)));
    if (!o.cmp && d < bestD) { bestD = d; best = o; }
  }
  for (const { o, R, alpha, x, y } of vis) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
    o.draw(R, t);
    ctx.restore();
    // подписи у объектов среднего размера (у объекта в фокусе — карточка слева)
    if (o !== best && R > 16 && R < D * 0.42 && alpha > 0.35) {
      ctx.globalAlpha = Math.min(1, alpha * 1.2) * Math.min(1, (D * 0.42 - R) / (D * 0.1));
      ctx.textAlign = 'center';
      ctx.font = '600 14px Onest, sans-serif'; ctx.fillStyle = '#f2ede4';
      ctx.fillText(o.name, x, y + R + 22);
      ctx.font = '500 12.5px Onest, sans-serif'; ctx.fillStyle = o.cmp ? '#b4ab9f' : '#ffcf7a';
      ctx.fillText(fmtSize(o.size) + (o.cmp ? ' · для сравнения' : ''), x, y + R + 40);
      ctx.globalAlpha = 1;
    }
  }
  // «вы здесь» — перекрестие в центре на средних масштабах
  const hereA = Math.max(0, Math.min(1, (S - 3.2) * 2)) * Math.max(0, Math.min(1, (12.5 - S) / 1.5));
  if (hereA > 0) {
    ctx.globalAlpha = hereA; ctx.strokeStyle = '#ff5a4a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.stroke();
    ctx.font = '600 12px Onest, sans-serif'; ctx.fillStyle = '#ff8a7a'; ctx.textAlign = 'left'; ctx.fillText('вы здесь', cx + 14, cy - 10);
    ctx.globalAlpha = 1;
  }
  if (best && best.id !== focusId) {
    focusId = best.id;
    $('#cName').textContent = best.name;
    $('#cSize').textContent = fmtSize(best.size);
    $('#cFact').textContent = best.fact;
  }
  // линейка
  const barPx = W > 820 ? 150 : 110, meters = barPx * mpp;
  $('#rBar').style.width = barPx + 'px';
  $('#rText').textContent = fmtSize(meters);
  const rc = $('#railCur'); if (rc) { rc.style.top = railY(S) + '%'; $('#railCurT').textContent = `10${sup(Math.round(S))} м`; }
}
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = (n) => String(n).split('').map((c) => SUP[c]).join('');
requestAnimationFrame(frame);
setTimeout(() => { if (!lastInput && !reduceMotion) $('#hint').style.opacity = 1; }, 400);
/* прогрев: по одному объекту в простое рисуем в невидимый холст, чтобы спрайты были готовы до зума */
(function prewarm() {
  const off = document.createElement('canvas').getContext('2d');
  const queue = OBJ.slice();
  const step = () => {
    const o = queue.shift(); if (!o) return;
    ctx = off; try { o.draw(8, 0); } catch (e) { /* пропускаем */ } ctx = mainCtx;
    if (window.requestIdleCallback) window.requestIdleCallback(step, { timeout: 400 }); else setTimeout(step, 60);
  };
  setTimeout(step, 1800);
})();
</script>
</body>
</html>
