<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дрейф языков</title>
<meta name="description" content="Праязык расселяется по карте, а в сёлах копятся звуковые изменения: через века появляются диалекты, родословное древо и сравнительная таблица слов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#F1E6CC;
  --parch2:#E6D6B2;
  --ink:#2A1E14;
  --sepia:#6A4C2C;
  --red:#A33222;
  --blue:#2F5A78;
  --line:rgba(42,30,20,.22);
  --serif:'Old Standard TT','Georgia',serif;
  --sans:'PT Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#D9C9A4;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,520px);min-height:100vh}
.mapwrap{position:relative;min-height:100vh;background:#CDBB93;display:grid;place-items:center;padding:22px}
/* карта и подпись под ней — как таблица в атласе */
.plate{width:min(100%,calc((100vh - 136px) * 1.3158));display:grid;gap:14px}
#map{display:block;width:100%;height:auto;box-shadow:0 18px 40px rgba(60,40,15,.35),0 2px 6px rgba(60,40,15,.3);cursor:default;touch-action:manipulation}
.mapfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 28px;align-items:start}
.legend{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font:400 14px/1.35 var(--sans);color:var(--ink);min-height:40px}
.legend .lh{font:italic 400 15px/1.35 var(--serif);color:var(--sepia)}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0;border:1px solid rgba(42,30,20,.55)}
.legend em{font:italic 400 16px/1 var(--serif)}
.legend small{font-size:13px;color:var(--sepia)}
.legend .iso{display:inline-block;width:22px;height:0;border-top:2px dashed var(--red);margin-right:7px;vertical-align:4px}
.maphint{margin:0;font:italic 400 14px/1.35 var(--serif);color:var(--sepia);max-width:330px;text-align:right}
.card{position:absolute;min-width:250px;max-width:320px;background:var(--parch);border:1px solid var(--ink);padding:14px 16px 12px;box-shadow:0 10px 26px rgba(60,40,15,.3);font:400 14px/1.4 var(--sans);display:none}
.card.show{display:block}
.card h2{margin:0 0 2px;font:700 20px/1.1 var(--serif)}
.card .ety{font:italic 400 14px/1.3 var(--serif);color:var(--sepia);margin-bottom:8px}
.card ul{list-style:none;margin:8px 0 0;padding:0;font:400 13px/1.45 var(--sans);max-height:190px;overflow:auto;display:grid;gap:3px}
.card li{display:grid;grid-template-columns:52px 1fr;gap:6px}
.card li span{color:var(--red);font:400 13px/1.45 var(--serif)}
.card .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;font:400 20px/1 var(--serif);cursor:pointer;color:var(--ink)}

.panel{background:var(--parch);border-left:1px solid var(--ink);padding:30px 30px 26px;display:flex;flex-direction:column;gap:18px;min-width:0;position:relative}
.panel::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none}
.kicker{font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--sepia)}
h1{margin:6px 0 0;font:700 44px/1 var(--serif);letter-spacing:-.005em}
.lead{margin:0;font:400 16px/1.45 var(--sans);color:var(--ink);max-width:30em}

.timebar{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0}
.year{font:400 46px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums;min-width:4.4ch}
.year small{display:block;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--sepia);margin-bottom:6px}
.tctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font:700 13px/1 var(--sans);height:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--parch)}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn.on{background:var(--ink);color:var(--parch)}
.btn svg{width:14px;height:14px;fill:currentColor}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{appearance:none;border:0;border-right:1px solid var(--ink);background:none;font:700 13px/1 var(--sans);height:38px;padding:0 11px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--parch)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:-3px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--ink)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;font:700 14px/1 var(--sans);padding:10px 14px 11px;cursor:pointer;color:var(--sepia)}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.pane{display:none;min-height:0}
.pane.on{display:block}
.tablewrap{overflow-x:auto;max-height:calc(100vh - 470px);min-height:240px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font:400 14px/1.2 var(--sans)}
th{position:sticky;top:0;background:var(--parch);text-align:left;font:700 12.5px/1.2 var(--sans);padding:8px 6px 7px;border-bottom:1px solid var(--ink);white-space:nowrap;z-index:1}
th i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
td{padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td.gl{font:700 13px/1 var(--sans);color:var(--sepia);position:sticky;left:0;background:var(--parch)}
th:first-child{left:0;z-index:2}
td.f{font:italic 400 16px/1 var(--serif)}
td.f b{font-weight:400;color:var(--red)}
tr{cursor:pointer}
tr:hover td{background:rgba(163,50,34,.06)}
tr.sel td{background:rgba(163,50,34,.12)}
.tree svg{width:100%;height:auto;display:block}
.chron{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-height:calc(100vh - 470px);overflow:auto;min-height:240px}
.chron li{font:400 14px/1.4 var(--sans);display:grid;grid-template-columns:62px 1fr;gap:10px}
.chron time{font:400 16px/1.2 var(--serif);color:var(--red)}
.chron em{font:italic 400 15px/1 var(--serif)}
details.params{border-top:1px solid var(--ink);padding-top:12px;margin-top:auto}
details.params summary{font:700 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--sepia);list-style:none;padding:6px 0}
details.params summary::-webkit-details-marker{display:none}
details.params summary::before{content:"+ ";}
details.params[open] summary::before{content:"− ";}
.sl{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin-top:10px;font:400 14px/1.2 var(--sans)}
.sl output{font:400 13px/1 var(--sans);color:var(--sepia);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--parch);border:1.5px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--parch);border:1.5px solid var(--ink)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--red);outline-offset:2px}
.wordmode{font:400 14px/1.35 var(--sans);color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:24px}
.wordmode b{font:italic 400 17px/1 var(--serif);color:var(--red)}
.linkbtn{appearance:none;background:none;border:0;padding:4px 0;font:700 13px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
.linkbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .mapwrap{min-height:0;padding:10px}
  #map{max-height:none;width:100%}
  .mapwrap{display:block}
  .plate{width:100%;gap:10px}
  .mapfoot{grid-template-columns:1fr;padding:0 2px}
  .maphint{text-align:left;max-width:none;font-size:13.5px}
  .legend{min-height:0;font-size:13.5px}
  .panel{border-left:0;border-top:1px solid var(--ink);padding:22px 18px}
  h1{font-size:36px}
  .year{font-size:38px}
  .tablewrap,.chron{max-height:none}
  .sl{grid-template-columns:100px 1fr 40px}
}
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <figure class="plate" style="margin:0">
      <canvas id="map" width="1000" height="760" aria-label="Карта: сёла, горы, реки и диалектные области"></canvas>
      <figcaption class="mapfoot">
        <div class="legend" id="legend" aria-live="polite"></div>
        <p class="maphint" id="maphint">Клик по&nbsp;селу&nbsp;— его звуковая биография. Клик по&nbsp;строке таблицы&nbsp;— как это слово звучит по&nbsp;всей карте.</p>
      </figcaption>
    </figure>
    <div class="card" id="card" role="dialog" aria-label="Село"><button class="x" id="cardX" aria-label="Закрыть">×</button><div id="cardBody"></div></div>
  </div>

  <aside class="panel">
    <div>
      <div class="kicker">014 · слово, язык, история</div>
      <h1>Дрейф языков</h1>
    </div>
    <p class="lead">Праязык расселяется по&nbsp;карте. В&nbsp;каждом селе копятся звуковые изменения и&nbsp;расходятся к&nbsp;соседям — горы, реки и&nbsp;море мешают общению, и&nbsp;язык распадается на&nbsp;говоры.</p>

    <div class="timebar">
      <div class="year"><small>год от начала</small><span id="year">0</span></div>
      <div class="tctl">
        <button class="btn" id="playBtn" aria-label="Пауза"><svg viewBox="0 0 14 14" id="playIco"><path d="M3 2h3v10H3zM8 2h3v10H8z"/></svg><span id="playLbl">Пауза</span></button>
        <div class="seg" role="group" aria-label="Скорость">
          <button data-s="1" class="on">×1</button><button data-s="4">×4</button><button data-s="12">×12</button>
        </div>
        <button class="btn" id="restartBtn">Сначала</button>
        <button class="btn" id="newBtn">Новый мир</button>
      </div>
    </div>

    <div class="wordmode" id="wordmode"><span>На карте — названия сёл.</span></div>

    <div>
      <div class="tabs" role="tablist">
        <button class="tab on" data-t="words" role="tab" aria-selected="true">Слова</button>
        <button class="tab" data-t="tree" role="tab" aria-selected="false">Древо</button>
        <button class="tab" data-t="chron" role="tab" aria-selected="false">Летопись</button>
      </div>
      <div class="pane on" id="p-words"><div class="tablewrap"><table id="tbl"></table></div></div>
      <div class="pane tree" id="p-tree"></div>
      <div class="pane" id="p-chron"><ol class="chron" id="chron"></ol></div>
    </div>

    <details class="params">
      <summary>Параметры мира</summary>
      <div class="sl"><label for="sInn">Новшества</label><input id="sInn" type="range" min="0.2" max="3" step="0.1" value="1"><output id="oInn">×1,0</output></div>
      <div class="sl"><label for="sCon">Общение</label><input id="sCon" type="range" min="0" max="2" step="0.1" value="1"><output id="oCon">×1,0</output></div>
      <div class="sl"><label for="sMnt">Горы мешают</label><input id="sMnt" type="range" min="0" max="1" step="0.05" value="0.9"><output id="oMnt">90%</output></div>
    </details>
  </aside>
</div>

<script>
'use strict';
(function () {
/* ============================================================
   1. Фонология праязыка и звуковые законы.
      Слово — массив фонем (кириллицей) и индекс ударной гласной.
   ============================================================ */
const VOW = new Set(['а', 'о', 'у', 'е', 'и', 'ы']);
const FRONT = new Set(['е', 'и']);
const VOICED = { п: 'б', т: 'д', к: 'г', с: 'з', ф: 'в', ш: 'ж', ц: 'дз', х: 'г' };
const DEVOICE = { б: 'п', д: 'т', г: 'к', з: 'с', в: 'ф', ж: 'ш', дз: 'ц' };
const OBSTR = new Set(['п', 'б', 'т', 'д', 'к', 'г', 'с', 'з', 'ф', 'в', 'ш', 'ж', 'х', 'ц', 'ч', 'дз']);
const isV = c => VOW.has(c), isC = c => c != null && !VOW.has(c);

function parse(str) { // «ве́дор» → {t:[в,е,д,о,р], s:1}
  const t = []; let s = -1;
  for (const ch of str.normalize('NFD')) { if (ch === '́') s = t.length - 1; else t.push(ch.normalize('NFC')); }
  if (s < 0) s = t.findIndex(isV);
  return { t, s };
}
const show = w => w.t.join('');
const clone = w => ({ t: w.t.slice(), s: w.s });
function del(w, i) { w.t.splice(i, 1); if (w.s > i) w.s--; else if (w.s === i) w.s = -1; }
function ins(w, i, c) { w.t.splice(i, 0, c); if (w.s >= i) w.s++; }
const vowelsLeft = w => w.t.filter(isV).length;

// каталог законов: каждый применяется регулярно — ко всем словам села сразу
const RULES = [
  { id: 'devoice', name: 'оглушение на конце слова', ex: 'звонкий на конце становится глухим', w: 1.2,
    ap(w) { const i = w.t.length - 1; if (DEVOICE[w.t[i]]) w.t[i] = DEVOICE[w.t[i]]; } },
  { id: 'palat', name: 'палатализация', ex: 'к, г, х перед е и и превращаются в ч, ж, ш', w: 1.1,
    ap(w) { for (let i = 0; i < w.t.length - 1; i++) if (FRONT.has(w.t[i + 1])) { const m = { к: 'ч', г: 'ж', х: 'ш' }[w.t[i]]; if (m) w.t[i] = m; } } },
  { id: 'lenit', name: 'озвончение между гласными', ex: 'п, т, к, с между гласными звучат звонко', w: 1,
    ap(w) { for (let i = 1; i < w.t.length - 1; i++) if (isV(w.t[i - 1]) && isV(w.t[i + 1]) && ['п', 'т', 'к', 'с'].includes(w.t[i])) w.t[i] = VOICED[w.t[i]]; } },
  { id: 'spir', name: 'спирантизация', ex: 'б и г между гласными ослабевают до в и х', w: 0.8,
    ap(w) { for (let i = 1; i < w.t.length - 1; i++) if (isV(w.t[i - 1]) && isV(w.t[i + 1])) { if (w.t[i] === 'б') w.t[i] = 'в'; else if (w.t[i] === 'г') w.t[i] = 'х'; } } },
  { id: 'akan', name: 'аканье', ex: 'безударное о звучит как а', w: 1.2,
    ap(w) { w.t.forEach((c, i) => { if (c === 'о' && i !== w.s) w.t[i] = 'а'; }); } },
  { id: 'ikan', name: 'иканье', ex: 'безударное е звучит как и', w: 0.9,
    ap(w) { w.t.forEach((c, i) => { if (c === 'е' && i !== w.s) w.t[i] = 'и'; }); } },
  { id: 'raiseE', name: 'сужение ударного е', ex: 'ударное е переходит в и', w: 0.6,
    ap(w) { if (w.t[w.s] === 'е') w.t[w.s] = 'и'; } },
  { id: 'raiseO', name: 'сужение ударного о', ex: 'ударное о переходит в у', w: 0.6,
    ap(w) { if (w.t[w.s] === 'о') w.t[w.s] = 'у'; } },
  { id: 'apoc', name: 'отпадение конечного гласного', ex: 'безударный гласный на конце исчезает', w: 1,
    ap(w) { const n = w.t.length - 1; if (n >= 3 && isV(w.t[n]) && n !== w.s && isC(w.t[n - 1]) && isV(w.t[n - 2]) && vowelsLeft(w) >= 2) del(w, n); } },
  { id: 'sync', name: 'выпадение безударного', ex: 'безударный гласный между согласными выпадает', w: 0.7,
    ap(w) { for (let i = w.t.length - 2; i >= 1; i--) if (isV(w.t[i]) && i !== w.s && isC(w.t[i - 1]) && isC(w.t[i + 1]) && !isC(w.t[i - 2]) && !isC(w.t[i + 2]) && vowelsLeft(w) >= 2) { del(w, i); break; } } },
  { id: 'metath', name: 'перестановка плавных', ex: 'ол и ор между согласными становятся ло и ро', w: 0.7,
    ap(w) { for (let i = 1; i < w.t.length - 2; i++) if (isC(w.t[i - 1]) && (w.t[i] === 'о' || w.t[i] === 'е') && (w.t[i + 1] === 'л' || w.t[i + 1] === 'р') && isC(w.t[i + 2])) { const v = w.t[i]; const st = w.s === i; w.t[i] = w.t[i + 1]; w.t[i + 1] = v; if (st) w.s = i + 1; } } },
  { id: 'pleo', name: 'полногласие', ex: 'между согласными ол, ор, ер распеваются в оло, оро, ере', w: 0.7,
    ap(w) { for (let i = 1; i < w.t.length - 2; i++) if (isC(w.t[i - 1]) && (w.t[i] === 'о' || w.t[i] === 'е') && (w.t[i + 1] === 'л' || w.t[i + 1] === 'р') && isC(w.t[i + 2])) { ins(w, i + 2, w.t[i]); i += 2; } } },
  { id: 'clust', name: 'упрощение групп', ex: 'кт → т (перед е, и — ч), тл и дл → л', w: 0.8,
    ap(w) { for (let i = 0; i < w.t.length - 1; i++) { const a = w.t[i], b = w.t[i + 1];
      if (a === 'к' && b === 'т') { if (FRONT.has(w.t[i + 2])) { w.t[i + 1] = 'ч'; } del(w, i); }
      else if ((a === 'т' || a === 'д') && b === 'л') del(w, i); } } },
  { id: 'rhot', name: 'ротацизм', ex: 'з между гласными превращается в р', w: 0.6,
    ap(w) { for (let i = 1; i < w.t.length - 1; i++) if (w.t[i] === 'з' && isV(w.t[i - 1]) && isV(w.t[i + 1])) w.t[i] = 'р'; } },
  { id: 'hdrop', name: 'потеря начального х', ex: 'начальное х исчезает', w: 0.6,
    ap(w) { if (w.t[0] === 'х' && w.t.length > 2 && isV(w.t[1])) del(w, 0); } },
  { id: 'proth', name: 'протеза', ex: 'перед начальным о и у появляется в', w: 0.7,
    ap(w) { if (w.t[0] === 'о' || w.t[0] === 'у') ins(w, 0, 'в'); } },
  { id: 'assim', name: 'уподобление по звонкости', ex: 'шумный согласный перенимает звонкость следующего', w: 0.8,
    ap(w) { for (let i = w.t.length - 2; i >= 0; i--) { const a = w.t[i], b = w.t[i + 1]; if (!OBSTR.has(a) || !OBSTR.has(b) || b === 'в') continue;
      const bVoiced = !!DEVOICE[b]; if (bVoiced && VOICED[a]) w.t[i] = VOICED[a]; else if (!bVoiced && DEVOICE[a]) w.t[i] = DEVOICE[a]; } } },
  { id: 'assib', name: 'цеканье и дзеканье', ex: 'т и д перед и произносятся как ц и дз', w: 0.7,
    ap(w) { for (let i = 0; i < w.t.length - 1; i++) if (w.t[i + 1] === 'и') { if (w.t[i] === 'т') w.t[i] = 'ц'; else if (w.t[i] === 'д') w.t[i] = 'дз'; } } },
  { id: 'nloss', name: 'утрата носового', ex: 'н перед согласным исчезает', w: 0.5,
    ap(w) { for (let i = w.t.length - 2; i >= 1; i--) if (w.t[i] === 'н' && isC(w.t[i + 1]) && isV(w.t[i - 1])) del(w, i); } },
  { id: 'lvoc', name: 'л в у неслоговое', ex: 'л в конце слога превращается в ў', w: 0.6,

  let h;
  if (selWord >= 0) {
    const cnt = new Map();
    for (const v of villages) { const k = show(v.words[selWord]); cnt.set(k, (cnt.get(k) || 0) + 1); }
    const items = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 7);
    h = `<span class="lh">«${LEX[selWord][0]}»:</span>` + items.map(([f, n]) => `<span><i style="background:${formColor(parse(f))}"></i><em>${f}</em> <small>${n}${NBSP}${plural(n, 'село', 'села', 'сёл')}</small></span>`).join('');
  } else if (selEv >= 0) {
    const ev = events[selEv], n = villages.filter(v => v.ev.has(selEv)).length;
    h = `<span><b class="iso"></b>${RULE[ev.rule] ? RULE[ev.rule].name : 'новое слово'}, ${ev.year}${NBSP}г.: принято в${NBSP}${n}${NBSP}${plural(n, 'селе', 'сёлах', 'сёлах')} из${NBSP}${villages.length}</span>`;
  } else {
    h = '<span class="lh">Говоры:</span>' + clusters.map(c => `<span><i style="background:${c.color}"></i>${cap(show(villages[c.med].name))} <small>${c.members.length}${NBSP}${plural(c.members.length, 'село', 'села', 'сёл')}</small></span>`).join('');
  }
  if (h !== legendSig) { legendSig = h; $('legend').innerHTML = h; }
}
function renderChron() {
  $('chron').innerHTML = chronicle.slice(0, 40).map(c => `<li${c.ev != null ? ` data-ev="${c.ev}" style="cursor:pointer"` : ''}><time>${c.year}</time><span>${c.html}</span></li>`).join('');
}
$('chron').addEventListener('click', e => { const li = e.target.closest('li[data-ev]'); if (!li) return; selEv = +li.dataset.ev; selWord = -1; washDirty = true; updateWordMode(); });
let chronSig = '';
function renderAll() {
  $('year').textContent = year;
  renderLegend();
  if (tab === 'words' && tableDirty) renderTable();
  if (tab === 'tree' && treeDirty) renderTree();
  if (tab === 'chron') { const s = chronicle.length + ':' + (chronicle[0] ? chronicle[0].year : 0); if (s !== chronSig) { chronSig = s; renderChron(); } }
}
for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tab').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', String(x === b)); });
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
  tableDirty = treeDirty = true; chronSig = ''; renderAll();
});

/* ——— карточка села ——— */
function mapXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * MW, (e.clientY - r.top) / r.height * MH]; }
function nearestV(x, y) { let b = -1, bd = 18 * 18; villages.forEach((v, i) => { const d = (v.x - x) ** 2 + (v.y - y) ** 2; if (d < bd) { bd = d; b = i; } }); return b; }
cv.addEventListener('mousemove', e => { const [x, y] = mapXY(e); const h = nearestV(x, y); if (h !== hoverV) { hoverV = h; mapDirty = true; } cv.style.cursor = hoverV >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('mouseleave', () => { if (hoverV >= 0) { hoverV = -1; mapDirty = true; } });
cv.addEventListener('click', e => {
  const [x, y] = mapXY(e), i = nearestV(x, y);
  if (i < 0) { $('card').classList.remove('show'); return; }
  openCard(i, e);
});
function openCard(i, e) {
  const v = villages[i];
  const par = v.parent != null ? cap(show(villages[v.parent].name)) : null;
  const items = v.hist.filter(h => h.ex).slice(-10).reverse().map(h => { const ev = events[h.ev]; return `<li><span>${h.year}${NBSP}г.</span><div>${ev.type === 'lex' ? 'новое слово' : RULE[ev.rule].name}: «${h.ex.g}» <i>${h.ex.before}${NBSP}→ ${h.ex.after}</i></div></li>`; }).join('');
  $('cardBody').innerHTML = `<h2>${cap(show(v.name))}</h2><div class="ety">от праформы *${withStress(v.proto)}${v.home ? ' · прародина' : ''}</div>
    <div>Основано в${NBSP}${v.founded}${NBSP}г.${par ? ` выходцами из${NBSP}села ${par}` : ''}. Законов и${NBSP}новшеств: ${v.hist.length}.</div>${items ? `<ul>${items}</ul>` : '<div style="margin-top:6px;color:#6A4C2C">Пока говорит на${NBSP}праязыке.</div>'}`;
  const card = $('card'), wrap = card.parentElement.getBoundingClientRect();
  card.classList.add('show');
  const r = cv.getBoundingClientRect();
  let left = r.left - wrap.left + v.x / MW * r.width + 16, top = r.top - wrap.top + v.y / MH * r.height - 20;
  if (left + 330 > wrap.width) left -= 360;
  card.style.left = Math.max(8, left) + 'px'; card.style.top = Math.max(8, Math.min(top, wrap.height - card.offsetHeight - 8)) + 'px';
}
$('cardX').addEventListener('click', () => $('card').classList.remove('show'));

/* ——— управление временем и параметрами ——— */
let playing = true, speed = 1, acc = 0;
function setPlaying(p) {
  playing = p; $('playLbl').textContent = p ? 'Пауза' : 'Дальше';
  $('playIco').innerHTML = p ? '<path d="M3 2h3v10H3zM8 2h3v10H8z"/>' : '<path d="M3 1.5v11l9-5.5z"/>';
  $('playBtn').setAttribute('aria-label', p ? 'Пауза' : 'Дальше');
}
$('playBtn').addEventListener('click', () => { if (year >= 1500) { initSim(seed); prewarm(0); } setPlaying(!playing); });
for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => { speed = +b.dataset.s; document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b)); });
$('restartBtn').addEventListener('click', () => { initSim(seed); selWord = -1; selEv = -1; updateWordMode(); setPlaying(true); });
$('newBtn').addEventListener('click', () => { initSim(Math.floor(Math.random() * 900) + 10); prewarm(300); selWord = -1; selEv = -1; updateWordMode(); setPlaying(true); });
const fmt1 = v => '×' + v.toFixed(1).replace('.', ',');
$('sInn').addEventListener('input', e => { params.inn = +e.target.value; $('oInn').textContent = fmt1(params.inn); });
$('sCon').addEventListener('input', e => { params.con = +e.target.value; $('oCon').textContent = fmt1(params.con); });
$('sMnt').addEventListener('input', e => { params.mnt = +e.target.value; $('oMnt').textContent = Math.round(params.mnt * 100) + '%'; rebuildEdges(); mapDirty = true; });

let warming = false;
function prewarm(toYear) { warming = true; while (year < toYear) step(); warming = false; clusterize(); tableDirty = treeDirty = true; washDirty = true; renderAll(); }

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && year < 1500) {
    acc += dt * speed * 4; // 4 шага (40 лет) в секунду на ×1
    let n = 0;
    while (acc >= 1 && n < 20 && year < 1500) { step(); acc -= 1; n++; }
    if (n) { washDirty = true; mapDirty = true; }
    if (year >= 1500) { setPlaying(false); $('playLbl').textContent = 'Заново'; clusterize(); chronicle.unshift({ year, html: 'Прошло полторы тысячи лет. Сравните говоры во вкладке «Древо».' }); }
  }
  if (mapDirty || washDirty) { mapDirty = false; drawMap(now); }
  renderAll();
}

setupCanvas();
// картуш и подписи статичного слоя — шрифтом Old Standard, как только он загрузится
if (document.fonts) document.fonts.ready.then(() => { drawStatic(); mapDirty = true; });
initSim(seed);
prewarm(820);
updateWordMode();
requestAnimationFrame(frame);
addEventListener('resize', () => { mapDirty = true; const d = Math.min(window.devicePixelRatio || 1, 2); if (d !== DPR) { setupCanvas(); drawStatic(); washDirty = true; } });
})();
</script>
</body>
